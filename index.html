, ante US$ 423 milhões no 1T2025 [PR/10-Q]\n- Aquisição da Lindsey Oil Refinery (Reino Unido) concluída em abril/2026 [PR]\n\n**Dívida e Retorno de Capital**\n- Dívida total: US$ 27.124 milhões, ante US$ 19.716 milhões no fim de 2025 — Term Loan de US$ 2,25 bilhões firmado em 18/03/2026 [PR/10-Q]\n- Retorno total: US$ 778 milhões (US$ 269 milhões recompras + US$ 509 milhões dividendos) [PR]\n- Dividendo declarado: US$ 1,27/ação, alta de 7% [10-Q][PR]", "conference_call_summary": "Nenhuma transcrição localizada na SEC nem no site de RI. Citação do CEO Mark Lashier no press release: \"We are confident in our ability to navigate market volatility given our integrated business and strong balance sheet.\"\n^Tradução livre: \"Estamos confiantes em nossa capacidade de navegar pela volatilidade de mercado, graças ao nosso negócio integrado e à solidez do nosso balanço patrimonial.\"", "commodity_commentary": "A Reuters — cujo conteúdo circulou também via BNN Bloomberg — noticiou que a Phillips 66 registrou lucro surpresa no primeiro trimestre de 2026, revertendo as expectativas do mercado: o lucro ajustado por ação veio em US$ 0,49, muito acima da previsão de Wall Street, que projetava prejuízo ajustado de US$ 0,40 por ação [Reuters]. O lucro líquido total somou US$ 207 milhões (US$ 0,51 por ação diluída), sustentado pela forte recuperação das margens de refino: a margem realizada subiu para US$ 10,11 por barril, ante US$ 6,81 no mesmo trimestre do ano anterior, com o resultado ajustado antes de impostos do segmento de refino saltando para US$ 208 milhões, revertendo um prejuízo de US$ 937 milhões um ano antes [Reuters].\n\nSegundo a reportagem, a utilização da capacidade de refino subiu para 95%, ante 80% no mesmo período de 2025, beneficiada por margens de refino ao longo da Costa do Golfo dos EUA entre as mais favoráveis dos últimos anos — as margens de referência nos EUA subiram cerca de 73% na comparação anual no trimestre [Reuters]. As ações da Phillips 66 subiram 1,7% no pré-mercado logo após a divulgação dos resultados, refletindo a reação inicial positiva dos investidores à reversão de lucro [Reuters].\n\nA companhia também elevou o dividendo trimestral anualizado em 7% e encerrou o trimestre com liquidez de aproximadamente US$ 6,0 bilhões, dados que, segundo a cobertura, reforçaram a leitura do mercado de que a Phillips 66 está conseguindo capitalizar o momento favorável de margens após concluir a integração total das refinarias de Borger e Wood River no início do ano [Reuters]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "8-K de 29/04/2026 (1T2026) — release mais recente disponível em 07/07/2026. Nenhuma transcrição de call encontrada.", "commentary_sources": [{"outlet": "Reuters", "title": "Phillips 66 posts surprise profit on higher refining margins", "url": "https://www.bnnbloomberg.ca/business/2026/04/29/phillips-66-posts-surprise-profit-on-higher-refining-margins/", "captured_at": "2026-07-08T00:00:00Z"}]}, "conocophillips": {"company_id": "conocophillips", "accession_number": "0001163165-26-000016", "company_name": "ConocoPhillips", "commodities": ["oil", "natural gas"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "cop-20260430x8kexx991.htm", "label": "Press release da empresa — título original: \"ConocoPhillips announces first-quarter 2026 results and quarterly dividend\" (Anexo 99.1 ao Formulário 8-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/1163165/000116316526000016/cop-20260430x8kexx991.htm", "captured_at": "2026-07-07T00:00:00Z"}, {"filename": "cop-20260430x8kexx992.htm", "label": "Informações financeiras suplementares detalhadas — título original: \"First-Quarter 2026 Detailed Supplemental Information\" (Anexo 99.2 ao Formulário 8-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/1163165/000116316526000016/cop-20260430x8kexx992.htm", "captured_at": "2026- ada na SEC como documento primário. Citação do CEO Ryan Lance no press release: \"Our thoughts are with our team, partners and all those impacted by the ongoing conflict in the Middle East. Amid continued macro volatility, ConocoPhillips delivered another quarter of strong financial and operational performance.\"\n^Tradução livre: \"Nossos pensamentos estão com nossa equipe, parceiros e todos os afetados pelo conflito em curso no Oriente Médio. Em meio à volatilidade macroeconômica contínua, a ConocoPhillips entregou mais um trimestre de forte desempenho financeiro e operacional.\"", "commodity_commentary": "A Reuters noticiou, em fevereiro de 2026, que a ConocoPhillips havia estabelecido meta de corte de custos de US$ 1 bilhão para 2026, após o lucro do quarto trimestre de 2025 ter ficado abaixo das expectativas dos analistas em meio à fraqueza dos preços do petróleo — o lucro ajustado por ação de US$ 1,02 ficou aquém da média de US$ 1,11 esperada pelo mercado, segundo dados compilados pela agência [Reuters].\n\nJá no primeiro trimestre de 2026, divulgado no fim de abril, a companhia reportou lucro ajustado por ação de US$ 1,89, acima do consenso de analistas — uma reviravolta frente ao trimestre anterior —, com receita de US$ 15,76 bilhões. Ainda assim, o lucro líquido total de US$ 2,2 bilhões (US$ 1,78 por ação) representou queda de 21% frente a igual período de 2025, refletindo produção 80 mil barris de óleo equivalente por dia menor na comparação anual e preços realizados 6% inferiores [Reuters]. A empresa gerou US$ 5,4 bilhões em caixa das operações e devolveu US$ 2,0 bilhões a acionistas entre recompras e dividendos.\n\nApesar da superação do consenso, a companhia revisou a projeção de produção para 2026 para uma faixa entre 2,295 e 2,325 milhões de barris de óleo equivalente por dia, abaixo da estimativa anterior, o que a cobertura associou a certa cautela do mercado nas semanas seguintes, em meio a preocupações com o aumento do capex e riscos geopolíticos l tivas de Wall Street para o primeiro trimestre de 2026, divulgado em 5 de maio [Reuters]. O lucro ajustado por ação ficou em US$ 1,65, muito acima da média das estimativas de analistas [Reuters]. A maior refinadora dos EUA por volume reportou receita de US$ 34,57 bilhões, também acima do previsto, e reverteu o prejuízo líquido de US$ 74 milhões do 1T25 para um lucro líquido de US$ 511 milhões [Reuters].\n\nDe acordo com a Reuters, o resultado foi impulsionado pela margem de refino e marketing, que somou US$ 17,74 por barril, alta de 32,6% ante o ano anterior, refletindo o aperto na oferta global de combustíveis causado pela guerra no Oriente Médio e pelo quase fechamento do Estreito de Hormuz, que levaram as exportações americanas de derivados a recorde em março [Reuters]. A reportagem destaca que a companhia elevou o programa de recompra de ações em US$ 5 bilhões e devolveu mais de US$ 1 bilhão aos acionistas no trimestre [Reuters].\n\nA reação do mercado foi positiva: as ações da Marathon subiram 2,8% nos primeiros negócios após o resultado, consolidando uma valorização de cerca de 60% no acumulado de 2026 [Reuters]. A imprensa financeira enquadrou o resultado dentro de uma tendência mais ampla entre refinadoras americanas, cujos lucros do primeiro trimestre foram impulsionados pelas interrupções de fornecimento ligadas ao conflito no Irã [Reuters]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "8-K de 05/05/2026 (1T26) — release mais recente disponível em 07/07/2026. Nenhuma transcrição de call encontrada como documento primário.", "commentary_sources": [{"outlet": "Reuters", "title": "UPDATE 2-Marathon Petroleum profit beats estimates on refining margin boost", "url": "https://www.sahmcapital.com/news/content/update-2-marathon-petroleum-profit-beats-estimates-on-refining-margin-boost-2026-05-05", "captured_at": "2026-07-07T00:00:00Z"}]}, "exxonmobil": {"company_id": "exxonmobil", "accession_number": "0000034088-26-000065", "company_name": "Exxon Mobil Corporation", "commodities": ["oil", "natural gas"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "livef8k1q26991.htm", "label": "Press release da empresa — título original: \"ExxonMobil Announces First-Quarter 2026 Results\" (Anexo 99.1 ao Formulário 8-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/34088/000003408826000065/livef8k1q26991.htm", "captured_at": "2026-07-07T18:48:04Z"}, {"filename": "livef8k1q26992.htm", "label": "Sumário de dados para investidores (Anexo 99.2 ao Formulário 8-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/34088/000003408826000065/livef8k1q26992.htm", "captured_at": "2026-07-07T18:48:04Z"}, {"filename": "xom-20260331.htm", "label": "Formulário 10-Q referente ao trimestre encerrado em 31/03/2026", "source_url": "https://www.sec.gov/Archives/edgar/data/34088/000003408826000067/xom-20260331.htm", "captured_at": "2026-07-07T18:48:04Z"}], "tabs": {"earnings_summary": "**Resultados do 1T26 (encerrado 31/03/2026), divulgado 01/05/2026**\n\n- Lucro líquido atribuível (GAAP): US$ 4,183 bilhões (US$ 1,00/ação), ante US$ 7,713 bilhões (US$ 1,76/ação) no 1T25 [PR]\n- Lucro excl. itens identificados e efeitos de tempo (não-GAAP): US$ 8,772 bilhões (US$ 2,09/ação), ante US$ 7,584 bilhões no 1T25 [PR]\n- Efeitos de tempo desfavoráveis de US$ 3,883 bilhões por descasamento de marcação a mercado de derivativos [PR]\n- Receita: US$ 83,161 bilhões, ante US$ 81,058 bilhões no 1T25 [PR]\n\n**Segmentos**\n- Upstream: US$ 5,737 bilhões GAAP (excl. itens: US$ 6,265 bilhões); produção de 4.594 mil BOE/dia; recorde na Guiana (>900 mil bpd) [PR]\n- Energy Products: prejuízo GAAP de US$ 1,262 bilhão (excl. itens: lucro de US$ 2,799 bilhões, +US$ 1,9 bi a/a) por margens melhores [PR]\n- Chemical Products: US$ 110 milhões, queda de US$ 163 milhões a/a por margens mais fracas [PR]\n\n**Fluxo de Caixa e Capex**\n- Caixa operacional (GAAP): US$ 8,705 bilhões, ante US$ 12,953 bilhões no 1T25 [PR]\n- Fluxo de caixa livre: US$ 2,699 bilhões, ante US$ 8,840 bilhões no 1T25 [PR]\n- Capex: US$ 6,187 bilhões, dentro da faixa de guidance anual de US$ 27-29 bilhões [PR]\n\n**Retorno de Capital**\n- Distribuições totais: US$ 9,2 bilhões (US$ 4,3 bi dividendos + US$ 4,9 bi recompras) [PR]\n- Dívida total: US$ 47,7 bilhões, ante US$ 43,5 bilhões no fim de 2025 [PR/10-Q]\n\n**Guidance**\n- Capex 2026: US$ 27-29 bilhões (mantido) [PR/10-Q]\n- Recompra 2026: ~US$ 20 bilhões [10-Q]", "conference_call_summary": "Transcrição obtida via site de RI (fonte secundária, não arquivada na SEC). Citação do CEO Darren Woods: \"This quarter demonstrated that ExxonMobil is a fundamentally stronger company than it was a few years ago, built to perform through disruptions and across market cycles.\"\n^Tradução livre: \"Este trimestre demonstrou que a ExxonMobil é uma empresa fundamentalmente mais forte do que era há poucos anos, construída para performar através de disrupções e ao longo de ciclos de mercado.\" Sobre o Estreito de Ormuz: \"Uma vez que o Estreito reabra, levará algum tempo para retomar um fluxo estável — estimamos uma defasagem de um a dois meses.\"", "commodity_commentary": "A Bloomberg noticiou que a Exxon Mobil superou as previsões dos analistas no primeiro trimestre de 2026, divulgado em 1º de maio, mesmo em meio à turbulência causada pela guerra entre EUA/Israel e o Irã [Bloomberg]. O lucro ajustado por ação foi de US$ 1,16, 20 centavos acima da média das estimativas [Bloomberg]. Ainda assim, o lucro líquido reportado caiu para US$ 4,2 bilhões (US$ 4,9 bilhões em base ajustada), o menor patamar em cinco anos, pressionado por uma perda de US$ 706 milhões em hedges financeiros e US$ 3,9 bilhões em efeitos de tempo desfavoráveis de derivativos [Bloomberg].\n\nSegundo a Bloomberg, os preços mais altos de energia adicionaram US$ 1,7 bilhão ao resultado, mais do que compensando um impacto de US$ 400 milhões em interrupções de produção ligadas à guerra [Bloomberg]. A produção recorde na Guiana, acima de 900 mil barris brutos por dia, ajudou a suprir as perdas no Oriente Médio [Bloomberg]. A reportagem chama atenção para o risco de longo prazo: participações da Exxon em duas plantas de GNL no Catar foram seriamente danificadas por mísseis iranianos em março, e autoridades catarenses estimam que a reconstrução pode levar até cinco anos [Bloomberg].\n\nApesar do resultado acima do esperado, as ações da Exxon caíram cerca de 0,8% no dia do anúncio, mesmo com o petróleo acumulando alta superior a 50% desde o início do conflito [Bloomberg]. A Bloomberg publicou a cobertura em conjunto com a Chevron, cujo lucro ajustado também bateu o consenso [Bloomberg]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T18:48:04Z", "status": "summarized", "note_for_reviewer": "8-K de 01/05/2026 (1T26) — release mais recente disponível em 07/07/2026. Transcrição de call obtida via site de RI (não SEC), sinalizado explicitamente.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Exxon Profit Surprises Analysts Despite Iran War's Tumult", "url": "https://www.bloomberg.com/news/articles/2026-05-01/exxon-profit-surprises-analysts-despite-iran-war-s-tumult", "captured_at": "2026-07-07T00:00:00Z"}]}, "alcoa": {"company_id": "alcoa", "accession_number": "0001193125-26-306118", "company_name": "Alcoa Corporation", "commodities": ["aluminum", "alumina", "bauxite"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "aa-ex99_1.htm", "label": "Press release da empresa — título original: \"Alcoa Corporation Reports Second Quarter 2026 Results\" (Anexo 99.1 ao Formulário 8-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/0001675149/000119312526306118/aa-ex99_1.htm", "captured_at": "2026-07-20T00:00:00Z"}, {"filename": "Alcoa-Corporation-Reports-Second-Quarter-2026-Results.html", "label": "Press release da empresa — página de Relações com Investidores (news.alcoa.com)", "source_url": "https://news.alcoa.com/press-releases/press-release-details/2026/Alcoa-Corporation-Reports-Second-Quarter-2026-Results/default.aspx", "captured_at": "2026-07-20T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 2T26 (trimestre encerrado em 30/06/2026), divulgados em 16/07/2026** — maior receita trimestral da história da Alcoa Corporation (quase uma década como companhia independente), divulgados no mesmo dia do anúncio da aquisição dos ativos de bauxita/alumina/alumínio da South32 [PR].\n\n**Resultado consolidado:**\n- Receita total: US$ 3.966 milhões (~US$ 4,0 bilhões), alta de 24% sequencial ante o 1T26 — ligeiramente abaixo do consenso de mercado (~US$ 3,99 bilhões) [PR].\n- Lucro líquido atribuível (GAAP): US$ 407 milhões, segundo agregadores que citam o release — não confirmado diretamente no documento primário (ver nota do revisor) [PR].\n- Lucro líquido ajustado: US$ 562 milhões (US$ 2,12/ação ajustado), alta de 51% sequencial — abaixo do consenso de EPS ajustado de US$ 2,32 (miss de ~9%) [PR].\n- EBITDA ajustado excluindo itens especiais: US$ 901 milhões, alta de 51% sequencial (+US$ 306 milhões ante os US$ 595 milhões do 1T26) [PR].\n- Caixa ao final do trimestre: US$ 1,4 bilhão. Fluxo de caixa operacional: US$ 608 milhões. Fluxo de caixa livre: US$ 422 milhões [PR].\n\n**Segmento Alumina:**\n- Produção: 2,2 milhões de toneladas, queda de 6% sequencial, por instabilidade na refinaria de Pinjarra (Austrália Ocidental), agravada por interrupção no fornecimento de gás associada ao Ciclone Narelle [PR].\n- EBITDA ajustado do segmento: -US$ 96 milhões (negativo) [PR].\n\n**Segmento Aluminum:**\n- Produção: 636 mil toneladas, alta de 5% sequencial, refletindo a conclusão do restart do smelter de San Ciprián (Espanha) em 07/04/2026, avanço do restart de Alumar (Brasil) e conclusão dos restarts de Lista (Noruega) e Portland (Austrália) [PR].\n- Embarques: 726 mil toneladas, alta de 113 mil toneladas sequencial [PR].\n- EBITDA ajustado do segmento: recorde de US$ 1,1 bilhão, margem de 32,3% [PR].\n\n**Guidance 2026 (revisado para baixo na Alumina)**\n- Alumina: produção cortada para 9,5–9,6 Mt (de 9,7–9,9 Mt anteriormente), por causa dos problemas em Pinjarra [PR].\n- Aluminum: guidance detalhado para o 2S26 não confirmado nas fontes consultadas (ver nota do revisor).\n\n**Aquisição da South32 (acordo definitivo assinado em 30/06/2026, anunciada junto com o resultado do 2T26)**\n- Alcoa vai adquirir os ativos de bauxita/alumina/alumínio da South32: mina de bauxita de Boddington e refinaria de alumina de Worsley (Austrália Ocidental); smelter de alumínio de Hillside e a propriedade do smelter hoje parado de Bayside (África do Sul); mina de bauxita MRN e a refinaria de alumina/smelter de alumínio de Alumar (Brasil) — fica de fora o smelter de Mozal, em Moçambique [PR].\n- Contraprestação inicial de ~US$ 4,1 bilhões: US$ 3,1 bilhões em caixa + ~17,0 milhões de ações ordinárias da Alcoa (~US$ 1,0 bilhão), mais dívida líquida assumida de ~US$ 0,6 bilhão e um CVR (contingent value right) de até US$ 750 milhões ao longo de 4 anos, atrelado a preços futuros de alumínio/alumina [PR].\n- Financiamento: bridge loan de US$ 3,1 bilhões do Goldman Sachs, a ser substituído por caixa do balanço e dívida permanente antes do fechamento [PR].\n- Fechamento esperado no 1S27, sujeito à aprovação dos acionistas da South32 e a aprovações regulatórias [PR].", "conference_call_summary": "Citação do CEO William F. Oplinger no press release: \"During the second quarter, in addition to delivering strong financial results that captured favorable aluminum prices, our team executed on strategic initiatives, most notably the announced agreement with South32.\"\n^Tradução livre: \"Durante o segundo trimestre, além de entregar resultados financeiros sólidos que capturaram preços favoráveis de alumínio, nossa equipe executou iniciativas estratégicas, principalmente o acordo anunciado com a South32.\"\n\nTambém no release: \"We continue to demonstrate operational excellence and positive momentum in our disciplined approach to maximize value creation.\"\n^Tradução livre: \"Continuamos demonstrando excelência operacional e momentum positivo em nossa abordagem disciplinada para maximizar a criação de valor.\"\n\nNão foi possível acessar a transcrição completa e verbatim da teleconferência de resultados (bloqueio de acesso às páginas primárias — ver nota do revisor); as citações acima vêm do texto do press release oficial, não da call em si.", "commodity_commentary": "Apesar da receita recorde e do anúncio simultâneo da aquisição de ativos da South32, a reação de mercado ao 2T26 da Alcoa foi negativa: as ações caíram 3,56% no pregão regular, para US$ 46,85, e recuaram ainda mais no after-hours (estimativas entre 2,4% e 4,2% adicionais, para a faixa de US$ 45,73), à medida que investidores digeriram o EPS ajustado de US$ 2,12 — abaixo do consenso de US$ 2,32 (miss de ~9%) — e o corte na guidance de produção de alumina [Investing.com][Benzinga].\n\nO miss foi atribuído majoritariamente aos problemas na refinaria de Pinjarra, agravados pelo Ciclone Narelle, que levaram ao corte da guidance de produção de alumina para 2026 [Investing.com]. Em contraste, o segmento de alumínio entregou EBITDA ajustado recorde de US$ 1,1 bilhão (margem de 32,3%), beneficiado pela conclusão de restarts de capacidade em San Ciprián, Lista e Portland [Investing.com].\n\nO evento do trimestre mais comentado na imprensa, porém, foi o acordo definitivo assinado em 30/06/2026 para a Alcoa adquirir os ativos de bauxita/alumina/alumínio da South32 por consideração inicial de ~US$ 4,1 bilhões (~US$ 3,1 bi em caixa + ~US$ 1,0 bi em ações), avaliado pela Bloomberg em até US$ 5,6 bilhões somando CVR e dívida assumida, descrito como uma aposta da Alcoa em um boom prolongado do mercado de alumínio [Bloomberg].\n\nNão foi localizada cobertura dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre a reação ao print do 2T26 em si (16/07) — a análise da reação do papel ao resultado veio de Investing.com e Benzinga; a citação da Bloomberg refere-se à cobertura do anúncio da aquisição da South32 em 30/06/2026, evento relacionado mas cronologicamente anterior (e por isso tratado aqui como contexto, não como cobertura do earnings)."}, "generated_by": "claude-research", "generated_at": "2026-07-20T00:00:00Z", "status": "summarized", "note_for_reviewer": "Todas as tentativas de acessar diretamente o press release primário (news.alcoa.com) e o Exhibit 99.1 do 8-K no SEC EDGAR retornaram HTTP 403 — bloqueio do próprio site (anti-bot), não da política de proxy da sessão. Os números reportados vêm de múltiplas fontes secundárias (TradingView, StockTitan, Investing.com, Alphastreet) que citam o release textualmente e são altamente consistentes entre si (ex.: EBITDA ajustado de US$ 901M bate exatamente com US$ 595M do 1T26 + US$ 306M de alta sequencial reportada). Ainda assim, o lucro líquido GAAP de US$ 407 milhões veio de uma única fonte secundária e não pôde ser cruzado com o documento primário — tratar com cautela até confirmação direta. Guidance detalhado do segmento Aluminum para o 2S26 e a data exata de arquivamento do 8-K não puderam ser confirmados (accession number inferido da URL do EDGAR). Cobertura de imprensa de primeira linha (Bloomberg/Reuters/FT/WSJ) especificamente sobre a reação ao print do 2T26 não foi localizada — usei Investing.com e Benzinga como fallback, mais uma matéria da Bloomberg sobre o M&A com a South32 (evento relacionado, mas anunciado em 30/06, antes do release trimestral).", "commentary_sources": [{"outlet": "Investing.com", "title": "Earnings call transcript: Alcoa misses Q2 2026 EPS forecast as shares fall", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-alcoa-misses-q2-2026-eps-forecast-as-shares-fall-93CH-4797191", "captured_at": "2026-07-20T00:00:00Z"}, {"outlet": "Benzinga", "title": "Alcoa Stock Sinks On Q2 Earnings Miss: Details", "url": "https://www.benzinga.com/markets/earnings/26/07/60514126/alcoa-stock-sinks-on-q2-earnings-miss-details", "captured_at": "2026-07-20T00:00:00Z"}, {"outlet": "Bloomberg", "title": "Alcoa Bets on Aluminum Boom With $5.6 Billion South32 Deal", "url": "https://www.bloomberg.com/news/articles/2026-06-30/south32-sells-aluminum-assets-to-alcoa-in-5-6-billion-deal", "captured_at": "2026-06-30T00:00:00Z"}]}, "century-aluminum": {"company_id": "century-aluminum", "accession_number": "0001628280-26-032082", "company_name": "Century Aluminum Company", "commodities": ["aluminum", "alumina"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "a20260331q1ex991earningsre.htm", "label": "Press release da empresa — título original: \"Century Aluminum Company Reports First Quarter 2026 Results\" (Anexo 99.1 ao Formulário 8-K, arquivado em 07/05/2026)", "source_url": "https://www.sec.gov/Archives/edgar/data/949157/000162828026032082/a20260331q1ex991earningsre.htm", "captured_at": "2026-07-07T18:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T26 (trimestre encerrado em 31/03/2026), divulgados em 07/05/2026** — dado oficial mais recente; o 2T26 ainda não foi divulgado (previsto 06/08/2026) [PR].\n\n**Resultado consolidado:**\n- Vendas líquidas: US$ 649,2 milhões, alta de US$ 15,5 milhões sequencial [PR]\n- Embarques de alumínio primário: 122.865 toneladas (ante 168.672 t no 1T25) — queda por parada da Linha 2 em Grundartangi, Islândia [PR]\n- Lucro líquido atribuível: US$ 337,5 milhões (US$ 3,23/ação), impulsionado por ganho não recorrente de US$ 287,9 milhões na venda da planta de Hawesville e US$ 33,0 milhões de recebimento de seguro [PR]\n- Lucro líquido ajustado: US$ 170,7 milhões (US$ 1,63/ação) [PR]\n- EBITDA ajustado: US$ 231,4 milhões, alta de US$ 60,8 milhões sequencial [PR]\n- Liquidez em 31/03/2026: US$ 611,0 milhões [PR]\n\n**Destaques operacionais**\n- Início em abril/2026 da expansão dos últimos 90 potes em Mt. Holly e do restart da Linha 2 em Grundartangi [PR]\n\n**Guidance 2T26**\n- EBITDA ajustado esperado entre US$ 315–335 milhões, por prêmios/LME mais altos e expansão de Mt. Holly [PR]", "conference_call_summary": "Nenhuma citação verbatim de executivo (CEO Jesse Gary ou CFO) foi encontrada neste press release específico — verificado e reportado honestamente, diferente de outros trimestres da empresa que costumam trazer citação [PR].", "commodity_commentary": "Não foi possível localizar reportagens dedicadas da Bloomberg, Reuters, FT ou WSJ analisando especificamente a reação do mercado ao resultado do 1T26 da Century Aluminum, divulgado em 7 de maio de 2026; os dados disponíveis vêm majoritariamente de agregadores financeiros. Registro essa limitação para manter a transparência da fonte. Ainda assim, os números amplamente replicados mostram que a companhia superou o consenso: lucro ajustado por ação de US$ 1,63 ante expectativa de US$ 1,56, com EBITDA ajustado subindo 35,6% na comparação trimestral, para US$ 231,4 milhões. O lucro líquido total de US$ 337,5 milhões foi inflado por um ganho não recorrente de US$ 287,9 milhões na venda da fundição de Hawesville.\n\nUm ponto de cobertura confirmada de imprensa de primeira linha envolvendo a Century Aluminum no período recente foi uma reportagem do Financial Times sobre uma possível redução das tarifas de aço e alumínio pelo governo Trump, que teria feito as ações da Century Aluminum (e da Alcoa) recuarem no dia da notícia [FT]. Isso ilustra como o desempenho da ação está fortemente atrelado à política tarifária americana, além dos fundamentos operacionais divulgados nos resultados trimestrais."}, "generated_by": "claude-research", "generated_at": "2026-07-07T18:00:00Z", "status": "summarized", "note_for_reviewer": "Q2 2026 ainda não divulgado (previsto 06/08/2026) — cobre o 1T26, dado oficial mais recente disponível.", "commentary_sources": [{"outlet": "Financial Times", "title": "Alcoa stock falls after Trump weighs plan to roll back tariffs (Century Aluminum also cited, -6%)", "url": "https://www.investing.com/news/stock-market-news/alcoa-stock-falls-after-trump-weighs-plan-to-roll-back-tariffs-93CH-4505010", "captured_at": "2026-07-07T00:00:00Z"}]}, "south32": {"company_id": "south32", "accession_number": null, "company_name": "South32 Limited", "commodities": ["aluminum", "alumina", "manganese", "zinc", "silver", "metallurgical coal"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral (Junho 2026 / 4T FY26)", "sources": [{"filename": "quarterly-report-june-2026", "label": "RNS/regulatory news distribuído via Investegate — título original: \"Quarterly Report: June 2026\"", "source_url": "https://www.investegate.co.uk/announcement/rns/south32-limited-di---s32/quarterly-report-june-2026-/9675778", "captured_at": "2026-07-20T00:00:00Z"}], "tabs": {"earnings_summary": "**Relatório de Produção do Trimestre encerrado em Junho de 2026 (4T FY26)** — divulgado em 20/07/2026, mesmo dia da atualização deste painel. Relatório operacional, sem receita/EBITDA/lucro.\n\n**Guidance FY26 superado no grupo**: South32 excedeu o guidance de produção do Grupo para o FY26 [PR]. Volume de vendas trimestral subiu 15% t/t, liberando ~US$ 200 milhões de capital de giro e reforçando geração de caixa [PR].\n\n**Produção por ativo (FY26, vs. guidance)**: alumínio 1% acima do esperado [PR]. Sierra Gorda (cobre, Chile) superou o guidance em 2%, com distribuições anuais recordes de US$ 401 milhões [PR]. Cannington (zinco-chumbo-prata) terminou 2% acima da meta [PR]. Manganês superou o guidance tanto na Austrália (GEMCO, +1%) quanto na África do Sul (+4%) [PR].\n\n**Projetos**: aprovada quarta linha de moagem em Sierra Gorda, com expectativa de aumentar produção de cobre-equivalente em ~30% [PR]. Em Hermosa (Arizona), concluído o licenciamento federal do projeto Taylor (zinco-chumbo-prata) [PR]. Guidance FY27 de Sierra Gorda mantido em 90,2 kt de cobre atribuível; guidance FY27 completo para os demais ativos (Worsley, Hillside, GEMCO, Illawarra) deve ser detalhado no resultado anual (Appendix 4E), ainda não coberto nesta varredura.\n\n**Divestimento de alumínio para a Alcoa — status**: o relatório trata como evento confirmado/em andamento (não concluído) o acordo vinculante condicional anunciado em 30/06/2026 para vender a maior parte da cadeia de alumínio (Worsley Alumina 86%, Hillside Aluminium 100%, MRN bauxita 33%, Brazil Alumina 36%, Brazil Aluminium 40%) à Alcoa por até US$ 5,6 bilhões (US$ 3,1 bi em caixa + ~US$ 1,0 bi em ações Alcoa + assunção de US$ 750 milhões em dívida líquida/leasing + até US$ 750 milhões em CVR ligado a preços) mais ~US$ 1,2 bilhão em provisões de reabilitação [PR-Alcoa]. Mozal Aluminium (Moçambique) está EXCLUÍDA da transação e segue em care & maintenance [PR-Alcoa]. Fechamento (closing) previsto para o 2º semestre do FY27 (1S calendário 2027), sujeito a aprovação de acionistas e órgãos reguladores — **ainda não fechado**, importante não confundir assinatura do acordo (30/06) com conclusão da venda.", "conference_call_summary": "Não localizada teleconferência associada a este relatório de produção trimestral (padrão da South32 é teleconferência apenas nos resultados semestrais/anuais). Nenhuma citação direta de executivo sobre este relatório específico foi localizada nesta varredura — sinalizado para verificação futura.", "commodity_commentary": "Cobertura de imprensa internacional de primeira linha (Bloomberg/Reuters/FT) localizada nesta varredura refere-se especificamente ao anúncio do acordo com a Alcoa em 30/06/2026, não ao relatório de produção de hoje (20/07): a Bloomberg noticiou que a Alcoa \"aposta em boom do alumínio\" com acordo de até US$ 5,6 bilhões pelos ativos da South32, pagando US$ 3,1 bilhões em caixa e ~US$ 1 bilhão em ações, além de assumir US$ 750 milhões em dívida [Bloomberg, 30/06]. Para comentário especificamente sobre o re ,5 bilhões, +6% a/a.\n- **Lucro por ação ajustado**: NOK 2,2, ante NOK 1,7 no 2T25.\n- **Lucro líquido**: NOK 5,97 bilhões, ante NOK 2,45 bilhões no 2T25 — atenção: parte do salto no lucro líquido reportado (diferente do EBITDA ajustado recorrente) é atribuída por pelo menos uma fonte de imprensa a itens não recorrentes/one-off; recomenda-se checar a nota explicativa do release oficial para separar o que é operacional recorrente do que é one-off.\n- **Fluxo de caixa livre**: NOK 4 bilhões, com forte EBITDA ajustado parcialmente compensado por investimentos e pagamento de impostos.\n- **Segmento Aluminium Metal**: EBITDA ajustado de NOK 6.421 milhões no 2T26, ante NOK 2.423 milhões no 2T25 — impulsionado por preços all-in de alumínio mais altos e menor custo de alumina.\n- Fatores negativos citados: menor produção hidrelétrica (hidrologia desfavorável) e efeito adverso da coroa norueguesa mais forte frente ao dólar.\n- Segmento de reciclagem (recycling) também contribuiu positivamente, com ganhos de margem.\n\nOs números de EBITDA ajustado (~NOK 8,9bi) e receita (~NOK 56,5bi) batem com o que havia sido reportado pela imprensa antes desta verificação.", "conference_call_summary": "A Norsk Hydro realizou um webinar em inglês às 08:30 CEST em 22/07/2026, apresentado pelo CEO Eivind Kallevik e pelo CFO Trond Olaf Christophersen, seguido de sessão de perguntas e respostas — não houve apresentação presencial ou coletiva de imprensa física [PR]. Não obtive acesso à transcrição completa da call nesta pesquisa (bloqueio de rede desta sessão), mas a Investing.com publicou transcript próprio da call. Um ponto relevante mencionado por analistas que acompanharam a call: o Morgan Stanley calculou, a partir de sinalizações da administração, uma faixa preliminar de EBITDA para o 3T26 de NOK 10–11 bilhões, cerca de 7% acima do consenso de mercado (NOK 9,8bi) e 5% acima da própria estimativa do banco (NOK 10bi) — sugerindo guidance/outlook construtivo passado pela empresa na call. Recomenda-se buscar a transcrição completa para maior detalhamento antes de finalizar esta aba.", "commodity_commentary": "A reação do mercado aos resultados foi claramente positiva: as ações da Norsk Hydro subiram cerca de 3% em Oslo logo após a divulgação, antes da abertura do pregão local, em um movimento descrito como \"beat\" amplo que chamou a atenção dos investidores [Investing.com]. O Morgan Stanley destacou \"forte EBITDA acima do esperado e outlook sólido\", elevando sua leitura para o 3T26. A Mining Weekly (que replica cobertura da Reuters) publicou a manchete \"Norsk Hydro tops Q2 profit view as higher prices offset Qatar hit\", atribuindo o resultado acima do esperado aos preços mais altos de alumínio e prêmios de produto, que mais do que compensaram um impacto negativo relacionado a operações no Qatar (provavelmente ligado à joint venture Qatalum, embora o detalhe exato não tenha sido confirmado nesta pesquisa) [Mining Weekly/Reuters]. A Business Recorder, também com origem em despacho da Reuters, resumiu a manchete como \"lucro core da Norsk Hydro supera previsões\" [Business Recorder]. A Investing.com atribuiu a alta das ações a \"lucro maior por preços de alumínio mais fortes e ganhos na reciclagem\" [Investing.com]. Em conjunto, a cobertura de imprensa converge para uma leitura de resultado acima do consenso, especialmente no segmento de metal primário, com ressalvas pontuais sobre hidrologia desfavorável e o efeito cambial da coroa mais forte."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Números principais (EBITDA ajustado ~NOK 8,9bi, receita ~NOK 56,5bi) foram corroborados de forma consistente entre o release oficial (GlobeNewswire) e três veículos de imprensa independentes — boa confiança nesses dados. Duas ressalvas: (1) o termo 'Qatar hit' aparece na manchete da Mining Weekly/Reuters mas não consegui confirmar o detalhe exato (provável relação com a joint a de Benicia concluída em abril/2026 [PR/10-Q]\n\n**Retorno de Capital**\n- Dividendo de US$ 1,20/ação (+6% a/a) [PR]. Retorno total de US$ 938 milhões, payout de 59% do caixa operacional ajustado [PR]", "conference_call_summary": "Nenhuma transcrição localizada na SEC. Citação do CEO Lane Riggs no release: \"I'm pleased to report that Valero had an excellent first quarter, demonstrating our team's ability to optimize our refining system and deliver solid financial returns.\"\n^Tradução livre: \"Estou satisfeito em informar que a Valero teve um excelente primeiro trimestre, demonstrando a capacidade de nossa equipe de otimizar nosso sistema de refino e entregar retornos financeiros sólidos.\"", "commodity_commentary": "A Reuters informou que a Valero Energy superou com folga as expectativas de Wall Street para o lucro ajustado do primeiro trimestre de 2026, beneficiada pela força do segmento de refino [Reuters]. O lucro por ação ajustado ficou em US$ 4,22, US$ 1,06 acima da estimativa média [Reuters]. Segundo a agência, o segmento de refino teve lucro operacional de US$ 1,8 bilhão, revertendo um prejuízo de US$ 530 milhões um ano antes, com margem de refino por barril subindo de US$ 9,78 para US$ 14,90 [Reuters].\n\nA Reuters atribuiu o salto de rentabilidade ao aumento das margens de diesel e querosene de aviação depois que os ataques dos EUA e de Israel ao Irã interromperam parte da oferta do Oriente Médio; o spread de crack 3-2-1 nos EUA subiu cerca de 73% na comparação anual [Reuters]. A companhia elevou o dividendo trimestral em 6%, para US$ 1,20 por ação, e devolveu US$ 938 milhões aos acionistas no trimestre [Reuters].\n\nApesar do resultado acima do esperado, a reação inicial das ações foi negativa — fontes de mercado registraram quedas entre 2% e quase 4% em torno da divulgação —, padrão comum entre refinadoras americanas no período, cujas ações já haviam subido mais de 20% no ano [Reuters]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T e transcrição replicados por veículos financeiros (Motley Fool, The Globe and Mail), o CEO Anders Opedal destacou que \"forte produção no segundo trimestre permitiu à empresa capturar valor com preços mais altos, contribuindo para forte geração de caixa e resultados financeiros\", e que a companhia \"avançou nas prioridades definidas no Capital Markets Day para entregar mais energia, crescimento de caixa e retornos superiores\", citando fortalecimento de portfólio via execução de projetos e transações estratégicas. Também mencionou o papel da confiabilidade energética \"em um mundo volátil marcado por tensão geopolítica acentuada\". A mesa de trading físico de petróleo e a maior volatilidade do gás europeu (associada ao conflito no Irã e a disrupções no Estreito de Hormuz) foram citadas como vetores que sustentaram o resultado no trimestre. Não foi possível acessar diretamente o transcript completo (bloqueio de rede na sessão) — o resumo acima se baseia em citações replicadas por terceiros, não na leitura integral da transcrição.", "commodity_commentary": "A Bloomberg publicou, no dia do resultado (22/07/2026), a matéria \"Equinor Beats Earnings Estimates as War Roils Energy Markets\", atribuindo o resultado acima do esperado à volatilidade no mercado europeu de gás natural causada pelo conflito no Irã e ao fechamento do Estreito de Hormuz, que teriam fortalecido as margens de trading físico de petróleo e otimização de fretes da Equinor — um dos pilares de resultado destacados também na própria empresa. Cobertura complementar da Investing.com (\"Equinor shares up almost 2% as earnings beats analyst forecast\") confirma reação positiva das ações no pregão seguinte à divulgação, embora o tamanho exato do movimento varie entre fontes secundárias consultadas (uma nota da Simply Wall St, não incluída como fonte primária de comentário por não ser imprensa financeira tradicional, mencionou alta de até 9,6%; não foi possível reconciliar esse número com precisão dado o bloqu spanha [PR].\n- **Margem de refino**: indicador médio de US$14/bbl no trimestre, sustentado por spreads fortes de diesel, jet fuel e gasolina; guidance para o ano segue conservadora, em US$6,5-7,5/bbl [IP].\n- **Upstream**: guidance de produção para 2026 mantida em 560-570 kboed; ritmo de produção em julho já em 580-585 kboed, sugerindo fechamento perto do topo do intervalo [IP]. Vale notar que ao menos uma cobertura da imprensa especializada (newvision.io) apontou que o resultado upstream isoladamente ficou abaixo do esperado por analistas, mesmo com o resultado consolidado surpreendendo positivamente.\n- **Capex e guidance financeira**: capex líquido mantido em €2,7 bilhões para 2026; guidance de CFFO reafirmada acima de €5,5-6 bilhões. Premissas: Brent US$60-65/bbl, Henry Hub US$3,5-4/MMBtu [IP].\n- **Remuneração ao acionista**: segundo programa de recompra de ações de 2026 ampliado de €350 milhões para €500 milhões; terceiro programa esperado para outubro, dentro do compromisso de distribuir 30-40% do CFFO. Dividendo por ação deve crescer entre 6% e 9% ao ano até 2028 [PR].\n- **Marcos operacionais**: início da produção de petróleo em Pikka (Alasca) e início da produção de combustíveis renováveis em Puertollano, além de novos avanços na rotação de ativos renováveis [PR].\n- Resultado ajustado de €1,84 bilhão superou o consenso compilado pela Reuters, de €1,64 bilhão [Reuters/Investing.com].\n\nNota metodológica: não foi possível baixar diretamente o PDF/press release via ferramenta de fetch nesta sessão (bloqueio 403 em nível de rede/proxy para repsol.com e cnmv.es), mas os números acima foram cruzados entre múltiplas coberturas independentes (Reuters, Investing.com, Rigzone, imprensa espanhola) que citam diretamente o comunicado oficial, e a URL oficial do press release foi confirmada via busca.", "conference_call_summary": "O CEO Josu Jon Imaz classificou o trimestre como de \"resultados sólidos\", combinando \"desempenho financeiro excelente com execução estratégica contínua\" [CC/PR]. Segundo cobertura da call (Yahoo Finance/GuruFocus), a administração destacou o arranque da produção em Pikka (Alasca) como marco relevante do trimestre, reafirmou a guidance operacional e financeira para 2026 (produção upstream 560-570 kboed, capex líquido €2,7bi, CFFO >€5,5-6bi) e sinalizou confiança na manutenção de margens de refino elevadas no curto prazo, dado o cenário geopolítico. Não foi possível localizar e revisar diretamente a transcrição oficial completa da call nesta pesquisa — o resumo acima baseia-se em coberturas jornalísticas da call (destaques), não na transcrição primária verbatim. Recomenda-se ao revisor conferir a transcrição oficial em repsol.com/investor relations quando disponível.", "commodity_commentary": "A imprensa financeira destacou o forte salto de lucro da Repsol no 2T26, impulsionado pela alta dos preços do petróleo e por margens de refino elevadas em meio à volatilidade geopolítica. A Reuters (via Yahoo Finance) noteou que o lucro do grupo espanhol \"mais que triplicou\" no semestre, beneficiado pela escalada de preços de petróleo e gás associada ao conflito no Oriente Médio [Reuters]. O Investing.com classificou o resultado como um \"earnings beat\", com o lucro líquido ajustado de €1,84 bilhão superando o consenso de mercado de €1,64 bilhão, também impulsionado pelo arranque do projeto Pikka no Alasca [Investing.com]. A Rigzone reportou os números oficiais — €1,27 bilhão de resultado líquido IFRS e €1,84 bilhão de resultado ajustado no trimestre, altas de 437% e 207% ano a ano, respectivamente — enquadrando o resultado como um \"surto de lucro\" ligado ao pico de preços do petróleo [Rigzone]. Cobertura complementar (Euronext Live) frisou que a companhia sinalizou expectativa de margens de refino permanecerem elevadas em 2027 dado o pano de fundo geopolítico [Euronext Live]. Por outro lado, ao menos uma cobertura setorial (newvision.io) ressalvou que o segmento upstream isoladamente rendeu abaixo do esp gy", "accession_number": "0001104659-26-055746", "company_name": "Suncor Energy Inc.", "commodities": ["oil", "natural gas"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "su-20260505xex99d1.htm", "label": "Exhibit 99.1 do 6-K, arquivado em 06/05/2026", "source_url": "https://www.sec.gov/Archives/edgar/data/311337/000110465926055746/su-20260505xex99d1.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T26 vs 1T25 (em CAD)**\n\n- Lucro líquido: CAD$ 2.100 milhões, ante CAD$ 1.689 milhões [6-K]\n- Lucro operacional ajustado: CAD$ 2.300 milhões, ante CAD$ 1.629 milhões [6-K]\n- Fluxo de caixa livre: CAD$ 2.913 milhões, ante CAD$ 1.900 milhões [6-K]\n\n**Produção**: recorde de 875,2 mil bbl/d; recorde em Fort Hills; refino recorde de 497,8 mil bbl/d (97% utilização) [6-K]\n**Guidance**: recompras elevadas para CAD$ 350 mi/mês, ~CAD$ 4 bi em 2026; breakeven WTI reduzido a US$ 38/bbl até 2028 [6-K]\n**Retorno**: dividendo CAD$ 0,60/ação", "conference_call_summary": "Citação do CEO Rich Kruger: \"As demonstrated at our recent Investor Day, today's Suncor is a results-driven, high-performing organization... We delivered record upstream production and record refinery throughput.\"\n^Tradução livre: \"Como demonstrado em nosso recente Investor Day, a Suncor de hoje é uma organização orientada a resultados e de alto desempenho... Entregamos produção upstream recorde e throughput de refino recorde.\"", "commodity_commentary": "Segundo a BNN Bloomberg, a Suncor Energy reportou lucro líquido de C$ 2,1 bilhões no primeiro trimestre de 2026, ante C$ 1,69 bilhão um ano antes, com produção upstream e processamento nas refinarias em níveis recordes no trimestre [Bloomberg]. A administração destacou que o preço médio do WTI em março ficou 50% acima do praticado em janeiro, e a companhia iniciou a exportação de combustível de aviação produzido na refinaria de Montreal, até então destinado apenas ao mercado doméstico — embora tenha reduzido a projeção de utilização das refinarias para os próximos trimestres [Bloomberg]. Apesar do resultado acima do esperado, a reação imediata das ações foi negativa: os papéis caíram cerca de 6% no dia da divulgação, movimento atribuído pela reportagem sobretudo à queda dos preços do petróleo, não a preocupações operacionais [Bloomberg]. O analista David Trainer, CEO da New Constructs, classificou a queda como \"quase inteiramente relacionada ao petróleo\", descrevendo a Suncor como \"um negócio muito lucrativo\", com \"ótima utilização e eficiência operacional\", e manteve recomendação positiva para o investidor de longo prazo apesar da volatilidade recente de commodities [Bloomberg]. A companhia também ampliou o ritmo de recompra de ações para cerca de C$ 350 milhões mensais, projetando recompras totais de quase C$ 4 bilhões em 2026."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "1T26, divulgado 05/05/2026. Cifras em CAD. Fonte de comentário atualizada em 14/07/2026: substituída a Reuters (republicada via boereport.com) por reportagem original da BNN Bloomberg sobre o mesmo evento, incluindo comentário de analista (David Trainer, New Constructs) ausente na cobertura anterior.", "commentary_sources": [{"outlet": "Bloomberg (BNN Bloomberg)", "title": "Investor Outlook: Suncor shares fall despite stronger quarterly earnings", "url": "https://www.bnnbloomberg.ca/investing/investor-outlook/2026/05/06/investor-outlook-suncor-shares-fall-despite-stronger-quarterly-earnings/", "captured_at": "2026-07-14T00:00:00Z"}]}, "omv": {"company_id": "omv", "accession_number": null, "company_name": "OMV Aktiengesellschaft", "commodities": ["oil", "gas", "petrochemicals"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "OMV_Q1_26_EN.pdf", "label": "\"OMV Group Report January–March 2026\"", "source_url": "https://w ilhões [PR]. Lucro líquido: PLN 8.154 milhões (ante PLN 4.206 milhões) [PR]\n- Dívida líquida/EBITDA: -0,04x (posição de caixa líquido) [PR]\n\n**Segmentos**: Upstream & Supply PLN 5,0 bi; Downstream (LIFO) PLN 3,1 bi; Energy PLN 4,7 bi [PR]\n**Retorno**: dividendo recorde de PLN 9,3 bilhões (PLN 8/ação) recomendado — \"o maior dividendo da história da ORLEN\" [PR]\n**Rating**: Moody's A3, Fitch BBB+ [PR]", "conference_call_summary": "Citação do CEO Ireneusz Fąfara: \"Once again we have demonstrated the resilience and effectiveness of our business model.\"\n^Tradução livre: \"Mais uma vez demonstramos a resiliência e a eficácia do nosso modelo de negócio.\"", "commodity_commentary": "A Orlen reportou lucro ajustado (EBITDA LIFO) de 14,07 bilhões de zlótis no primeiro trimestre de 2026, acima do consenso de analistas de 13,2 bilhões de zlótis e alta de 22,8% na comparação anual [Reuters]. As ações da companhia subiram 1,6% no dia da divulgação, superando o índice de referência polonês WIG20, que recuou 0,1% no mesmo pregão, e também superando pares regionais como a húngara MOL (+0,2%) [Reuters]. O analista Cezary Bernatek, da corretora austríaca Erste, foi citado afirmando que \"os números parecem confirmar a resiliência e os benefícios da diversificação do modelo de negócios integrado da Orlen em meio à elevada volatilidade nos mercados globais de energia\" [Reuters]. A agência atribuiu o forte desempenho ao salto das margens de refino, de US$ 8,9 para US$ 17,0 por barril na comparação anual, impulsionadas pelas disrupções de oferta ligadas à guerra no Irã, além do clima frio em janeiro e fevereiro [Reuters]. O lucro líquido não ajustado, porém, foi impactado por encargos de impairment não caixa de 1,11 bilhão de zlótis, reduzindo o resultado contábil final em relação ao indicador ajustado destacado pela companhia [Reuters]. A cobertura descreveu o trimestre como um dos mais fortes já registrados pela petrolífera polonesa, reforçando a leitura de que o modelo integrado de refino, energia e varejo da Orlen oferece proteção relevante em ambientes de alta volatilidade de commodities [Reuters]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "1T26, mas press release publicado só em 28/05/2026 (mais tarde que os pares). Cifras em PLN.", "commentary_sources": [{"outlet": "Reuters", "title": "Orlen's first-quarter adjusted core profit beats market estimates", "url": "https://www.globalbankingandfinance.com/orlens-first-quarter-adjusted-core-profit-beats-market/", "captured_at": "2026-07-07T00:00:00Z"}]}, "tharisa": {"company_id": "tharisa", "accession_number": null, "company_name": "Tharisa plc", "commodities": ["platinum group metals", "chrome"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral (Q3 FY2026, trimestre encerrado em 30/06/2026)", "sources": [{"filename": "tharisa-plc-q3-fy2026-production-report.pdf", "label": "Anúncio regulatório (RNS/LSE, redistribuído via wire) — título original: \"Tharisa PLC - Production Report Q3 2026 ended 30 June 2026\", divulgado em 14/07/2026", "source_url": "https://www.tradingview.com/news/reuters.com,2026-07-14:newsml_RSN1435Ma:0-reg-tharisa-plc-production-report-q3-2026-ended-30-june-2026/", "captured_at": "2026-07-20T00:00:00Z"}], "tabs": {"earnings_summary": "**Produção do trimestre (Q3 FY2026, encerrado em 30/06/2026)**: produção de PGMs (6E) somou 39,6 koz, alta de 15,5% frente aos 34,3 koz do Q2 FY2026, sustentada por recuperação metalúrgica de 83,8% — melhora relevante frente ao trimestre anterior [RNS]. Produção de cromita ficou em 393,8 kt, levemente abaixo dos 404,0 kt do Q2 — queda marginal explicada por menor tonelagem moída e recuperações levemente inferiores, parcialmente compensadas por melhor teor ROM e yield [RNS].\n\n**Preços realizados**: cesta de PGMs realizada recuou para US$ 2.681/oz no Q3 ante US$ 3.038/oz no Q2 (-11,7% t/t), refletindo o recuo dos preços de PGM após o rali do trimestre anterior [RNS]. Preço médio do concentrado de cromita metalúrgico subiu para US$ 306/t ante US$ 290/t no Q2 [RNS].\n\n**Caixa e dívida**: caixa do grupo em US$ 198,8 milhões (ante US$ 184,3 milhões em 31/03/2026) e dívida de US$ 188,1 milhões (ante US$ 129,6 milhões) — posição de caixa líquido caiu para US$ 10,7 milhões (ante US$ 54,7 milhões), reflexo do aumento de alavancagem para financiar capex de crescimento [RNS].\n\n**Guidance FY2026** (ano fiscal encerra em 30/09/2026): mantida em 145–165 koz de PGMs (6E) e 1,50–1,65 Mt de concentrado de cromita [RNS].\n\n**Projetos**: projeto de mina subterrânea da Tharisa Minerals dentro do cronograma e orçamento, com desenvolvimento do portal em curso e primeiro ROM subterrâneo previsto para o Q4 FY2026; no projeto Karo Platinum (Zimbábue), mobilização do contratante de mineração da Fase 1 concluída e stripping de estéril em pit já em curso [RNS].\n\nNota: este relatório de produção trimestral não traz demonstrações financeiras completas nem AISC do trimestre — a última referência de custo unitário disponível (US$ 268/oz de PGM vendido) é do 1S FY2026, documento distinto deste release.", "conference_call_summary": "Não há teleconferência associada a relatórios trimestrais de produção da Tharisa — apenas os resultados intercalares (semestrais) e anuais têm call formal com analistas; portanto, não há transcript a resumir para este release. Em comentários públicos à imprensa após a divulgação, o CEO Phoevos Pouroulis afirmou que os fundamentos de médio prazo do mercado de PGMs seguem favoráveis (\"medium-term fundamentals remain supportive\"), e reiterou confiança em entregar o guidance de produção do FY2026 mesmo com a queda trimestral no preço da cesta de PGMs [Business Day][Miningmx].", "commodity_commentary": "A cobertura de imprensa sobre o Q3 FY2026 da Tharisa concentrou-se em veículos sul-africanos — não foram localizadas notas específicas da Bloomberg, Reuters ou FT sobre este re _url": "https://www.marketscreener.com/news/northam-platinum-holdings-limited-reports-production-results-for-the-financial-year-ended-30-june-20-ce7f5edcdb8df024", "captured_at": "2026-07-20T00:00:00Z"}, {"filename": "northam-platinum-fy2026-sales-results.pdf", "label": "Comunicado da empresa/SENS — título original: \"Northam Platinum Holdings Limited Reports Sales Results for the Financial Year Ended 30 June 2026\"", "source_url": "https://www.marketscreener.com/news/northam-platinum-holdings-limited-reports-sales-results-for-the-financial-year-ended-30-june-2026-ce7f5edcdb8bf226", "captured_at": "2026-07-20T00:00:00Z"}], "tabs": {"earnings_summary": "**Natureza do documento**: este é um relatório de PRODUÇÃO E VENDAS para o ano fiscal encerrado em 30/06/2026 (dois comunicados/SENS separados — produção e vendas —, ambos publicados em 14/07/2026) [SENS/Northam]. NÃO são os resultados financeiros anuais auditados completos, que devem ser divulgados em data posterior; não há aqui DRE, HEPS real do ano ou balanço.\n\n**Produção 4E (Pt+Pd+Rh+Au)**: produção equivalente refinada das operações próprias somou recorde de 938.754 oz, alta de 4,4% a/a [SENS/Northam]. Northam também comprou volume recorde de 158.138 oz-equivalente de terceiros, alta de 24,4% a/a [SENS/Northam]. O resultado de produção própria superou o topo do guidance prévio de 910.000–930.000 oz 4E [SENS/Northam].\n\n**Vendas**: total de metal 4E vendido atingiu recorde de 1,09 milhão de oz, alta de 8% a/a [SENS/Northam].\n\n**Cromita**: produção e vendas de concentrado de cromita atingiram recorde de 1,69 Mt, alta de 17,4% a/a, impulsionada por maior throughput de UG2, melhores teores de alimentação e yields de concentrador — com destaque para Eland, cuja produção de cromo saltou 49,5% para 308.831 t no ano, com yields mais que dobrando no período [SENS/Northam].\n\n**Custos/guidance**: guidance de custo unitário previamente divulgado pela empresa para o FY2026 era de R$ 27.005–28.500 por oz 4E; este releas  1S25); lucro líquido de US$ 3.246,8 milhões (vs. US$ 1.919,4 milhões no 1S25) [PR].\n- **Preço do cobre (referência de mercado)**: LME médio de US$ 6,04/lb no 2T26 (+30% a/a frente a US$ 4,32/lb no 2T25); COMEX médio de US$ 6,16/lb (+31% a/a) [PR].\n- **Produção/volume**: volume de vendas de cobre caiu ~1,5% a/a — o crescimento de receita foi explicado quase inteiramente pelos preços mais altos de cobre e subprodutos; produção de cobre no Peru veio mais fraca no período [PR].\n- **Dividendo**: conselho aprovou dividendo em dinheiro de US$ 1,10/ação e dividendo em ações de 0,0120 ação por ação ordinária, pagável em 27/08/2026 a acionistas de registro em 11/08/2026 — valor total estimado de US$ 3,23/ação somando as duas parcelas [8-K].\n- **Ações em circulação**: 834,3 milhões de ações em 30/06/2026 [8-K].", "conference_call_summary": "Teleconferência realizada em 21–22/07/2026, conduzida por Raul Jacob (Vice-Presidente de Finanças, Tesoureiro e CFO da Southern Copper) [Earnings Call]. Segundo coberturas agregadas da chamada, a administração classificou o trimestre como \"mais um trimestre excepcional\", com recordes em vendas, EBITDA ajustado e lucro líquido, atribuídos majoritariamente aos preços mais altos de cobre e subprodutos, já que o volume vendido de cobre efetivamente recuou ~1,5% a/a [Earnings Call]. Não foi possível acessar a transcrição oficial completa nesta pesquisa (restrição de rede) — detalhes sobre capex, atualização de projetos (incluindo Tía María, no Peru) e produção por país (México/Peru/Chile) mencionados em fontes secundárias não puderam ser verificados diretamente na transcrição primária. Recomenda-se ao revisor conferir a transcrição completa (Seeking Alpha/BamSEC/site de RI) antes de publicar detalhes operacionais mais finos.", "commodity_commentary": "O resultado recorde da Southern Copper no 2T26 teve reação positiva no mercado: as ações subiram cerca de 3,4%, para US$ 194,41, ante fechamento anterior de US$ 188,01 [TradingView News]. O lucro ajustado de US$ 2,01/ação veio acima de uma estimativa de consenso citada por agências de dados (US$ 1,95), e a receita de US$ 4,29 bilhões também superou a expectativa de US$ 4,27 bilhões segundo essa mesma leitura [TradingView News]. A cobertura da StockTitan classificou o trimestre como recorde em receita e lucro, impulsionado pela alta expressiva dos preços do cobre no LME e na COMEX, mesmo com produção de cobre mais fraca no Peru [StockTitan]. Já uma nota da Investing.com trouxe manchete de que o lucro teria \"perdido\" a estimativa por US$ 0,10, mesmo com receita acima do esperado — uma divergência frente às demais fontes que sugere bases de consenso diferentes entre provedores de dados, não reconciliada com confiança dentro do escopo desta pesquisa [Investing.com]. Não foi localizada, dentro do escopo desta pesquisa, uma matéria dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre a reação de mercado a este resultado da Southern Copper — as fontes disponíveis foram majoritariamente agregadores financeiros (TradingView News, StockTitan, Investing.com). Dado o porte e a liquidez da empresa, é provável que exista cobertura da Reuters ou Bloomberg não localizada por limitação de orçamento de busca nesta sessão; recomenda-se ao revisor buscar diretamente essas fontes antes da publicação final."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Devido a restrição de rede nesta sessão de pesquisa (política de egress da sessão bloqueou WebFetch/curl externo, confirmado até em google.com), não foi possível abrir diretamente os documentos primários (SEC EDGAR, stocktitan.net, tradingview.com) — todos retornaram HTTP 403. Os dados financeiros acima foram reconstruídos a partir de trechos e resumos desses documentos indexados por mecanismo de busca. Há duas divergências entre fontes secundárias que não puderam ser reconciliadas com os documentos primários: (1) EBITDA aj s; Remains on Track to Achieve Full Year Guidance\"", "source_url": "https://www.newmont.com/investors/news-release/news-details/2026/Newmont-Reports-Robust-Second-Quarter-2026-Results-Remains-on-Track-to-Achieve-Full-Year-Guidance/default.aspx", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "20260723182582", "label": "Distribuição do press release de resultados do 2T26 via BusinessWire", "source_url": "https://www.businesswire.com/news/home/20260723182582/en/Newmont-Reports-Robust-Second-Quarter-2026-Results-Remains-on-Track-to-Achieve-Full-Year-Guidance", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Newmont Corporation (NEM) — \"Newmont Reports Robust Second Quarter 2026 Results; Remains on Track to Achieve Full Year Guidance\"** — primeira entrada no painel.\n\nDivulgado em 23/07/2026 via Formulário 8-K e press release oficial [PR][8-K].\n\n- **Lucro líquido reportado (GAAP)**: US$ 2,2 bilhões [PR].\n- **Lucro líquido ajustado**: US$ 2,2 bilhões, ou US$ 2,10/ação diluída ajustada [PR].\n- **EBITDA ajustado**: US$ 3,8 bilhões [PR].\n- **Receita**: US$ 6,12 bilhões no trimestre [PR] *(fontes secundárias divergem sobre se este valor superou ou ficou abaixo do consenso de mercado — ver nota ao revisor)*.\n- **Produção de ouro atribuível**: ~1,3 milhão de oz (1,29 milhão de oz segundo cobertura da imprensa), abaixo de 1,48 milhão de oz no 2T25 — queda atribuída a menor produção em Cadia (eventos sísmicos) e a teores mais baixos, dentro do sequenciamento de lavra já planejado, em Ahafo South, Peñasquito e Yanacocha [PR].\n- **Outros metais**: prata, 7 milhões de oz; cobre, 17 mil toneladas [PR].\n- **Preço de ouro realizado**: US$ 4.414/oz, ante US$ 3.320/oz no 2T25 (+33% a/a); preço médio de mercado do ouro no 2T26 foi de US$ 4.506,41/oz (+37% a/a) [PR].\n- **Custos**: CAS (by-product) de ouro de US$ 1.043/oz; AISC de US$ 1.621/oz — custos acumulados no ano seguem abaixo do guidance de custo para o ano cheio [PR].\n- **Fluxo de caixa livre**: recorde para um 2º trimestre, em US$ 2,2 bilhões [PR].\n- **Retorno a acionistas**: US$ 1,9 bilhão devolvido via dividendos e recompras no trimestre (incluindo US$ 1,7 bilhão em recompras, dentro da autorização de US$ 6 bilhões anunciada em abril/2026); redução de mais de 100 milhões de ações (~9% do free float) ao longo de dois anos de programa de recompra [PR].\n- **Guidance 2026 (reafirmado)**: produção de ouro atribuível de 5,3 milhões de oz; capex de desenvolvimento de ~US$ 1,4 bilhão em 2026; custos unitários devem subir no 3T26 por maior capex de sustentação e possível alta do petróleo [PR].", "conference_call_summary": "Teleconferência realizada em 23/07/2026, às 17h30 (horário do leste dos EUA), com a presidente e CEO Natascha Viljoen e o CFO Brian Tabolt [Earnings Call]. Não foi possível acessar a transcrição oficial completa nesta pesquisa devido a restrições de acesso à rede — resumo baseado em coberturas agregadas da chamada, não na transcrição primária. Segundo essas coberturas, a administração comentou: adiamento de parte do capex de desenvolvimento de PC1-2 relacionado a um evento sísmico; avanço das obras da barreira de contenção de solo (\"Nearshore Soil Barrier\") em Lihir, com ritmo mais intenso previsto para o 2S26; aumento do desembolso em Cerro Negro para a expansão 1; e pressão inflacionária sobre custos de capital, com a companhia revisando estimativas de engenharia e custo para mitigar o impacto [Earnings Call]. Recomenda-se ao revisor conferir a transcrição oficial antes de citar qualquer declaração como fala literal da administração.", "commodity_commentary": "A reação ao resultado do 2T26 da Newmont foi mista na imprensa. Segundo cobertura da Reuters (republicada pela BNN Bloomberg), a maior mineradora de ouro do mundo superou as estimativas de lucro do trimestre à medida que a alta do preço do ouro compensou a queda na produção, com lucro ajustado de US$ 2,10/ação ante consenso médio de analistas de US$ 1,99/ação [Reuters]. A mesma reportagem destacou que a produção trimestral de ouro caiu para 1,29 milhão de oz (de 1,48 milhão de oz um ano antes), afetada por eventos sísmicos em Cadia e por teores mais baixos em Ahafo South, Peñasquito e Yanacocha dentro do sequenciamento de lavra já planejado, e que a companhia sinalizou produção estável adiante (\"sees steady output\") [Reuters]. Já a Kitco News enfatizou o fluxo de caixa livre recorde para um segundo trimestre (US$ 2,2 bilhões), descrevendo que a Newmont \"driblou\" uma correção de 13% no preço do ouro ocorrida ao longo do trimestre para ainda assim superar as estimativas de lucro [Kitco News]. Apesar dos números operacionais fortes, parte da cobertura da imprensa financeira mencionou reação apática a levemente negativa da ação no pregão pós-resultado, associada à leitura de que a receita de US$ 6,12 bilhões pode ter ficado abaixo de algumas estimativas de consenso — ponto em que há divergência não reconciliada entre fontes secundárias (ver nota ao revisor) [Reuters]. A companhia reafirmou o guidance de produção de ouro de 5,3 milhões de oz para 2026."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Devido a restrição de rede nesta sessão de pesquisa (política de egress da sessão bloqueou WebFetch/curl externo, confirmado até em google.com), não foi possível abrir diretamente os documentos primários (SEC EDGAR, businesswire.com, newmont.com) — todos retornaram HTTP 403. Os dados financeiros acima foram reconstruídos a partir de trechos e resumos desses documentos indexados por mecanismo de busca, cruzados entre múltiplas fontes que concordam entre si. Há uma divergência não reconciliada entre fontes secundárias quanto à estimativa de consenso de EPS ajustado usada para julgar beat/miss (uma fonte cita consenso de US$ 1,99, outra cita US$ 2,12) e quanto a se a receita de US$ 6,12 bi bateu ou não o consenso — recomenda-se ao revisor confirmar com um s — recorde, mais que dobrando vs. 2T25 [PR]\n- **Lucro por ação ajustado:** US$ 0,33 (consenso de mercado era de US$ 0,2071 — beat expressivo) [PR]\n- **Produção líquida (óleo, líquidos e gás natural):** 376 kboe/d no 2T26 (-7% vs. 1T26; +31% vs. 2T25); média do 1S26 de 391 kboe/d [PR]\n- **Composição da produção no trimestre:** 67% óleo/NGLs, 33% gás [PR]\n- **Preço médio realizado:** US$ 101/boe [PR]\n- **Fluxo de caixa das operações após impostos:** US$ 2,1 bilhões [PR]\n- **Dívida líquida:** reduzida de US$ 5,2 bi (1T26) para US$ 3,6 bi (2T26); alavancagem de 0,4x [PR]\n- **Liquidez disponível:** recorde de US$ 5,3 bilhões [PR]\n- **Dividendo do 2T26:** elevado para US$ 350 milhões (equivalente a NOK 1,355/ação) — guidance similar de US$ 350 milhões para o 3T26 [PR]\n\nA companhia atribuiu o dividendo maior a três fatores combinados: preços mais altos desde o início do conflito no Oriente Médio (março de 2026), resultados financeiros recordes, e o valor agregado esperado da combinação com a BlueNord (evento corporativo separado — ver nota ao revisor).", "conference_call_summary": "Webcast e sessão de perguntas e respostas realizados às 10h00 CEST em 21/07/2026, conduzidos pelo CEO Nick Walker e pelo CFO Carlo Santopadre. Em citações replicadas por veículos financeiros (Investing.com/transcript), Walker reafirmou a política de dividendos de longo prazo: \"permanecemos comprometidos com nossa política de dividendos de longo prazo de 25% a 30% do fluxo de caixa das operações após impostos ao longo dos ciclos\", e explicou o aumento do dividendo do trimestre: \"elevamos nossos dividendos hoje, e isso reflete duas coisas: reflete os preços mais altos que vimos recentemente desde o início do conflito no Oriente Médio em março, e também os resultados financeiros recordes e, claro, o negócio que fechamos hoje [BlueNord], que agrega valor\". Não foi possível acessar a transcrição completa diretamente (bloqueio de rede desta sessão) — resumo baseado em trechos replicados por terceiros.", "commodity_commentary": "A cobertura da imprensa financeira do dia (21/07/2026) tratou o resultado e o anúncio da fusão com a BlueNord como eventos conectados na reação do mercado, ainda que sejam corporativamente distintos. A Investing.com publicou \"Var Energi stock jumps on BlueNord acquisition agreement, Q2 revenue beat\", reportando alta das ações de 5,32% para US$ 45,93, próximo da máxima de 52 semanas (US$ 50,70), atribuída tanto ao beat de EPS ajustado (US$ 0,33 vs. US$ 0,2071 esperado) quanto ao anúncio da aquisição da BlueNord por cerca de US$ 1,33 bilhão — negócio que criaria a maior produtora independente de óleo e gás da Europa, com sinergias pós-impostos estimadas em US$ 250-300 milhões entre 2027 e 2032. A Yahoo Finance/Motley Fool também destacou os resultados em \"Var Energi ASA (VARRY) Q2 2026 Earnings Call Highlights: Record Revenue and Strategic Expansion\", enfatizando a receita recorde e a expansão estratégica via BlueNord. Não foram localizadas matérias específicas da Bloomberg ou Reuters sobre este resultado nas buscas realizadas nesta sessão — a cobertura usada como fonte é de imprensa financeira/especializada consolidada (Investing.com, Yahoo Finance), tratada aqui como fallback aceitável dado que é especificamente sobre este resultado e datada corretamente."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "IMPORTANTE — evento corporativo distinto: no mesmo dia (21/07/2026), a Vår Energi anunciou uma fusão/aquisição da BlueNord ASA (~US$ 1,33 bilhão / NOK 12,8 bilhões), que criaria a maior produtora independente de óleo e gás da Europa. Isso é a ASSINATURA/anúncio do acordo, não seu fechamento — não confundir os dois momentos (mesmo erro já ocorreu antes com Anglo American/Codelco neste painel). Os números de earnings acima (lucro, receita, EPS, produção) são exclusivamente do resultado operacional do 2T26 da Vår Energi standalone, não i rantidos, prazo de 10 anos, anunciada no mês anterior ao reporte; projeto com 42% de conclusão física ao final do 2T26, com início de operação previsto para o 2º semestre de 2026.", "conference_call_summary": "Não foi encontrada, nesta pesquisa, confirmação de teleconferência de resultados do 2T26 nem transcrição disponível para a Grupo México. Recomenda-se verificar diretamente no site de RI (gmexico.com) se houve conference call e obter a transcrição/áudio, caso exista, para complementar esta aba.", "commodity_commentary": "A imprensa financeira mexicana destacou o forte desempenho da Grupo México no 2T26 como reflexo direto do rali do cobre e da prata nos mercados internacionais. O El Financiero, em reportagem publicada em 21/07/2026 sob o título \"Grupo México 'hace su agosto' con el cobre: Ganancias se disparan 90.9% en el segundo trimestre de 2026\", enquadrou o resultado como um trimestre excepcional para a mineradora controlada por Germán Larrea, puxado pela alta de preços de cobre, prata, zinco e molibdênio [El Financiero]. A Reuters, em despacho replicado pelo TradingView, confirmou o salto de lucro (citado como alta de 79%) e atribuiu o resultado ao aumento de receitas e à melhora de custos operacionais por libra de cobre, apesar da queda de 3,7% na produção física de cobre no trimestre por causa de menor volume no Peru e na Asarco (EUA) [Reuters/TradingView]. Já o Milenio focou no salto de 49,6% do EBITDA como o indicador mais representativo da alavancagem operacional do grupo diante do ciclo favorável de preços de metais [Milenio]. Nenhuma das reportagens localizadas menciona reação específica do preço da ação (GMEXICOB) no pregão da BMV após a divulgação — recomenda-se busca complementar para captar a reação de mercado no dia do reporte, caso relevante para a tese de investimento."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Primeira entrada para esta empresa (n oqueio de acesso a antam.com e ao portal da IDX nesta sessão.", "conference_call_summary": "Não foi localizada, nesta pesquisa, confirmação de teleconferência de resultados do 1T26 ou transcrição disponível para a Antam. Recomenda-se verificar diretamente no site de RI (antam.com/id/investor-relations) se houve conference call/public expose e obter a transcrição, caso exista, para complementar esta aba.", "commodity_commentary": "A imprensa de negócios indonésia noticiou amplamente o salto de lucro da Antam no 1T26 como reflexo do ciclo favorável de preços de ouro e níquel no mercado internacional, somado à recuperação da demanda doméstica. Reportagens da Tempo.co (\"Antam Bukukan Laba Bersih Rp3,66 Triliun pada Kuartal I 2026\"), da Okezone Economy e da VOI destacaram o crescimento de 58% no lucro líquido ano contra ano, atribuindo o resultado principalmente à forte contribuição das vendas domésticas de ouro, minério de níquel e bauxita, que responderam por 97% da receita total do trimestre [Tempo; Okezone; VOI]. A cobertura também enfatizou o salto de 55% no EBITDA e de 67% no lucro operacional como sinais de melhora de margem operacional da estatal de mineração. Não foram encontradas, nesta pesquisa, reportagens de veículos como Bloomberg, Reuters ou The Edge Malaysia especificamente sobre este resultado — a cobertura ficou concentrada em veículos indonésios de língua local (Tempo, Okezone, VOI, RM.id, Pewarta, Koran BUMN), o que é aceitável como fallback regional conforme os critérios desta planilha. Também não foi encontrada menção explícita à reação do preço da ação ANTM na IDX no pregão pós-divulgação. Importante: como o resultado é do 1T26 (divulgado em 28/04/2026) e hoje é 27/07/2026, esta cobertura reflete a reação de mercado da época da divulgação, não uma notícia nova — friso isso para que fique claro que não se trata de cobertura de um evento recente."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "s
