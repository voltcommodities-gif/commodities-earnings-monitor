aptured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Resultados IFRS — 1S26 (divulgado em 24/07/2026), via cobertura de agência**\n\nATENÇÃO: a Novatek é empresa russa sancionada; não foi localizado um comunicado oficial diretamente acessível no site da empresa. Os números abaixo vêm de cobertura de agências de notícia (TASS, Rigzone) que reportam diretamente os dados do IFRS divulgado pela companhia — tratados aqui como \"cobertura de agência\", não como comunicado oficial primário.\n\n- **Lucro líquido atribuível aos acionistas (IFRS)**: RUB 218,7 bilhões (~US$ 2,8 bilhões), -3,1% A/A [TASS]\n- **Receita de vendas**: RUB 836,3 bilhões (~US$ 10,71 bilhões), +3,9% A/A [TASS/Rigzone]\n- **EBITDA normalizado (incl. participação em joint ventures)**: RUB 430,4 bilhões (~US$ 5,51 bilhões), -8,8% A/A [TASS]\n- **Lucro normalizado atribuível aos acionistas (ex-efeito cambial)**: RUB 216,5 bilhões (~US$ 2,77 bilhões), -8,7% A/A [TASS]\n- **Fluxo de caixa operacional**: RUB 172,25 bilhões, -12% A/A [Rigzone]\n- **Produção total**: 346 MMboe (1,91 MMboe/d), +3% A/A [Rigzone]\n- **Produção de gás natural**: 43,68 bcm, +3% A/A [Rigzone]\n- **Produção de líquidos**: 7,14 milhões de toneladas, +3% A/A [Rigzone]\n\nNão há, nas fontes consultadas, dados de guidance formal para o 2S26/2026 nem detalhamento de capex — se esses dados existem em algum release russo não indexado nas buscas em inglês, não foram encontrados nesta pesquisa.", "conference_call_summary": "Não foi localizada nenhuma teleconferência pública ou transcript associado a este resultado nas fontes pesquisadas. Dado o contexto de sanções ocidentais, é plausível que a Novatek não realize (ou não divulgue publicamente em canais acessíveis a analistas ocidentais) uma call de resultados aberta como fariam companhias não sancionadas. Isso deve ser tratado como lacuna confirmada, não como omissão de pesquisa incompleta — se o leitor tiver acesso a canais russos/locais (Interfax Rússia, site da própria Novatek em russo), vale checagem adicional.", "commodity_commentary": "Não foi encontrada, nas fontes pesquisadas, nenhuma matéria de imprensa financeira (Bloomberg, Reuters, FT, WSJ ou equivalente) especificamente sobre reação de mercado/analistas a este resultado do 1S26. O que existe é cobertura factual replicando os números do IFRS (TASS, Rigzone, e uma nota da LNG Prime com o mesmo conteúdo), sem análise de reação de mercado ou comentário de analistas — consistente com o esperado dado que a Novatek está sob sanções ocidentais, tem cobertura de sell-side ocidental extremamente limitada e não é negociada em bolsas ocidentais de forma líquida. Como contexto histórico (não como reação a ESTE resultado específico, e por isso não citado como commentary_source): reportagens de anos recentes mostraram o lucro anual da Novatek recuando cerca de 60% em 2025 ante o impacto de sanções sobre os projetos Arctic LNG, o que ajuda a contextualizar a trajetória de queda de EBITDA/lucro normalizado observada também neste 1S26 — mas isso é pano de fundo, não comentário específico sobre a divulgação de 24/07/2026. Por não haver fonte de imprensa que atenda ao critério de qualidade exigido (matéria específica sobre ESTE resultado, de veículo confiável, datada corretamente), commentary_sources foi deixado vazio propositalmente, em vez de preenchido com algo aproximado."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Empresa russa sob sanções ocidentais — não foi localizado comunicado oficial da própria empresa diretamente acessível; os dados financeiros vêm de cobertura de agência (TASS, Rigzone), rotulada como tal (não como \"comunicado oficial\") em conformidade com a regra de sourcing. Nenhuma cobertura de imprensa financeira ocidental (Bloomberg/Reuters/FT/WSJ) com reação de mercado/analistas foi encontrada especificamente sobre este resultado — commentary_sources ficou vazio de propósito. LIMITAÇÃO METODOLÓGICA: a política de egress desta sessão bloqueou WebFetch/curl direto para todos os domínios externos testados (confirmado até em google.com); todos os números vêm de síntese de WebSearch que cita os dados do IFRS, não de leitura direta do documento. Os números batem exatamente com os fornecidos na triagem inicial (RUB 218,7bi / ~US$2,8bi, -3,1% A/A; receita RUB 836,3bi), o que dá confiança razoável, mas recomenda-se conferência direta quando o acesso à rede for restabelecido. Esta entrada substitui um registro anterior de dados operacionais preliminares.", "commentary_sources": []}, "aker-bp": {"company_id": "aker-bp", "accession_number": null, "company_name": "Aker BP ASA", "commodities": ["oil", "gas"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "second-quarter-2026-results.html", "label": "Press release da empresa — título original: \"Second quarter 2026 results\" (børsmelding / comunicado ao mercado, Oslo Børs)", "source_url": "https://akerbp.com/en/borsmelding/second-quarter-2026-results-2/", "captured_at": "2026-07-20T00:00:00Z"}, {"filename": "aker-bp-second-quarter-2026-results-302825976.html", "label": "Distribuição via PR Newswire/Cision do mesmo comunicado", "source_url": "https://www.prnewswire.com/news-releases/aker-bp-second-quarter-2026-results-302825976.html", "captured_at": "2026-07-20T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 2T26 (trimestre encerrado em 30/06/2026), divulgados em 15/07/2026** [PR].\n\n**Resultado consolidado:**\n- Receita total (total income): US$ 3,7 bilhões, alta de 22% a/a, impulsionada por preços de óleo realizados mais altos [PR].\n- EBITDA: US$ 3,4 bilhões, alta de 51% a/a [PR].\n- Lucro líquido: US$ 521 milhões (US$ 0,82/ação), revertendo prejuízo de US$ 324 milhões (US$ -0,51/ação) no 2T25 — prejuízo do ano anterior associado a impairment, segundo fontes secundárias (não confirmado no documento primário) [PR].\n- Lucro por ação ajustado (excluindo impairment): US$ 1,15 — acima da expectativa de consenso de ~US$ 0,96 [PR].\n- Fluxo de caixa operacional: US$ 3,1 bilhões — recorde histórico trimestral da companhia [PR].\n- Liquidez disponível: US$ 6,0 bilhões [PR].\n\n**Produção:**\n- Produção líquida média: 383,6 mil boe/d, ante 415,0 mil boe/d no 2T25, refletindo parada programada de manutenção [PR].\n- Preço realizado de óleo: US$ 110/bbl; preço realizado de líquidos: US$ 108/bbl [PR].\n\n**Guidance e capex 2026:**\n- Guidance de produção: estreitada para 380–400 mil boe/d, elevando o piso da faixa anterior (370–400 mil boe/d) [PR].\n- Guidance de capex: elevada para US$ 6,8–7,2 bilhões (de US$ 6,2–6,7 bilhões) [PR].\n\n**Dividendo:**\n- Dividendo trimestral mantido em US$ 0,6615/ação [PR].\n\n**Projetos principais:**\n- Yggdrasil: topside do Hugin B instalado offshore no início de julho; sistema de power-from-shore comissionado em junho [PR].\n- Valhall PWP-Fenris e Skarv Satellite seguem no cronograma, com início de operação visado para 2027 [PR].", "conference_call_summary": "Citações do CEO Karl Johnny Hersvik no press release:\n\n\"Aker BP delivered strong operational performance in the second quarter, demonstrating the quality, resilience and efficiency of our portfolio. Combined with higher realised oil prices, this resulted in operating cash flow of USD 3.1 billion – the highest quarterly operating cash flow in Aker BP's history. We remain focused on what we can control: safe operations, high efficiency, low costs and continuous improvement across the value chain.\"\n^Tradução livre: \"A Aker BP entregou forte desempenho operacional no segundo trimestre, demonstrando a qualidade, resiliência e eficiência do nosso portfólio. Combinado a preços de óleo realizados mais altos, isso resultou em fluxo de caixa operacional de US$ 3,1 bilhões — o maior fluxo de caixa operacional trimestral da história da Aker BP. Seguimos focados no que podemos controlar: operações seguras, alta eficiência, baixos custos e melhoria contínua ao longo da cadeia de valor.\"\n\n\"Our major development projects are moving steadily towards start-up in 2027, and the execution teams have reached important milestones. At Yggdrasil, the commissioning of the power-from-shore system and the offshore installation of the Hugin B topside mark significant progress. The Hugin B sailaway also concludes our project period at Verdal, where teams and suppliers have delivered high-quality work over several years.\"\n^Tradução livre: \"Nossos principais projetos de desenvolvimento avançam de forma constante rumo ao início de operação em 2027, e as equipes de execução atingiram marcos importantes. No Yggdrasil, o comissionamento do sistema de power-from-shore e a instalação offshore do topside do Hugin B marcam um progresso significativo. A saída do Hugin B de Verdal também encerra nosso período de projeto ali, onde equipes e fornecedores entregaram trabalho de alta qualidade ao longo de vários anos.\"\n\nNão foi localizada transcrição completa e verbatim da teleconferência de resultados (apenas trechos via agregadores); as citações acima vêm do texto do press release oficial.", "commodity_commentary": "O resultado do 2T26 da Aker BP foi recebido como forte do ponto de vista operacional e de geração de caixa, mas com ressalvas sobre o ritmo de investimento. O lucro líquido de US$ 521 milhões reverteu o prejuízo de US$ 324 milhões no 2T25, e o EPS ajustado de US$ 1,15 superou a expectativa de consenso de ~US$ 0,96 [Investing.com]. O fluxo de caixa operacional recorde de US$ 3,1 bilhões foi destacado como o principal ponto positivo do trimestre, refletindo preços de óleo realizados mais altos (US$ 110/bbl) em meio a tensões geopolíticas no Oriente Médio que sustentaram os preços do petróleo ao longo do trimestre [Investing.com].\n\nA imprensa especializada em óleo & gás destacou o aumento simultâneo da guidance de capex 2026 (para US$ 6,8–7,2 bilhões, de US$ 6,2–6,7 bilhões) para acomodar o avanço dos grandes projetos (Yggdrasil, Valhall PWP-Fenris, Skarv Satellite) rumo a start-up em 2027, o que gerou alguma cautela entre investidores quanto à trajetória de retorno de caixa via dividendos nos próximos trimestres [World Oil]. A companhia manteve o dividendo trimestral em US$ 0,6615/ação, sinalizando compromisso com a política de distribuição apesar do maior capex [Investing.com][Offshore Engineer].\n\nNão foi localizada cobertura dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre a reação de mercado a este resultado — a análise disponível veio de Investing.com (agregador financeiro com reportagem própria) e de imprensa especializada em óleo & gás (World Oil, Offshore Engineer), usadas aqui como fallback conforme regra de sourcing."}, "generated_by": "claude-research", "generated_at": "2026-07-20T00:00:00Z", "status": "summarized", "note_for_reviewer": "Tentativas de acessar diretamente o press release primário (akerbp.com e a distribuição via PR Newswire) retornaram HTTP 403 em todas as tentativas — bloqueio do próprio site (anti-bot), não da política de proxy da sessão. Dados extraídos via múltiplas fontes secundárias (StockTitan, GuruFocus, Investing.com, World Oil, Offshore Engineer) que citam o release e batem entre si nos números centrais (lucro líquido US$ 521mi, fluxo de caixa operacional US$ 3,1bi, dividendo US$ 0,6615/ação). O comparativo do prejuízo de US$ 324 milhões no 2T25 e sua atribuição a impairment não pôde ser confirmado no documento primário. Recomenda-se reconfirmar diretamente no akerbp.com quando o site estiver acessível, e localizar a data de pagamento/registro do dividendo trimestral, que não foi encontrada nas fontes consultadas. Nenhuma cobertura da Bloomberg/Reuters/FT/WSJ especificamente sobre a reação a este resultado foi localizada; usei Investing.com e imprensa especializada em O&G como fallback.", "commentary_sources": [{"outlet": "Investing.com", "title": "Aker BP Q2 profit jumps on higher oil prices, ramps up proje /ródio/ouro (4E) com subprodutos de cobre e níquel [PR].\n\n**Resultado consolidado (acumulado dos nove meses fiscais, 01/09/2025–31/05/2026):**\n- Prejuízo líquido: US$ 2,88 milhões (US$ 0,02/ação, básico e diluído), ante prejuízo de US$ 3,40 milhões no mesmo período do ano anterior [PR].\n- Receita financeira (finance income): US$ 0,97 milhão [PR].\n- Sem receita operacional — companhia pré-produção [PR].\n- Prejuízo líquido isolado do 3T (3 meses) não confirmado nas fontes consultadas; apenas o acumulado de 9 meses foi localizado com confiança (ver nota do revisor).\n\n**Posição de caixa:**\n- Caixa e equivalentes de caixa: US$ 44,682 milhões em 31/05/2026, ante apenas US$ 0,417 milhão em 31/08/2025 — forte reforço de liquidez via emissões de ações no programa ATM [PR].\n\n**Projeto Waterberg:**\n- Gastos do trimestre no projeto: ~US$ 1,8 milhão [PR].\n- Custos líquidos capitalizados acumulados: US$ 55,2 milhões; gasto total no projeto desde o início: ~US$ 92,9 milhões [PR].\n- Estudo T-Zone: em 08/05/2026, na assembleia geral (AGM) da Waterberg JV Co., foi aprovado orçamento suplementar de R$ 27,4 milhões de rand (~US$ 1,69 milhão) para financiar a parcela do fiscal 2026 de um estudo de mineração (T-Zone Mining Study), que avalia a viabilidade de desenvolver o Waterberg em fases, começando por uma mina T-Zone menor e de menor custo [PR].\n\n**Financiamento (programa ATM):**\n- Programa ATM 2025 (encerrado): captou US$ 50,0 milhões brutos com a venda de 22.726.804 ações ordinárias a preço médio de US$ 2,20 [PR].\n- Novo programa ATM 2026: permite captar até US$ 60,0 milhões em ações até 13/12/2026; já captou US$ 2,01 milhões brutos no 3T fiscal 2026 [PR].", "conference_call_summary": "Não foi localizada transcrição de teleconferência de resultados para o 3T fiscal 2026, nem citação direta do CEO Frank R. Hallam (President, CEO e Diretor da companhia) no material disponível para consulta. Companhias júnior deste porte frequentemente não realizam call trimestral formal, divulgando apenas o press release com o MD&A. Recomenda-se checar diretamente o site da Platinum Group Metals (plgmtd.com) ou o Formulário 6-K completo no SEDAR+/SEC (que inclui o MD&A na íntegra) caso uma citação executiva seja necessária para uso posterior.", "commodity_commentary": "Não foi possível confirmar cobertura de imprensa de primeira linha (Bloomberg, Reuters, FT, WSJ) nem de veículos especializados em mineração/PGM (Mining.com, Mining Weekly, Kitco) especificamente sobre o resultado do 3T fiscal 2026 da Platinum Group Metals. As buscas retornaram apenas republicações do próprio press release via serviços de distribuição de wire (Newsfile Corp, StockTitan, TradingView, Investing News Network, Barchart, Yahoo Finance) — nenhuma delas constitui reportagem jornalística independente com análise de mercado sobre o resultado.\n\nA cobertura da Kitco no período (16–21/07) tratou do mercado de platina/paládio de forma geral — por exemplo, projeções do WPIC de um quarto déficit anual consecutivo de oferta de platina em 2026 e demanda de PGMs ligada a data centers de IA na China — mas não mencionou a Platinum Group Metals especificamente.\n\nDado o porte da companhia (small-cap, pré-produção, sem fato relevante do tipo que costuma atrair cobertura dedicada), é plausível que este resultado trimestral simplesmente não tenha gerado cobertura de imprensa independente. O campo commentary_sources foi deixado vazio conforme a regra do projeto — nenhuma URL foi inventada."}, "generated_by": "claude-research", "generated_at": "2026-07-20T00:00:00Z", "status": "summarized", "note_for_reviewer": "Tentativas de acessar diretamente o press release primário (newsfilecorp.com) e o Formulário 6-K completo no SEC EDGAR retornaram HTTP 403 em todas as tentativas — bloqueio do próprio site (anti-bot), não da política de proxy da sessão. Dados extraídos via múltiplas fontes secundárias (StockTitan, TradingView, Yahoo Finance, buscas agregadas) que citam o release quase textualmente e batem entre si nos números centrais (prejuízo de US$ 2,88 milhões nos 9 meses fiscais, caixa de US$ 44,682 milhões). NÃO foi possível confirmar o prejuízo líquido isolado do trimestre (3 meses, e não os 9 meses acumulados) nem o número exato de ações em circulação ao final do período. Nenhuma citação executiva nem transcrição de call foi localizada. Nenhuma cobertura de imprensa financeira ou de trade press dedicada ao resultado foi encontrada; commentary_sources foi deixado vazio por honestidade, conforme regra explícita do projeto de nunca fabricar URL.", "commentary_sources": []}, "southern-copper": {"company_id": "southern-copper", "accession_number": "0001104659-26-085515", "company_name": "Southern Copper Corporation", "commodities": ["copper"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26 (primeira entrada)", "sources": [{"filename": "scco-20260721x8k.htm", "label": "Formulário 8-K informando a divulgação dos resultados do 2T26 e do dividendo trimestral", "source_url": "https://www.sec.gov/Archives/edgar/data/0001001838/000110465926085515/scco-20260721x8k.htm", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "scco-20260721xex99d1.htm", "label": "Exhibit 99.1 — Press release oficial com os resultados financeiros do 2T26 e 1S26", "source_url": "https://www.sec.gov/Archives/edgar/data/0001001838/000110465926085515/scco-20260721xex99d1.htm", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Southern Copper Corporation (SCCO) — Resultados do 2T26 (trimestre encerrado em 30/06/2026)** — primeira entrada no painel.\n\nDivulgado em 21/07/2026 via Formulário 8-K e press release oficial (Exhibit 99.1) [PR][8-K].\n\n- **Receita líquida (net sales)**: US$ 4.289,0 milhões no 2T26, ante US$ 3.051,0 milhões no 2T25 — alta de ~41% a/a, recorde trimestral [PR].\n- **Lucro líquido atribuível à Southern Copper**: US$ 1.670,0 milhões, ante US$ 973,4 milhões no 2T25 — alta de ~72% a/a, recorde trimestral. Margem líquida de 39% (vs. 32% no 2T25) [PR].\n- **EPS**: US$ 2,01 por ação (básico e diluído, operações continuadas), ante US$ 1,17 no 2T25 [PR].\n- **EBITDA ajustado**: recorde trimestral, em torno de US$ 2,96 bilhões, alta de ~60% a/a frente a US$ 1,79 bilhão no 2T25; margem de EBITDA ajustado de 67% (vs. 59% no 2T25) [PR]. *(Uma fonte secundária citou US$ 2.856 milhões para o mesmo trimestre — divergência não reconciliada, ver nota ao revisor.)*\n- **Acumulado 1S26**: receita de US$ 8.540,4 milhões (vs. US$ 6.172,9 milhões no 1S25); lucro líquido de US$ 3.246,8 milhões (vs. US$ 1.919,4 milhões no 1S25) [PR].\n- **Preço do cobre (referência de mercado)**: LME médio de US$ 6,04/lb no 2T26 (+30% a/a frente a US$ 4,32/lb no 2T25); COMEX médio de US$ 6,16/lb (+31% a/a) [PR].\n- **Produção/volume**: volume de vendas de cobre caiu ~1,5% a/a — o crescimento de receita foi explicado quase inteiramente pelos preços mais altos de cobre e subprodutos; produção de cobre no Peru veio mais fraca no período [PR].\n- **Dividendo**: conselho aprovou dividendo em dinheiro de US$ 1,10/ação e dividendo em ações de 0,0120 ação por ação ordinária, pagável em 27/08/2026 a acionistas de registro em 11/08/2026 — valor total estimado de US$ 3,23/ação somando as duas parcelas [8-K].\n- **Ações em circulação**: 834,3 milhões de ações em 30/06/2026 [8-K].", "conference_call_summary": "Teleconferência realizada em 21–22/07/2026, conduzida por Raul Jacob (Vice-Presidente de Finanças, Tesoureiro e CFO da Southern Copper) [Earnings Call]. Segundo coberturas agregadas da chamada, a administração classificou o trimestre como \"mais um trimestre excepcional\", com recordes em vendas, EBITDA ajustado e lucro líquido, atribuídos majoritariamente aos preços mais altos de cobre e subprodutos, já que o volume vendido de cobre efetivamente recuou ~1,5% a/a [Earnings Call]. Não foi possível acessar a transcrição oficial completa nesta pesquisa (restrição de rede) — detalhes sobre capex, atualização de projetos (incluindo Tía María, no Peru) e produção por país (México/Peru/Chile) mencionados em fontes secundárias não puderam ser verificados diretamente na transcrição primária. Recomenda-se ao revisor conferir a transcrição completa (Seeking Alpha/BamSEC/site de RI) antes de publicar detalhes operacionais mais finos.", "commodity_commentary": "O resultado recorde da Southern Copper no 2T26 teve reação positiva no mercado: as ações subiram cerca de 3,4%, para US$ 194,41, ante fechamento anterior de US$ 188,01 [TradingView News]. O lucro ajustado de US$ 2,01/ação veio acima de uma estimativa de consenso citada por agências de dados (US$ 1,95), e a receita de US$ 4,29 bilhões também superou a expectativa de US$ 4,27 bilhões segundo essa mesma leitura [TradingView News]. A cobertura da StockTitan classificou o trimestre como recorde em receita e lucro, impulsionado pela alta expressiva dos preços do cobre no LME e na COMEX, mesmo com produção de cobre mais fraca no Peru [StockTitan]. Já uma nota da Investing.com trouxe manchete de que o lucro teria \"perdido\" a estimativa por US$ 0,10, mesmo com receita acima do esperado — uma divergência frente às demais fontes que sugere bases de consenso diferentes entre provedores de dados, não reconciliada com confiança dentro do escopo desta pesquisa [Investing.com]. Não foi localizada, dentro do escopo desta pesquisa, uma matéria dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre a reação de mercado a este resultado da Southern Copper — as fontes disponíveis foram majoritariamente agregadores financeiros (TradingView News, StockTitan, Investing.com). Dado o porte e a liquidez da empresa, é provável que exista cobertura da Reuters ou Bloomberg não localizada por limitação de orçamento de busca nesta sessão; recomenda-se ao revisor buscar diretamente essas fontes antes da publicação final."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Devido a restrição de rede nesta sessão de pesquisa (política de egress da sessão bloqueou WebFetch/curl externo, confirmado até em google.com), não foi possível abrir diretamente os documentos primários (SEC EDGAR, stocktitan.net, tradingview.com) — todos retornaram HTTP 403. Os dados financeiros acima foram reconstruídos a partir de trechos e resumos desses documentos indexados por mecanismo de busca. Há duas divergências entre fontes secundárias que não puderam ser reconciliadas com os documentos primários: (1) EBITDA ajustado citado como US$ 2.956 milhões por uma fonte e US$ 2.856 milhões por outra; (2) se o EPS ajustado bateu (consenso US$ 1,95) ou perdeu (por US$ 0,10) a estimativa de mercado. Nenhuma cobertura da Bloomberg/Reuters foi localizada dentro do orçamento de busca desta sessão — recomenda-se nova tentativa antes de publicar. Esta é a primeira entrada da Southern Copper no painel.", "commentary_sources": [{"outlet": "TradingView News", "title": "Southern Copper posts record $4.29B revenue and $1.67B net income in 2Q26", "url": "https://www.tradingview.com/news/tradingview:191fc67f4180a:0-southern-copper-posts-record-4-29b-revenue-and-1-67b-net-income-in-2q26/", "captured_at": "2026-07-27T18:00:00Z"}, {"outlet": "StockTitan", "title": "Southern Copper posts record Q2 2026 revenue, profit", "url": "https://www.stocktitan.net/sec-filings/SCCO/8-k-southern-copper-corp-reports-material-event-473139fe8c1b.html", "captured_at": "2026-07-27T18:00:00Z"}, {"outlet": "Investing.com", "title": "Southern Copper earnings missed by $0.10, revenue topped estimates", "url": "https://www.investing.com/news/earnings/southern-copper-earnings-missed-by-010-revenue-topped-estimates-4805128", "captured_at": "2026-07-27T18:00:00Z"}]}, "newmont": {"company_id": "newmont", "accession_number": "0001164727-26-000034", "company_name": "Newmont Corporation", "commodities": ["gold", "copper"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26 (primeira entrada)", "sources": [{"filename": "nem-20260723.htm", "label": "Formulário 8-K com o press release de resultados do 2T26", "source_url": "https://www.sec.gov/Archives/edgar/data/0001164727/000116472726000034/nem-20260723.htm", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "Newmont-Reports-Robust-Second-Quarter-2026-Results-Remains-on-Track-to-Achieve-Full-Year-Guidance", "label": "Press release oficial no site de Relações com Investidores da Newmont: \"Newmont Reports Robust Second Quarter 2026 Results; Remains on Track to Achieve Full Year Guidance\"", "source_url": "https://www.newmont.com/investors/news-release/news-details/2026/Newmont-Reports-Robust-Second-Quarter-2026-Results-Remains-on-Track-to-Achieve-Full-Year-Guidance/default.aspx", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "20260723182582", "label": "Distribuição do press release de resultados do 2T26 via BusinessWire", "source_url": "https://www.businesswire.com/news/home/20260723182582/en/Newmont-Reports-Robust-Second-Quarter-2026-Results-Remains-on-Track-to-Achieve-Full-Year-Guidance", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Newmont Corporation (NEM) — \"Newmont Reports Robust Second Quarter 2026 Results; Remains on Track to Achieve Full Year Guidance\"** — primeira entrada no painel.\n\nDivulgado em 23/07/2026 via Formulário 8-K e press release oficial [PR][8-K].\n\n- **Lucro líquido reportado (GAAP)**: US$ 2,2 bilhões [PR].\n- **Lucro líquido ajustado**: US$ 2,2 bilhões, ou US$ 2,10/ação diluída ajustada [PR].\n- **EBITDA ajustado**: US$ 3,8 bilhões [PR].\n- **Receita**: US$ 6,12 bilhões no trimestre [PR] *(fontes secundárias divergem sobre se este valor superou ou ficou abaixo do consenso de mercado — ver nota ao revisor)*.\n- **Produção de ouro atribuível**: ~1,3 milhão de oz (1,29 milhão de oz segundo cobertura da imprensa), abaixo de 1,48 milhão de oz no 2T25 — queda atribuída a menor produção em Cadia (eventos sísmicos) e a teores mais baixos, dentro do sequenciamento de lavra já planejado, em Ahafo South, Peñasquito e Yanacocha [PR].\n- **Outros metais**: prata, 7 milhões de oz; cobre, 17 mil toneladas [PR].\n- **Preço de ouro realizado**: US$ 4.414/oz, ante US$ 3.320/oz no 2T25 (+33% a/a); preço médio de mercado do ouro no 2T26 foi de US$ 4.506,41/oz (+37% a/a) [PR].\n- **Custos**: CAS (by-product) de ouro de US$ 1.043/oz; AISC de US$ 1.621/oz — custos acumulados no ano seguem abaixo do guidance de custo para o ano cheio [PR].\n- **Fluxo de caixa livre**: recorde para um 2º trimestre, em US$ 2,2 bilhões [PR].\n- **Retorno a acionistas**: US$ 1,9 bilhão devolvido via dividendos e recompras no trimestre (incluindo US$ 1,7 bilhão em recompras, dentro da autorização de US$ 6 bilhões anunciada em abril/2026); redução de mais de 100 milhões de ações (~9% do free float) ao longo de dois anos de programa de recompra [PR].\n- **Guidance 2026 (reafirmado)**: produção de ouro atribuível de 5,3 milhões de oz; capex de desenvolvimento de ~US$ 1,4 bilhão em 2026; custos unitários devem subir no 3T26 por maior capex de sustentação e possível alta do petróleo [PR].", "conference_call_summary": "Teleconferência realizada em 23/07/2026, às 17h30 (horário do leste dos EUA), com a presidente e CEO Natascha Viljoen e o CFO Brian Tabolt [Earnings Call]. Não foi possível acessar a transcrição oficial completa nesta pesquisa devido a restrições de acesso à rede — resumo baseado em coberturas agregadas da chamada, não na transcrição primária. Segundo essas coberturas, a administração comentou: adiamento de parte do capex de desenvolvimento de PC1-2 relacionado a um evento sísmico; avanço das obras da barreira de contenção de solo (\"Nearshore Soil Barrier\") em Lihir, com ritmo mais intenso previsto para o 2S26; aumento do desembolso em Cerro Negro para a expansão 1; e pressão inflacionária sobre custos de capital, com a companhia revisando estimativas de engenharia e custo para mitigar o impacto [Earnings Call]. Recomenda-se ao revisor conferir a transcrição oficial antes de citar qualquer declaração como fala literal da administração.", "commodity_commentary": "A reação ao resultado do 2T26 da Newmont foi mista na imprensa. Segundo cobertura da Reuters (republicada pela BNN Bloomberg), a maior mineradora de ouro do mundo superou as estimativas de lucro do trimestre à medida que a alta do preço do ouro compensou a queda na produção, com lucro ajustado de US$ 2,10/ação ante consenso médio de analistas de US$ 1,99/ação [Reuters]. A mesma reportagem destacou que a produção trimestral de ouro caiu para 1,29 milhão de oz (de 1,48 milhão de oz um ano antes), afetada por eventos sísmicos em Cadia e por teores mais baixos em Ahafo South, Peñasquito e Yanacocha dentro do sequenciamento de lavra já planejado, e que a companhia sinalizou produção estável adiante (\"sees steady output\") [Reuters]. Já a Kitco News enfatizou o fluxo de caixa livre recorde para um segundo trimestre (US$ 2,2 bilhões), descrevendo que a Newmont \"driblou\" uma correção de 13% no preço do ouro ocorrida ao longo do trimestre para ainda assim superar as estimativas de lucro [Kitco News]. Apesar dos números operacionais fortes, parte da cobertura da imprensa financeira mencionou reação apática a levemente negativa da ação no pregão pós-resultado, associada à leitura de que a receita de US$ 6,12 bilhões pode ter ficado abaixo de algumas estimativas de consenso — ponto em que há divergência não reconciliada entre fontes secundárias (ver nota ao revisor) [Reuters]. A companhia reafirmou o guidance de produção de ouro de 5,3 milhões de oz para 2026."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Devido a restrição de rede nesta sessão de pesquisa (política de egress da sessão bloqueou WebFetch/curl externo, confirmado até em google.com), não foi possível abrir diretamente os documentos primários (SEC EDGAR, businesswire.com, newmont.com) — todos retornaram HTTP 403. Os dados financeiros acima foram reconstruídos a partir de trechos e resumos desses documentos indexados por mecanismo de busca, cruzados entre múltiplas fontes que concordam entre si. Há uma divergência não reconciliada entre fontes secundárias quanto à estimativa de consenso de EPS ajustado usada para julgar beat/miss (uma fonte cita consenso de US$ 1,99, outra cita US$ 2,12) e quanto a se a receita de US$ 6,12 bi bateu ou não o consenso — recomenda-se ao revisor confirmar com um provedor de consenso confiável (FactSet/Refinitiv/Visible Alpha) antes de publicar qualquer leitura de beat/miss. O movimento percentual exato do preço da ação não foi confirmado com um número preciso (fontes usam termos como \"dips\"/\"slips\"). Esta é a primeira entrada da Newmont no painel.", "commentary_sources": [{"outlet": "Reuters", "title": "Newmont tops profit estimates on higher gold prices, sees steady output", "url": "https://www.bnnbloomberg.ca/markets/gold/2026/07/24/newmont-tops-profit-estimates-on-higher-gold-prices-sees-steady-output/", "captured_at": "2026-07-27T18:00:00Z"}, {"outlet": "Kitco News", "title": "Newmont shrugs off 13% gold-price correction with record second-quarter free cash flow, tops earnings estimates", "url": "https://www.kitco.com/news/article/2026-07-23/newmont-shrugs-13-gold-price-correction-record-second-quarter-free-cash", "captured_at": "2026-07-27T18:00:00Z"}]}, "var-energi": {"company_id": "var-energi", "accession_number": null, "company_name": "Vår Energi ASA", "commodities": ["oil"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados recordes do 2T26 (primeira entrada)", "sources": [{"filename": "var-energi--second-quarter-2026-trading-update,c4372533", "label": "Comunicado oficial — Atualização de resultados do 2T26 (Cision/Vår Energi ASA)", "source_url": "https://news.cision.com/var-energi-asa/r/var-energi--second-quarter-2026-trading-update,c4372533", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "var-energi--second-quarter-2026-trading-update", "label": "Página oficial de comunicados ao mercado — Vår Energi ASA (2T26)", "source_url": "https://varenergi.no/en/newsroom/stock-exchange-announcements/?release=8AD2D86614284369", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Resultados financeiros — 2T26 (divulgado em 21/07/2026) — resultado recorde**\n\n- **Lucro líquido:** US$ 839 milhões (vs. US$ 374 milhões no 1T26) [PR]\n- **Receita:** US$ 3,72 bilhões — recorde, mais que dobrando vs. 2T25 [PR]\n- **Lucro por ação ajustado:** US$ 0,33 (consenso de mercado era de US$ 0,2071 — beat expressivo) [PR]\n- **Produção líquida (óleo, líquidos e gás natural):** 376 kboe/d no 2T26 (-7% vs. 1T26; +31% vs. 2T25); média do 1S26 de 391 kboe/d [PR]\n- **Composição da produção no trimestre:** 67% óleo/NGLs, 33% gás [PR]\n- **Preço médio realizado:** US$ 101/boe [PR]\n- **Fluxo de caixa das operações após impostos:** US$ 2,1 bilhões [PR]\n- **Dívida líquida:** reduzida de US$ 5,2 bi (1T26) para US$ 3,6 bi (2T26); alavancagem de 0,4x [PR]\n- **Liquidez disponível:** recorde de US$ 5,3 bilhões [PR]\n- **Dividendo do 2T26:** elevado para US$ 350 milhões (equivalente a NOK 1,355/ação) — guidance similar de US$ 350 milhões para o 3T26 [PR]\n\nA companhia atribuiu o dividendo maior a três fatores combinados: preços mais altos desde o início do conflito no Oriente Médio (março de 2026), resultados financeiros recordes, e o valor agregado esperado da combinação com a BlueNord (evento corporativo separado — ver nota ao revisor).", "conference_call_summary": "Webcast e sessão de perguntas e respostas realizados às 10h00 CEST em 21/07/2026, conduzidos pelo CEO Nick Walker e pelo CFO Carlo Santopadre. Em citações replicadas por veículos financeiros (Investing.com/transcript), Walker reafirmou a política de dividendos de longo prazo: \"permanecemos comprometidos com nossa política de dividendos de longo prazo de 25% a 30% do fluxo de caixa das operações após impostos ao longo dos ciclos\", e explicou o aumento do dividendo do trimestre: \"elevamos nossos dividendos hoje, e isso reflete duas coisas: reflete os preços mais altos que vimos recentemente desde o início do conflito no Oriente Médio em março, e também os resultados financeiros recordes e, claro, o negócio que fechamos hoje [BlueNord], que agrega valor\". Não foi possível acessar a transcrição completa diretamente (bloqueio de rede desta sessão) — resumo baseado em trechos replicados por terceiros.", "commodity_commentary": "A cobertura da imprensa financeira do dia (21/07/2026) tratou o resultado e o anúncio da fusão com a BlueNord como eventos conectados na reação do mercado, ainda que sejam corporativamente distintos. A Investing.com publicou \"Var Energi stock jumps on BlueNord acquisition agreement, Q2 revenue beat\", reportando alta das ações de 5,32% para US$ 45,93, próximo da máxima de 52 semanas (US$ 50,70), atribuída tanto ao beat de EPS ajustado (US$ 0,33 vs. US$ 0,2071 esperado) quanto ao anúncio da aquisição da BlueNord por cerca de US$ 1,33 bilhão — negócio que criaria a maior produtora independente de óleo e gás da Europa, com sinergias pós-impostos estimadas em US$ 250-300 milhões entre 2027 e 2032. A Yahoo Finance/Motley Fool também destacou os resultados em \"Var Energi ASA (VARRY) Q2 2026 Earnings Call Highlights: Record Revenue and Strategic Expansion\", enfatizando a receita recorde e a expansão estratégica via BlueNord. Não foram localizadas matérias específicas da Bloomberg ou Reuters sobre este resultado nas buscas realizadas nesta sessão — a cobertura usada como fonte é de imprensa financeira/especializada consolidada (Investing.com, Yahoo Finance), tratada aqui como fallback aceitável dado que é especificamente sobre este resultado e datada corretamente."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "IMPORTANTE — evento corporativo distinto: no mesmo dia (21/07/2026), a Vår Energi anunciou uma fusão/aquisição da BlueNord ASA (~US$ 1,33 bilhão / NOK 12,8 bilhões), que criaria a maior produtora independente de óleo e gás da Europa. Isso é a ASSINATURA/anúncio do acordo, não seu fechamento — não confundir os dois momentos (mesmo erro já ocorreu antes com Anglo American/Codelco neste painel). Os números de earnings acima (lucro, receita, EPS, produção) são exclusivamente do resultado operacional do 2T26 da Vår Energi standalone, não incluem a BlueNord. Esta é a primeira entrada de filing para esta empresa (não havia registro anterior). LIMITAÇÃO METODOLÓGICA: política de egress desta sessão bloqueou WebFetch/curl direto (confirmado até em google.com); todos os números vêm de síntese de WebSearch citando o release oficial (Cision/varenergi.no) e a call, não de leitura direta do documento primário — os valores batem com os fornecidos na triagem inicial (EPS ajustado US$0,33 vs. US$0,2071 est.; receita ~US$3,72bi), o que dá confiança razoável, mas recomenda-se conferência direta contra o PDF oficial quando o acesso à rede for restabelecido. Nenhuma matéria da Bloomberg/Reuters foi localizada especificamente sobre este resultado nesta pesquisa.", "commentary_sources": [{"outlet": "Investing.com", "title": "Var Energi stock jumps on BlueNord acquisition agreement, Q2 revenue beat", "url": "https://uk.investing.com/news/stock-market-news/var-energi-stock-jumps-on-bluenord-acquisition-agreement-q2-revenue-beat-4779231", "captured_at": "2026-07-21T12:00:00Z"}, {"outlet": "Yahoo Finance", "title": "Var Energi ASA (VARRY) Q2 2026 Earnings Call Highlights: Record Revenue and Strategic Expansion", "url": "https://finance.yahoo.com/energy/articles/var-energi-asa-varry-q2-010131349.html", "captured_at": "2026-07-21T12:00:00Z"}]}, "grupo-mexico": {"company_id": "grupo-mexico", "accession_number": null, "company_name": "Grupo México, S.A.B. de C.V.", "commodities": ["copper", "silver", "zinc"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26 (primeira entrada)", "sources": [{"filename": "reportes-financieros", "label": "Página de Relatórios Financeiros — Grupo México (Relação com Investidores)", "source_url": "https://www.gmexico.com/Pages/reportes-financieros.aspx", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "GMEXICO-6008-CGEN_CAPIT", "label": "Repositório de Informação Financeira e Anual da emissora GMEXICO na Bolsa Mexicana de Valores (BMV)", "source_url": "https://www.bmv.com.mx/es/emisoras/informacionfinanciera/GMEXICO-6008-CGEN_CAPIT", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 2T26 (abril–junho de 2026)** — divulgação identificada por volta de 20–21/07/2026. As cifras abaixo foram obtidas via cobertura de imprensa financeira que cita o reporte trimestral da Grupo México; NÃO foi possível nesta pesquisa acessar diretamente o PDF do relatório financeiro oficial (gmexico.com/Pages/reportes-financieros.aspx) nem o filing na BMV/CNBV, devido a bloqueio de rede desta sessão — os números abaixo devem ser conferidos contra o documento primário antes de uso definitivo em decisão de investimento.\n\n- **Receita líquida**: aprox. US$ 5.717 milhões (El Financiero) / US$ 5.710 milhões (Reuters, via TradingView) no 2T26, alta de ~34,9%–35% frente aos US$ 4.239 milhões do 2T25.\n- **Lucro líquido (utilidad neta)**: HÁ DIVERGÊNCIA entre fontes de imprensa que citam o mesmo reporte. El Financiero reporta US$ 2.093,14 milhões, alta de 90,9% frente aos US$ 1.096,54 milhões do 2T25; já Reuters (via TradingView), El Diario de Chihuahua e Diario.mx reportam alta de 79% no lucro líquido no período, sem especificar o mesmo valor absoluto em todas as notas. A divergência percentual (90,9% vs. 79%) provavelmente decorre de bases de comparação distintas (ex.: lucro líquido total vs. lucro líquido atribuível aos acionistas controladores) — não foi possível confirmar qual métrica corresponde à \"utilidad neta mayoritaria\" oficial sem acesso ao documento primário.\n- **EBITDA**: US$ 3.536 milhões no 2T26, alta de 49,6% ante o 2T25.\n- **Produção de cobre**: 257.537 toneladas métricas no 2T26, queda de 3,7% ante o 2T25, atribuída a menor produção no Peru e na subsidiária americana Asarco.\n- **Preços realizados (variação anual)**: cobre +30,5%, prata +118,6%, zinco +30,8%, molibdênio +42,9%.\n- **Projeto Tía María (Peru)**: financiado em parte por emissão de US$ 1.250 milhões em bonds sênior não garantidos, prazo de 10 anos, anunciada no mês anterior ao reporte; projeto com 42% de conclusão física ao final do 2T26, com início de operação previsto para o 2º semestre de 2026.", "conference_call_summary": "Não foi encontrada, nesta pesquisa, confirmação de teleconferência de resultados do 2T26 nem transcrição disponível para a Grupo México. Recomenda-se verificar diretamente no site de RI (gmexico.com) se houve conference call e obter a transcrição/áudio, caso exista, para complementar esta aba.", "commodity_commentary": "A imprensa financeira mexicana destacou o forte desempenho da Grupo México no 2T26 como reflexo direto do rali do cobre e da prata nos mercados internacionais. O El Financiero, em reportagem publicada em 21/07/2026 sob o título \"Grupo México 'hace su agosto' con el cobre: Ganancias se disparan 90.9% en el segundo trimestre de 2026\", enquadrou o resultado como um trimestre excepcional para a mineradora controlada por Germán Larrea, puxado pela alta de preços de cobre, prata, zinco e molibdênio [El Financiero]. A Reuters, em despacho replicado pelo TradingView, confirmou o salto de lucro (citado como alta de 79%) e atribuiu o resultado ao aumento de receitas e à melhora de custos operacionais por libra de cobre, apesar da queda de 3,7% na produção física de cobre no trimestre por causa de menor volume no Peru e na Asarco (EUA) [Reuters/TradingView]. Já o Milenio focou no salto de 49,6% do EBITDA como o indicador mais representativo da alavancagem operacional do grupo diante do ciclo favorável de preços de metais [Milenio]. Nenhuma das reportagens localizadas menciona reação específica do preço da ação (GMEXICOB) no pregão da BMV após a divulgação — recomenda-se busca complementar para captar a reação de mercado no dia do reporte, caso relevante para a tese de investimento."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Primeira entrada para esta empresa (não havia filing anterior). GAP IMPORTANTE: não foi possível nesta pesquisa acessar diretamente o relatório financeiro/PDF oficial da Grupo México (política de egress da sessão impediu fetch de gmexico.com e do PDF de resultados) — todas as cifras acima vêm de cobertura de imprensa que cita o reporte, não do documento primário lido diretamente. HÁ DIVERGÊNCIA NÃO RESOLVIDA entre fontes de imprensa sobre o percentual de alta do lucro líquido (90,9% segundo El Financiero vs. 79% segundo Reuters/El Diario de Chihuahua/Diario.mx) — provavelmente métricas distintas (lucro total vs. atribuível a controladores), mas não confirmado. Antes de publicar definitivamente, buscar e ler o reporte trimestral oficial 2T26 em gmexico.com/Pages/reportes-financieros.aspx (ou o filing na BMV/CNBV) para (1) confirmar as cifras exatas de receita, utilidade líquida, EBITDA e produção, e (2) resolver a divergência do percentual de lucro.", "commentary_sources": [{"outlet": "El Financiero", "title": "Grupo México 'hace su agosto' con el cobre: Ganancias se disparan 90.9% en el segundo trimestre de 2026", "url": "https://www.elfinanciero.com.mx/empresas/2026/07/21/grupo-mexico-hace-su-agosto-con-el-cobre-ganancias-se-disparan-909-en-el-segundo-trimestre-de-2026/", "captured_at": "2026-07-21T12:00:00Z"}, {"outlet": "Reuters (via TradingView)", "title": "Ganancia neta de Grupo México se dispara un 79% por alza de ingresos", "url": "https://es.tradingview.com/news/  outra fonte cita ~Rp 3,41 trilhões com alta de aproximadamente 59,85%–61,9% conforme o veículo. Não foi possível, nesta pesquisa, confirmar qual valor corresponde exatamente ao lucro líquido atribuível aos acionistas controladores informado oficialmente pela Antam — a divergência pode refletir bases de cálculo diferentes (lucro total vs. atribuível a controladores) ou imprecisão de imprensa.\n\nNenhuma destas cifras foi verificada diretamente contra o relatório financeiro trimestral oficial da Antam (IDX/RI) nesta pesquisa, devido a bloqueio de acesso a antam.com e ao portal da IDX nesta sessão.", "conference_call_summary": "Não foi localizada, nesta pesquisa, confirmação de teleconferência de resultados do 1T26 ou transcrição disponível para a Antam. Recomenda-se verificar diretamente no site de RI (antam.com/id/investor-relations) se houve conference call/public expose e obter a transcrição, caso exista, para complementar esta aba.", "commodity_commentary": "A imprensa de negócios indonésia noticiou amplamente o salto de lucro da Antam no 1T26 como reflexo do ciclo favorável de preços de ouro e níquel no mercado internacional, somado à recuperação da demanda doméstica. Reportagens da Tempo.co (\"Antam Bukukan Laba Bersih Rp3,66 Triliun pada Kuartal I 2026\"), da Okezone Economy e da VOI destacaram o crescimento de 58% no lucro líquido ano contra ano, atribuindo o resultado principalmente à forte contribuição das vendas domésticas de ouro, minério de níquel e bauxita, que responderam por 97% da receita total do trimestre [Tempo; Okezone; VOI]. A cobertura também enfatizou o salto de 55% no EBITDA e de 67% no lucro operacional como sinais de melhora de margem operacional da estatal de mineração. Não foram encontradas, nesta pesquisa, reportagens de veículos como Bloomberg, Reuters ou The Edge Malaysia especificamente sobre este resultado — a cobertura ficou concentrada em veículos indonésios de língua local (Tempo, Okezone, VOI, RM.id, Pewarta, Koran BUMN), o que é aceitável como fallback regional conforme os critérios desta planilha. Também não foi encontrada menção explícita à reação do preço da ação ANTM na IDX no pregão pós-divulgação. Importante: como o resultado é do 1T26 (divulgado em 28/04/2026) e hoje é 27/07/2026, esta cobertura reflete a reação de mercado da época da divulgação, não uma notícia nova — friso isso para que fique claro que não se trata de cobertura de um evento recente."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Primeira entrada para esta empresa. Dados são do 1T26 (divulgados ~28/04/2026) — pesquisa específica por resultados do 2T26 (kuartal II 2026) não retornou nenhum resultado publicado até a data desta pesquisa (27/07/2026); é possível que o 2T26 ainda não tenha sido divulgado (emissoras indonésias costumam publicar resultados trimestrais no fim de julho/início de agosto) ou que a cobertura ainda não tenha sido indexada pelos buscadores usados — vale nova checagem em 1–2 semanas. GAP: não foi possível acessar diretamente o relatório financeiro oficial da Antam (antam.com nem IDX) nesta pesquisa por bloqueio de rede desta sessão; todas as cifras vêm de imprensa secundária. HÁ DIVERGÊNCIA NÃO RESOLVIDA sobre o lucro líquido do 1T26: maioria da imprensa cita Rp 3,66 tri (+58%), mas Koran BUMN cita Rp 3,40 tri e outra fonte ~Rp 3,41 tri (+~60%) — os dois valores podem ser lucro total vs. lucro atribuível aos controladores. NOTA ADICIONAL: a categorização \"commodities: aluminum\" cadastrada para esta empresa provavelmente está incorreta (a Antam é primariamente uma mineradora de níquel e ouro, com bauxita/alumina como linha secundária) — o array de commodities não foi alterado nesta atualização, mas fica o registro para eventual correção futura. Confirmar todas as cifras contra o relatório oficial da Antam antes de finalizar esta ficha.", "commentary_sources": [{"outlet": "Tempo.co", "title": "Antam Bukukan tório operacional/de produção — NÃO contém demonstrações financeiras auditadas. Os resultados financeiros auditados completos (incluindo lucro, balanço e dividendo) estão previstos para ~03/09/2026, ainda não divulgados.\n\nDados operacionais confirmados no comunicado:\n- Produção refinada 6E (inclui onças vendáveis do Impala Rustenburg North Shafts e Impala Canada): alta de 5%, para 3,56 milhões de onças 6E [SENS].\n- Produção das operações administradas (managed operations): alta de 1%, para 2,75 milhões de onças 6E [SENS].\n- Volumes na refinaria de metais preciosos (PGM refinery): alta de 6%, para 2,92 milhões de onças 6E [SENS].\n- Estoque excedente de produtos em processo (WIP) reduzido para 300 mil onças 6E, conforme esperado [SENS].\n- Receita de vendas: alta de mais de 50%, para ZAR 38.100 por onça 6E vendida, refletindo forte valorização em dólar dos preços de metais preciosos e básicos no período [SENS].\n- Custos unitários do grupo por onça 6E: aumento esperado de 8%, para aproximadamente ZAR 24.250/onça 6E em base ajustada por estoque [SENS].\n- Segurança: 4 fatalidades registradas nas operações administradas do grupo no período [SENS].\n\nNenhum número de lucro líquido, EBITDA, HEPS ou dividendo pode ser reportado aqui porque este comunicado é exclusivamente operacional — esses dados só estarão disponíveis nos resultados anuais auditados de ~03/09/2026.", "conference_call_summary": "Comunicados de produção anual (production updates) da Implats tipicamente não são acompanhados de teleconferência de resultados com analistas — esse tipo de evento costuma ocorrer apenas na divulgação dos resultados financeiros anuais auditados. Não foi encontrada nesta pesquisa qualquer referência a uma teleconferência associada a este comunicado de produção de 31/07/2026. Recomenda-se confirmar diretamente no site de RI da Implats (implats.co.za) se um call foi de fato realizado; se sim, deve ser adicionado no próximo ciclo de atualização.", "commodity_commentary": "A cobertura de imprensa sobre a atualização de produção da Impala Platinum para o ano fiscal encerrado em 30/06/2026 veio principalmente de veículos regionais sul-africanos, sem confirmação de matéria dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre este comunicado dentro do escopo desta pesquisa. O IOL Business Report publicou, em 31/07/2026, a matéria 'Impala Platinum reports strong operational performance amid rising metals prices', destacando o desempenho operacional forte da empresa em meio à valorização dos preços dos metais [IOL Business Report]. A CNBC Africa também noticiou, em reportagem separada, a pausa temporária das operações de mineração em Rustenburg após um episódio de feridos e fatalidades ('Impala Platinum pauses mining at Rustenburg following injuries, fatalities') [CNBC Africa] — não foi possível confirmar com precisão, nesta pesquisa, se essa reportagem trata do mesmo grupo de 4 fatalidades mencionado no comunicado de produção do ano fiscal ou de um incidente distinto, nem sua data exata — essa distinção deve ser verificada antes de qualquer conclusão. Dado que este é um relatório de produção (não de earnings completos), a cobertura de imprensa financeira tende a ser mais escassa do que a esperada para os resultados auditados de setembro; recomenda-se nova varredura de commodity_commentary quando os resultados financeiros completos forem divulgados em ~03/09/2026."}, "commentary_sources": [{"outlet": "IOL Business Report", "title": "Impala Platinum reports strong operational performance amid rising metals prices", "url": "https://iol.co.za/business-report/companies/2026-07-31-impala-platinum-reports-strong-operational-performance-amid-rising-metals-prices/", "captured_at": "2026-08-03T18:00:00Z"}, {"outlet": "CNBC Africa", "title": "Impala Platinum pauses mining at Rustenburg following injuries, fatalities", "url": "https://www.cnbcafrica.com/2026/impala-platinum-pauses-mining-operations-at-rustenburg-for-safety-reset", "captured_at":  "HF Sinclair Corporation", "commodities": ["oil"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26", "sources": [{"filename": "dinoex99106-30x2026.htm", "label": "HF Sinclair — Exhibit 99.1 (Comunicado de Resultados do 2T26) anexo ao 8-K — SEC EDGAR", "source_url": "https://www.sec.gov/Archives/edgar/data/0001915657/000191565726000046/dinoex99106-30x2026.htm", "captured_at": "2026-08-03T18:00:00Z"}, {"filename": "dinoex992strategictransform.htm", "label": "HF Sinclair — Exhibit 99.2 (Anúncio de cisão do segmento Lubricants & Specialties) anexo ao mesmo 8-K — SEC EDGAR", "source_url": "https://www.sec.gov/Archives/edgar/data/0001915657/000191565726000046/dinoex992strategictransform.htm", "captured_at": "2026-08-03T18:00:00Z"}, {"filename": "hf-sinclair-reports-2026-second-quarter-results-and-announces-increase-in-regular-cash-dividend.html", "label": "Comunicado oficial de resultados do 2T26 (distribuição BusinessWire)", "source_url": "https://www.businesswire.com/news/home/20260728018102/en/HF-Sinclair-Reports-2026-Second-Quarter-Results-and-Announces-Increase-in-Regular-Cash-Dividend", "captured_at": "2026-08-03T18:00:00Z"}], "tabs": {"earnings_summary": "Resultados do 2T26 (trimestre encerrado em 30/06/2026), divulgados em 28/07/2026 [PR][8-K]:\n- Lucro líquido atribuível aos acionistas de $892 milhões, ou $4,93 por ação diluída, vs $208 milhões ($1,10/ação) no 2T25 [PR][8-K].\n- Lucro líquido ajustado de $960 milhões, ou $5,31 por ação diluída, vs $322 milhões ($1,70/ação) no 2T25 [PR][8-K].\n- Receita de $10,39 bilhões no trimestre, alta de 53,0% frente $6,78 bilhões no 2T25 [PR][8-K].\n- EBITDA reportado de $1.404 milhões; EBITDA ajustado de $1.482 milhões [PR][8-K].\n- Dividendo trimestral regular elevado em 5%, para $0,525 por ação [PR][8-K].\n- Retorno de capital de $265 milhões aos acionistas no trimestre via dividendos e recompra de ações [PR][8-K].\n- Anúncio de plano de separação (spin-off) do segmento de Lubrificantes & Especialidades (Lubricants & Specialties) da companhia, detalhado no Exhibit 99.2 anexo ao mesmo 8-K [8-K Exhibit 99.2].", "conference_call_summary": "O conteúdo integral da transcrição da teleconferência não pôde ser lido diretamente nesta sessão (ferramenta de leitura de páginas web fora do ar, retornando erro 403 de forma sistêmica). Cobertura secundária localizada via busca — título \"Earnings call transcript: HF Sinclair tops Q2 2026 estimates on stronger refining\" (Investing.com) — indica que o desempenho acima do esperado no trimestre foi atribuído principalmente à força do segmento de refino, mas não foi possível confirmar citações específicas da administração sobre margens de crack spread, guidance de utilização das refinarias ou cronograma detalhado do spin-off de Lubrificantes & Especialidades anunciado junto com os resultados. Recomenda-se releitura da transcrição completa (disponível via Investing.com/Yahoo Finance) em atualização futura para captar detalhes qualitativos da administração sobre o spin-off e a perspectiva de margens para o 2S26.", "commodity_commentary": "Não foi confirmada cobertura de Bloomberg, Reuters, FT ou WSJ tratando especificamente da reação do mercado aos resultados do 2T26 da HF Sinclair dentro da pesquisa realizada nesta atualização (a cota de buscas web da sessão se esgotou antes de buscas adicionais direcionadas a esses veículos). Como fallback, o Investing.com [Investing.com] noticiou que a HF Sinclair superou as estimativas do 2T26 impulsionada por refino mais forte, com lucro por ação e receita acima do consenso de mercado. A Yahoo Finance/Zacks Investment Research [Yahoo Finance] também reportou que a companhia bateu as estimativas de lucro e receita do consenso Zacks (receita 38,55% acima da estimativa consensual). Nenhuma das fontes localizadas discutiu explicitamente a reação do preço das ações no pregão pós-resultado, nem trouxe reação de analistas sell-side nomeados além da comparação com o consenso agregado. O anúncio simultâneo do plano de cisão do segmento de Lubrificantes & Especialidades foi mencionado como destaque estratégico da divulgação, mas sem análise aprofundada de mercado sobre o valuation implícito da separação nas fontes consultadas. Recomenda-se busca adicional em Bloomberg/Reuters/FT/WSJ em atualização futura, quando a cota de pesquisa da sessão for renovada, para captar reação de mercado mais qualificada, especialmente quanto ao spin-off anunciado."}, "commentary_sources": [{"outlet": "Investing.com", "title": "Earnings call transcript: HF Sinclair tops Q2 2026 estimates on stronger refining", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-hf-sinclair-tops-q2-2026-estimates-on-stronger-refining-93CH-4817085", "captured_at": "2026-08-03T18:00:00Z"}, {"outlet": "Yahoo Finance (Zacks Investment Research)", "title": "HF Sinclair (DINO) Q2 Earnings and Revenues Beat Estimates", "url": "https://finance.yahoo.com/markets/stocks/articles/hf-sinclair-dino-q2-earnings-115502881.html", "captured_at": "2026-08-03T18:00:00Z"}], "note_for_reviewer": "Pesquisa feita majoritariamente via WebSearch; WebFetch esteve indisponível (403 sistêmico) durante toda a sessão, impedindo leitura direta do 8-K/Exhibit 99.1 no SEC EDGAR e do press release completo no BusinessWire — números cruzados entre múltiplas fontes secundárias (Investing.com, Yahoo Finance/Zacks, StockTitan, Alphastreet, MarketScreener) para consistência, mas recomenda-se confirmação direta na fonte primária assim que o acesso for restabelecido. Não localizada cobertura de Bloomberg/Reuters/FT/WSJ especificamente sobre a reação de mercado a este resultado — pode ser lacuna real ou limitação da pesquisa (cota de buscas esgotada antes de tentativas adicionais direcionadas a esses veículos). A tarefa original menciona '10-Q para o período encerrado em 30/06/2026'; não foi possível localizar/confirmar independentemente o número de acesso (accession number) do 10-Q formal nesta sessão — o accession number usado (0001915657-26-000046) refere-se ao 8-K com o press release de resultados (Exhibit 99.1) e ao anúncio do spin-off (Exhibit 99.2), que são fontes primárias válidas segundo as regras do projeto, mas não são o 10-Q em si. Recomenda-se localizar e citar o 10-Q formal em atualização futura. Teleconferência de resultados não pôde ser lida na íntegra pelo mesmo motivo de indisponibilidade de ferramenta.", "generated_by": "scheduled-routine-2026-08-03", "generated_at": "2026-08-03T18:00:00Z", "status": "summarized"}, "pbf-energy": {"company_id": "pbf-energy", "accession_number": "0001534504-26-000029", "company_name": "PBF Energy Inc.", "commodities": ["oil"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26", "sources": [{"filename": "pbf-20260730.htm", "label": "PBF Energy — Formulário 8-K referente aos resultados do 2T26 — SEC EDGAR", "source_url": "https://www.sec.gov/Archives/edgar/data/0001534504/000153450426000029/pbf-20260730.htm", "captured_at": "2026-08-03T18:00:00Z"}, {"filename": "pbf-energy-announces-second-quarter-2026-results-declares-dividend-of-0-275-per-share.aspx", "label": "Comunicado oficial de resultados do 2T26 — site de Relações com Investidores da PBF Energy", "source_url": "https://investors.pbfenergy.com/news/news-details/2026/PBF-Energy-Announces-Second-Quarter-2026-Results-Declares-Dividend-0-275-per-Share/default.aspx", "captured_at": "2026-08-03T18:00:00Z"}, {"filename": "pbf-energy-announces-second-quarter-2026-results-declares-dividend-of-0-275-per-share-302838917.html", "label": "Comunicado oficial de resultados do 2T26 (distribuição PR Newswire)", "source_url": "https://www.prnewswire.com/news-releases/pbf-energy-announces-second-quarter-2026-results-declares-dividend-of-0-275-per-share-302838917.html", "captured_at": "2026-08-03T18:00:00Z"}], "tabs": {"earnings_summary": "Resultados do 2T26 (trimestre encerrado em 30/06/2026), divulgados em 30/07/2026 [PR][8-K]:\n- Resultado operacional (income from operations) de $1.272,1 milhões vs $43,0 milhões no 2T25 [PR][8-K].\n- Excluindo itens especiais, resultado operacional de $1.054,0 milhões no 2T26 vs prejuízo operacional de $110,0 milhões no 2T25 [PR][8-K].\n- Lucro líquido de $915,0 milhões; lucro líquido atribuível à PBF Energy Inc. de $906,4 milhões, ou $7,54 por ação [PR][8-K].\n- Dividendo declarado de $0,275 por ação [PR][8-K].\n- Recebimento de $250 milhões em indenização de seguro relacionada ao incêndio na refinaria de Martinez durante o trimestre, com um pagamento final semelhante esperado no 2S26 [PR][8-K].\n- Guidance de capex para 2026 reduzido em $75 milhões, para ponto médio de $850 milhões, refletindo o adiamento das paradas programadas (turnarounds) de Toledo e Chalmette para 2027 [PR][8-K].\n- Nota: uma fonte agregadora secundária (não o comunicado oficial diretamente lido nesta sessão) menciona lucro por ação ajustado/comparável a consenso de $6,22, superando estimativa de mercado de $4,15 — esse número não foi confirmado diretamente na fonte primária e por isso não recebe tag [PR]/[8-K]; ver detalhamento em commodity_commentary e note_for_reviewer.", "conference_call_summary": "O conteúdo integral da transcrição da teleconferência (disponível via The Motley Fool e Yahoo Finance, conforme localizado na busca) não pôde ser lido diretamente nesta sessão devido à indisponibilidade sistêmica da ferramenta de leitura de páginas web. Com base apenas no título localizado — \"PBF Energy (PBF) Q2 2026 Earnings Call Transcript\" (The Motley Fool) — não é possível resumir com segurança o conteúdo qualitativo da chamada (ex.: status da restauração completa de Martinez, comentários sobre margens de crack spread no 2S26, ou detalhamento do cronograma revisado de paradas em Toledo e Chalmette). Recomenda-se releitura da transcrição completa em atualização futura.", "commodity_commentary": "Não foi confirmada cobertura de Bloomberg, Reuters, FT ou WSJ especificamente sobre a reação de mercado aos resultados do 2T26 da PBF Energy nesta pesquisa (a cota de buscas web da sessão se esgotou antes de tentativas adicionais direcionadas a esses veículos). Como fallback, o StockTitan [StockTitan] noticiou o resultado com a manchete \"PBF Energy Q2 Earnings: $915M Net Income, $0.275 Dividend\", destacando o forte salto de lucro ano contra ano e associando-o à recuperação de seguro de $250 milhões referente ao incêndio de Martinez; a mesma cobertura indicou lucro por ação de $6,22 superando a estimativa de consenso de $4,15, mas esse número de EPS 'ajustado/comparável' não pôde ser reconciliado diretamente com a linguagem do comunicado oficial (que reporta $7,54 por ação em base GAAP) nesta sessão, possivelmente refletindo diferença de metodologia entre EPS GAAP e EPS ajustado usado por agregadores de consenso — tratar com cautela. Não foi localizada análise de reação do preço das ações no pregão pós-resultado nem comentário de analistas sell-side nomeados em fontes de peso editorial. Recomenda-se nova busca direcionada a Bloomberg/Reuters/FT/WSJ em atualização futura para qualificar a reação de mercado e reconciliar as métricas de EPS GAAP vs. ajustado."}, "commentary_sources": [{"outlet": "StockTitan", "title": "PBF Energy Q2 Earnings: $915M Net Income, $0.275 Dividend", "url": "https://www.stocktitan.net/news/PBF/pbf-energy-announces-second-quarter-2026-results-declares-dividend-qw36js8xlo2l.html", "captured_at": "2026-08-03T18:00:00Z"}], "note_for_reviewer": "Pesquisa feita majoritariamente via WebSearch; WebFetch esteve indisponível (403 sistêmico) durante toda a sessão, impedindo leitura direta do 8-K no SEC EDGAR, do press release completo no PR Newswire e do press release no site de RI da PBF Energy — números cruzados entre múltiplas fontes secundárias (StockTitan, Yahoo Finance, Quiver Quantitative) para consistência, mas recomenda-se confirmação direta na fonte primária assim que o acesso à ferramenta for restabelecido. Há uma inconsistência não resolvida entre o EPS GAAP de $7,54 (citado como vindo do comunicado oficial) e o EPS de $6,22 citado por agregador como tendo batido a estimativa de consenso de $4,15 — possivelmente refere-se a bases de cálculo distintas (GAAP vs. ajustado/'excluding special items'), mas isso não pôde ser confirmado lendo o comunicado na íntegra nesta sessão; sinalizado explicitamente aqui em vez de reconciliar por estimativa. Não localizada cobertura de Bloomberg/Reuters/FT/WSJ sobre a reação de mercado a este resultado — pode ser lacuna real ou limitação da pesquisa. Teleconferência de resultados não pôde ser lida na íntegra pelo mesmo motivo de indisponibilidade de ferramenta.", "generated_by": "scheduled-routine-2026-08-03", "generated_at": "2026-08-03T18:00:00Z", "status": "summarized"}, "valterra-platinum": {"company_id": "valterra-platinum", "accession_number": "LSE RNS / JSE SENS — 29/07/2026 (Reuters NewsML ref. RSc2622Oa; número de sequência SENS não confirmado nesta pesquisa devido a bloqueio de acesso)", "company_name": "Valterra Platinum Limited", "commodities": ["platinum"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados Provisórios do 1S26 (seis meses encerrados em 30/06/2026)", "sources": [{"filename": "VP-Interim-Results-Booklet-2026_incl-PPT_FINAL-JH_fixed-1.pdf", "label": "Booklet de Resultados Provisórios 2026 (site de RI da Valterra Platinum)", "source_url": "https://www.valterraplatinum.com/wp-content/uploads/2026/07/VP-Interim-Results-Booklet-2026_incl-PPT_FINAL-JH_fixed-1.pdf", "captured_at": "2026-08-03T18:00:00Z"}, {"filename": "Valterra_Platinum_H1-2026_results_presentation.pdf", "label": "Apresentação de Resultados do 1S26 (site de RI da Valterra Platinum)", "source_url": "https://www.valterraplatinum.com/wp-content/uploads/2026/07/Valterra_Platinum_H1-2026_results_presentation.pdf", "captured_at": "2026-08-03T18:00:00Z"}, {"filename": "interim-results-and-board-committee-change.htm", "label": "RNS/SENS — Interim results and board committee change (republicado via Investegate)", "source_url": "https://www.investegate.co.uk/announcement/rns/valterra-platinum-limited--valt/interim-results-and-board-committee-change/9692600", "captured_at": "2026-08-03T18:00:00Z"}], "tabs": {"earnings_summary": "Resultados provisórios (interim results) da Valterra Platinum Limited para os seis meses encerrados em 30 de junho de 2026, divulgados via SENS (JSE) e RNS (LSE) em 29/07/2026 [SENS]:\n\n- Receita: ZAR 81,8 bilhões, alta de 93% em relação ao mesmo período de 2025 [SENS].\n- EBITDA ajustado: ZAR 33,4 bilhões, alta de 406% YoY [SENS].\n- Lucro por ação (headline earnings per share, HEPS): ZAR 82,02, ante ZAR 4,73 no 1S25 [SENS].\n- Custo total de sustentação (AISC): US$ 996/oz 3E, ante US$ 1.263/oz 3E no período anterior [SENS].\n- Fluxo de caixa livre: ZAR 25,5 bilhões, revertendo fluxo de caixa livre negativo de ZAR 4,6 bilhões no 1S25 [SENS].\n- Dividendos: dividendo base interino de ZAR 32,50/ação (ZAR 8,6 bilhões) mais dividendo adicional de ZAR 24,50/ação (ZAR 6,5 bilhões); total de ZAR 57,00/ação (ZAR 15,1 bilhões), equivalente a payout de 70% do headline earnings [SENS].\n- Segurança: 3 fatalidades registradas no período; TRIFR (Total Recordable Injury Frequency Rate) de 1,66 [SENS].\n- Sustentabilidade: projetos de energia renovável forneceram ~181 GWh no período, com redução estimada de ~195 ktCO2e e economia de custos de eletricidade de ~ZAR 36 milhões [SENS].\n- O anúncio também trouxe uma mudança de comitê do conselho (board committee change); os detalhes específicos dessa mudança não foram confirmados nesta pesquisa (acesso à íntegra do RNS bloqueado) — sinalizado para revisão manual.\n\nNota: os números acima foram extraídos de coberturas/snippets que reproduzem diretamente o conteúdo do SENS/RNS de 29/07/2026; o documento primário completo (booklet e apresentação em valterraplatinum.com) não pôde ser baixado diretamente nesta sessão (bloqueio de acesso via proxy), m <script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const main = document.getElementById('main');
  const railNav = document.getElementById('rail');

  const commodityLabel = { oil: 'Petróleo', copper: 'Cobre', gold: 'Ouro', aluminum: 'Alumínio', platinum: 'Platina', palladium: 'Paládio' };
  const commodityOrder = ['oil', 'aluminum', 'copper', 'gold', 'platinum', 'palladium'];

  const activeCount = data.companies.filter(c => c.status !== 'not_traded').length;
  document.getElementById('stat-total').textContent = data.companies.length;
  document.getElementById('stat-active').textContent = activeCount;
  document.getElementById('stat-new').textContent = data.companies.filter(c => c.status === 'new').length;
  document.getElementById('stat-checked').textContent = new Date(data.checked_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  const groups = {};
  data.companies.forEach(c => { const key = c.commodities[0]; (groups[key] = groups[key] || []).push(c); });

  function statusRank(c) {
    return { new: 0, gap: 1, needs_verification: 2, clear: 3, not_traded: 4 }[c.status] ?? 5;
  }

  let railHtml = '';
  const orderedKeys = commodityOrder.filter(k => groups[k]).concat(Object.keys(groups).filter(k => !commodityOrder.includes(k)));
  orderedKeys.forEach(key => {
    const list = groups[key].slice().sort((a, b) => statusRank(a) - statusRank(b) || a.name.localeCompare(b.name));
    railHtml += `<div class="rail-group" data-group="${key}"><h3><span>${commodityLabel[key] || key}</span><span class="count">${list.length}</span></h3>`;
    list.forEach(c => {
      const notTraded = c.status === 'not_traded' ? ' not-traded' : '';
      railHtml += `<div class="company-row${notTraded}" data-id="${c.id}" data-search="${(c.name + ' ' + (c.ticker||'')).toLowerCase()}">
        <span class="dot ${c.status}"></span>
        <span class="ticker">${c.ticker || ''}</span>
        <span class="name">${c.name}</span>
      </div>`;
    });
    railHtml += `</div>`;
  });
  railNav.innerHTML = railHtml;

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.company-row').forEach(row => {
      row.classList.toggle('hidden', q.length > 0 && !row.dataset.search.includes(q));
    });
    document.querySelectorAll('.rail-group').forEach(g => {
      const anyVisible = Array.from(g.querySelectorAll('.company-row')).some(r => !r.classList.contains('hidden'));
      g.classList.toggle('hidden', q.length > 0 && !anyVisible);
    });
  });

  function renderMd(src) {
    const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const blocks = src.split(/\n\n+/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n');
      if (lines.every(l => l.trim().startsWith('- '))) {
        html += '<ul>' + lines.map(l => `<li>${inline(l.trim().slice(2))}</li>`).join('') + '</ul>';
      } else if (block.trim().startsWith('>')) {
        html += `<div class="quote-block">${inline(block.replace(/^>\s?/, ''))}</div>`;
      } else if (block.trim().startsWith('^')) {
        html += `<div class="translation-note">${inline(block.replace(/^\^\s?/, ''))}</div>`;
      } else {
        html += `<p>${inline(block)}</p>`;
      }
    });
    return html;

    function inline(s) {
      s = escapeHtml(s);
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([A-Z0-9\-, ]+)\]/g, '<span class="cite">[$1]</span>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }
  }

  function renderFiling(company, filing) {
    const sourcesHtml = filing.sources.map((s, i) => `
      <div class="source-item">
        <span class="src-code">${String.fromCharCode(65 + i)}</span>
        <a href="${s.source_url}" target="_blank" rel="noopener">${s.label}</a>
        <span class="captured">${new Date(s.captured_at).toISOString().replace('T',' ').slice(0,16)}Z</span>
      </div>`).join('');

    const commentarySources = filing.commentary_sources || [];
    const commentarySourcesHtml = commentarySources.length
      ? `<div class="sources commentary-sources">
          <div class="label">Matérias de imprensa citadas</div>
          ${commentarySources.map(s => `
          <div class="source-item">
            <span class="src-code">${(s.outlet || '').slice(0,2).toUpperCase()}</span>
            <a href="${s.url}" target="_blank" rel="noopener">${s.title || s.outlet}</a>
            <span class="captured">${s.outlet || ''}</span>
          </div>`).join('')}
        </div>`
      : `<div class="sources commentary-sources"><div class="label">Matérias de imprensa citadas</div><div class="source-item" style="color:var(--text-faint)">Nenhuma URL de matéria confirmada para esta empresa — ver ressalva no texto acima.</div></div>`;

    const tagLine = filing.commodities.map(c => commodityLabel[c] || c).join(' · ');
    const isTradingUpdate = filing.document_type === 'trading_update';
    const badgeLabel = isTradingUpdate ? 'Trading Update' : 'Earnings';
    const warnBanner = isTradingUpdate
      ? `<div class="warn-banner">Isto NÃO é o earnings completo — é uma atualização de guidance pré-resultados. ${filing.document_type_label ? filing.document_type_label.split('—')[1] || '' : ''} Veja a Aba 1 para os detalhes e a data do earnings real.</div>`
      : '';

    return `<div class="main-inner">
      <div class="filing-head">
        <div class="toprow">
          <div class="commodities">${tagLine}</div>
          <span class="doc-badge ${filing.document_type || 'earnings'}">${badgeLabel}</span>
        </div>
        <h1>${filing.company_name}</h1>
        <div class="sub"><span>Accession ${filing.accession_number}</span></div>
        <div class="sources">
          <div class="label">Fontes primárias usadas nesta análise (dados)</div>
          ${sourcesHtml}
        </div>
      </div>
      ${warnBanner}
      <div class="tabs">
        <button class="tab-btn active" data-tab="commodity_commentary">Comentários de Mercado</button>
        <button class="tab-btn" data-tab="earnings_summary">Dados do Earnings</button>
        <button class="tab-btn" data-tab="conference_call_summary">Conference Call</button>
      </div>
      <div class="tabpanel active" data-panel="commodity_commentary">${renderMd(filing.tabs.commodity_commentary)}${commentarySourcesHtml}</div>
      <div class="tabpanel" data-panel="earnings_summary">${renderMd(filing.tabs.earnings_summary)}</div>
      <div class="tabpanel" data-panel="conference_call_summary">${renderMd(filing.tabs.conference_call_summary)}</div>
      <div class="footer-note">Dados sourced de documentos primários (SEC EDGAR, IR, RNS, SENS, HKEX, CVM) · Comentários de mercado sourced de imprensa financeira (Bloomberg, Reuters e afins)</div>
    </div>`;
  }

  function renderEmpty(company) {
    if (company.status === 'gap') {
      return `<div class="empty-state">
        <h2>Detecção automática pendente — ${company.name}</h2>
        <p>Emissor privado estrangeiro — reporta via Form 6-K, sem classificação Item 2.02 no EDGAR. A heurística de descoberta usada para emissores domésticos (8-K Item 2.02) não funciona para este caso. Ver notas da empresa em companies.yaml para o plano de correção.</p>
      </div>`;
    }
    if (company.status === 'needs_verification') {
      return `<div class="empty-state">
        <h2>Dados incompletos — ${company.name}</h2>
        <p>Esta empresa está na base, mas ao menos um campo (ticker, URL de IR ou CIK) ainda não foi verificado ao vivo nesta pesquisa — está marcado como <em>null</em> com uma nota "needs follow-up" em vez de ser inventado. Sem esse dado, o pipeline de descoberta automática não roda com confiança total para esta empresa ainda.</p>
      </div>`;
    }
    if (company.status === 'not_traded') {
      return `<div class="empty-state">
        <h2>${company.name}</h2>
        <p>Entidade privada, estatal ou joint venture sem obrigação de disclosure público — mantida na base apenas como referência. Não faz parte do pipeline de monitoramento ativo de earnings.</p>
      </div>`;
    }
    return `<div class="empty-state">
      <h2>Nenhum earnings novo — ${company.name}</h2>
      <p>Verificado nas últimas 36h via SEC EDGAR. Nada publicado no período — nenhum resumo é gerado até que um earnings real seja divulgado.</p>
    </div>`;
  }

  function selectCompany(id) {
    document.querySelectorAll('.company-row').forEach(r => r.classList.toggle('active', r.dataset.id === id));
    const company = data.companies.find(c => c.id === id);
    const filing = data.filings[id];
    if (filing) {
      main.innerHTML = renderFiling(company, filing);
      wireTabs();
    } else {
      main.innerHTML = renderEmpty(company);
    }
  }

  function wireTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.querySelector(`.tabpanel[data-panel="${btn.dataset.tab}"]`).classList.add('active');
      });
    });
  }

  railNav.addEventListener('click', e => {
    const row = e.target.closest('.company-row');
    if (row) selectCompany(row.dataset.id);
  });

  // land on Freeport-McMoRan by default (has a real earnings summary)
  selectCompany('freeport-mcmoran');
})();
</script>
