<title>Commodity Earnings Monitor</title>
<style>
  :root {
    --bg: #15130f;
    --bg-elevated: #1b1815;
    --bg-inset: #0f0d0a;
    --border: #2b2620;
    --text: #e9e3d7;
    --text-muted: #948c7d;
    --text-faint: #635d51;
    --text-ghost: #4a453b;
    --accent: #c97a44;
    --warn: #b8944a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f2ec; --bg-elevated: #fbfaf6; --bg-inset: #ece9e0;
      --border: #ddd8ca; --text: #24211b; --text-muted: #6d6759; --text-faint: #9a927f; --text-ghost: #bab294;
      --accent: #a9602f; --warn: #8a6a2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15130f; --bg-elevated: #1b1815; --bg-inset: #0f0d0a;
    --border: #2b2620; --text: #e9e3d7; --text-muted: #948c7d; --text-faint: #635d51; --text-ghost: #4a453b;
    --accent: #c97a44; --warn: #b8944a;
  }
  :root[data-theme="light"] {
    --bg: #f4f2ec; --bg-elevated: #fbfaf6; --bg-inset: #ece9e0;
    --border: #ddd8ca; --text: #24211b; --text-muted: #6d6759; --text-faint: #9a927f; --text-ghost: #bab294;
    --accent: #a9602f; --warn: #8a6a2a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--bg); }

  .shell { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: 16px 28px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .topbar .brand { font-family: var(--mono); font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .meta { font-family: var(--mono); font-size: 12px; color: var(--text-faint); display: flex; gap: 18px; flex-wrap: wrap; }
  .topbar .meta strong { color: var(--text-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .topbar .spacer { flex: 1; }
  .topbar .schedule { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }

  .layout { display: flex; flex: 1; min-height: 0; }

  .rail { width: 296px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .rail-search { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .rail-search input {
    width: 100%; background: var(--bg-inset); border: 1px solid var(--border); color: var(--text);
    font-family: var(--sans); font-size: 13px; padding: 7px 10px; border-radius: 5px; outline: none;
  }
  .rail-search input:focus { border-color: var(--accent); }
  .rail-search input::placeholder { color: var(--text-faint); }
  .rail-legend { display: flex; gap: 12px; padding: 8px 16px; font-family: var(--mono); font-size: 10px; color: var(--text-faint); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .rail-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .rail-legend .dot { width: 5px; height: 5px; border-radius: 50%; }

  .rail-scroll { flex: 1; overflow-y: auto; padding: 8px 0 24px; }
  .rail-group h3 {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-faint); margin: 16px 16px 6px; display: flex; justify-content: space-between;
  }
  .rail-group h3 .count { color: var(--text-ghost); }
  .rail-group:first-child h3 { margin-top: 8px; }
  .company-row {
    display: flex; align-items: baseline; gap: 8px; padding: 5px 24px; cursor: pointer;
  }
  .company-row:hover .name { color: var(--text); }
  .company-row.active .name { color: var(--text); }
  .company-row.active .ticker { color: var(--accent); }
  .company-row .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
  .company-row .dot.new { background: var(--accent); }
  .company-row .dot.gap { background: var(--warn); }
  .company-row .dot.needs_verification { background: none; border: 1px solid var(--text-faint); }
  .company-row .dot.clear { background: transparent; }
  .company-row .dot.not_traded { background: transparent; }
  .company-row .ticker { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); min-width: 40px; }
  .company-row .name { font-size: 12.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-row.not-traded { opacity: 0.55; }
  .company-row.not-traded .name { font-size: 12px; }
  .company-row.hidden { display: none; }
  .rail-group.hidden { display: none; }

  .main { flex: 1; min-width: 0; overflow-y: auto; }
  .main-inner { max-width: 720px; margin: 0 auto; padding: 32px 32px 80px; }

  .empty-state { max-width: 560px; margin: 90px auto 0; padding: 0 32px; }
  .empty-state h2 { font-size: 16px; font-weight: 600; margin: 0 0 8px; color: var(--text); }
  .empty-state p { font-size: 13.5px; color: var(--text-muted); margin: 0 0 6px; }
  .empty-state .meta-line { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 14px; }

  .filing-head { margin-bottom: 8px; }
  .filing-head .toprow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .filing-head .commodities {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint);
  }
  .doc-badge {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--text-muted);
  }
  .doc-badge.trading_update { color: var(--warn); border-color: var(--warn); }
  .doc-badge.earnings { color: var(--accent); border-color: var(--accent); }
  .filing-head h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  .filing-head .sub { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
  .filing-head .sub span + span::before { content: " · "; }

  .sources { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
  .sources .label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 8px; }
  .source-item { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; padding: 3px 0; color: var(--text-muted); }
  .source-item .src-code { font-family: var(--mono); font-weight: 600; color: var(--text-faint); min-width: 16px; flex-shrink: 0; }
  .source-item a { color: var(--text-muted); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
  .source-item a:hover { color: var(--text); text-decoration-color: var(--text-faint); }
  .source-item .captured { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin-left: auto; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 26px; margin: 30px 0 0; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; background: none; border: none; cursor: pointer;
    padding: 10px 0; color: var(--text-faint); border-bottom: 1px solid transparent; transform: translateY(1px);
  }
  .tab-btn:hover { color: var(--text-muted); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tabpanel { display: none; padding-top: 26px; }
  .tabpanel.active { display: block; }
  .tabpanel p { margin: 0 0 15px; font-size: 14px; color: var(--text); }
  .tabpanel h4 { font-size: 12.5px; font-weight: 600; margin: 26px 0 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .tabpanel h4:first-child { margin-top: 0; }
  .tabpanel ul { margin: 0 0 15px; padding-left: 18px; }
  .tabpanel li { margin-bottom: 7px; font-size: 14px; }
  .tabpanel strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cite { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  .quote-block { border-left: 2px solid var(--border); padding-left: 16px; margin: 18px 0; color: var(--text-muted); font-size: 13.5px; }
  .translation-note { font-size: 11.5px; color: var(--text-faint); font-style: italic; margin-top: -8px; }
  .warn-banner {
    font-size: 13px; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px;
    padding: 10px 14px; margin-bottom: 20px; background: color-mix(in srgb, var(--warn) 10%, transparent);
  }

  .footer-note { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  a { color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

    <main class="main" id="main"></main>
  </div>
</div>

tes de tratar esta entrada como definitiva, especialmente para: (1) dividendo por ação do 2T26, (2) breakdown de earnings por segmento, (3) produção total em boe/d, (4) qualquer cobertura de imprensa financeira de primeira linha sobre a reação do mercado. commentary_sources ficou vazio propositalmente — nenhuma matéria de imprensa financeira específica sobre a reação a este resultado foi confirmada, apenas reproduções do próprio press release.", "generated_by": "scheduled-routine-2026-08-03", "generated_at": "2026-08-03T18:00:00Z", "status": "summarized"}, "freeport-mcmoran": {"company_id": "freeport-mcmoran", "accession_number": "0000831259-26-000033", "company_name": "Freeport-McMoRan Inc.", "commodities": ["copper", "gold"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26", "sources": [{"filename": "fcx-20260723.htm", "label": "Formulário 8-K com press release e apresentação da teleconferência de resultados do 2T26", "source_url": "https://www.sec.gov/Archives/edgar/data/0000831259/000083125926000033/fcx-20260723.htm", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "Freeport-Reports-Second-Quarter-and-Six-Month-2026-Results", "label": "Press release oficial no site de Relações com Investidores da Freeport-McMoRan", "source_url": "https://investors.fcx.com/investors/news-releases/news-release-details/2026/Freeport-Reports-Second-Quarter-and-Six-Month-2026-Results/default.aspx", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "20260722196120", "label": "Aviso de disponibilização do release de resultados do 2T26 e 1S26 (BusinessWire)", "source_url": "https://www.businesswire.com/news/home/20260722196120/en/Freeport-Second-Quarter-and-Six-Month-2026-Financial-and-Operating-Results-Release-Available-on-Its-Website", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Freeport-McMoRan Inc. (FCX) — Resultados do 2T26 (trimestre encerrado em 30/06/2026)**\n\nDivulgado em 23/07/2026 via Formulário 8-K e press release oficial [PR][8-K].\n\n- **Receita**: US$ 7,03 bilhões no trimestre, acima do consenso citado por agências de dados (US$ 6,71 bilhões), mas ~7% abaixo do 2T25, refletindo taxas operacionais ainda reduzidas em Grasberg (Indonésia) durante parte do período [PR].\n- **Lucro líquido atribuível a acionistas ordinários (GAAP)**: US$ 984 milhões, ou US$ 0,68/ação [PR].\n- **Lucro líquido ajustado**: US$ 1,1 bilhão, ou US$ 0,74/ação ajustado — acima da estimativa de consenso de US$ 0,59/ação [PR].\n- **Grasberg (Indonésia)**: recuperação do Grasberg Block Cave em curso — taxa de processamento subiu de média de 34.000 t/dia em abril para 69.000 t/dia em junho/2026. A companhia projeta que o distrito Grasberg opere a ~65% da capacidade plena no 2S26, 80% em meados de 2027 e capacidade plena até o fim de 2027 [PR].\n- **Guidance 2026 (reafirmado)**: vendas de cobre de 3,1 bilhões de lb, vendas de ouro de 650 mil oz, custo de caixa unitário líquido médio de US$ 1,90/lb de cobre, capex total de ~US$ 4,3 bilhões (incluindo US$ 3,0 bilhões em grandes projetos de mineração) [PR].\n- **Projeto Bagdad (Arizona)**: FCX está próxima de uma decisão de investimento para expandir Bagdad, o que mais que dobraria a produção do site e adicionaria 200–250 milhões lb/ano de cobre; estimativa preliminar de capex subiu ~30% frente à estimativa de 2023 (de US$ 3,5 bi para ~US$ 4,5 bi) [PR].\n\n*Nota: não foi possível extrair diretamente do texto integral do press release (bloqueio de acesso à rede nesta pesquisa) itens como EBITDA consolidado exato e custo de caixa unitário realizado no trimestre (apenas a guidance foi confirmada); ver nota ao revisor.*", "conference_call_summary": "Teleconferência realizada em 23/07/2026, às 10h (horário do leste dos EUA), com analistas de mercado [Earnings Call]. Não foi possível acessar a transcrição oficial completa nesta pesquisa devido a restrições de acesso à rede — o resumo abaixo baseia-se em coberturas agregadas (\"highlights\") da chamada, não na transcrição primária. Segundo essas coberturas, a administração destacou: recuperação mais rápida que o esperado da capacidade de processamento em Grasberg ao longo do trimestre; continuidade de força nas operações dos EUA (Bagdad, Morenci), com iniciativas de lixiviação (leach) mencionadas como parte do plano de elevar a produção doméstica de cobre em ~60% até 2030 (de 1,25 bi lb em 2024 para ~2 bi lb); e sinalização de alta relevante no capex preliminar do projeto de expansão de Bagdad, apontada pela imprensa como o principal fator que pesou sobre a reação do mercado apesar do lucro ajustado acima do consenso [Earnings Call]. Recomenda-se ao revisor conferir a transcrição oficial (via SEC EDGAR ou site de RI) antes de citar qualquer declaração como fala literal da administração.", "commodity_commentary": "Apesar do lucro ajustado de US$ 0,74/ação superar com folga o consenso de US$ 0,59/ação, as ações da Freeport-McMoRan recuaram no pregão de 23/07/2026 — chegaram a subir cerca de 1,4% no pré-mercado, mas fecharam a tarde em queda de aproximadamente 2,2%–3%, a US$ 63,36 [Mining.com][Seeking Alpha]. A queda foi atribuída não ao resultado em si, mas a fatores prospectivos: alta relevante no capex preliminar do projeto de expansão da mina de Bagdad (Arizona), que subiu cerca de 30% frente à estimativa de 2023, e mudanças no ritmo de vendas em Grasberg ligadas a acúmulo de estoque em fundições e vendas de reposição futuras [Mining.com]. A reportagem da Mining.com enquadrou o resultado como a companhia batendo as projeções de lucro \"apesar da fraqueza em Grasberg\", destacando a recuperação operacional do Block Cave (de 34 mil para 69 mil t/dia entre abril e junho) como o principal vetor positivo do trimestre [Mining.com]. A Seeking Alpha registrou que a receita trimestral caiu ~7% ano contra ano por causa das taxas operacionais ainda reduzidas em Grasberg, mesmo com os preços do cobre em alta [Seeking Alpha]. Analistas seguem majoritariamente otimistas completo):\n- Lucro líquido atribuível aos acionistas: US$ 6,7 bilhões (+47% a/a) [PR]\n- Lucro subjacente (underlying earnings): US$ 6,9 bilhões (+43% a/a) [PR]\n- ROCE subjacente: 17% [PR]\n- EBITDA subjacente do grupo: US$ 14,8 bilhões (+28% a/a) [PR]\n- Fluxo de caixa livre: US$ 3,8 bilhões (+75% a/a) [PR]\n- Produção equivalente de cobre: +3% a/a (variação percentual citada no comunicado; tonelagem absoluta não constava no texto recuperado — não estimada) [PR]\n- EBITDA do segmento Cobre: US$ 5,7 bilhões (+84% a/a) [PR]\n- Segmentos Cobre, Alumínio e Lítio responderam em conjunto por mais de 50% do EBITDA subjacente do grupo [PR]\n- Dividendo interino ordinário total: US$ 3,4 bilhões (+43% a/a); payout ratio interino de 50% [PR]\n- Ganhos de produtividade já capturados no período: US$ 870 milhões, com meta de run-rate anualizado de US$ 1,8 bilhão até o fim do ano [PR]", "conference_call_summary": "Há indicação, via cobertura secundária (nota de 'earnings call highlights' replicada no Yahoo Finance, originada no Motley Fool), de que a Rio Tinto realizou teleconferência/webcast de resultados associada à divulgação do 1S26 em torno de 29/07/2026. Não foi possível acessar diretamente a transcrição ou o webcast nesta sessão, portanto não há citações diretas de executivos para reportar aqui — apenas a confirmação de que o evento ocorreu e que a cobertura o descreveu com foco em fluxo de caixa forte e aumento de dividendo. Recomenda-se buscar a transcrição oficial (via riotinto.com ou Quartr) para complementar esta aba.", "commodity_commentary": "A cobertura de imprensa financeira sobre os resultados do 1S26 da Rio Tinto identificada nesta pesquisa também não incluiu, dentro da janela de busca disponível nesta sessão, matéria confirmada da Bloomberg, Reuters, FT ou WSJ especificamente sobre este release — um gap que deveria ser preenchido em rodada futura de verificação. As fontes de fallback encontradas foram o DirectorsTalk Interviews, que descreveu o resultado sob SJ ou pelo nome do CEO atual — por isso omiti deliberadamente qualquer nome de executivo que não pude confirmar nesta sessão, para não arriscar erro (ex.: confusão de sucessão no cargo de CEO). O accession number do 6-K foi extraído da URL retornada pela busca (não fabricado), mas não foi reconfirmado por fetch direto. Recomenda-se nova varredura para: (1) confirmar tonelagem absoluta de produção de cobre; (2) buscar cobertura Bloomberg/Reuters/FT; (3) obter transcrição da call.", "generated_by": "scheduled-routine-2026-08-03", "generated_at": "2026-08-03T18:00:00Z", "status": "summarized"}, "bhp-group": {"company_id": "bhp-group", "accession_number": null, "company_name": "BHP Group Limited", "commodities": ["iron ore", "copper", "coal"], "document_type": "production_report", "document_type_label": "Operational Review FY2026 (ano encerrado em 30/06/2026) — não é resultado financeiro", "sources": [{"filename": "bhp-operational-review-for-the-year-ended-30-june-2026", "label": "Press release da empresa — título original: \"Operational Review for the year ended 30 June 2026\"", "source_url": "https://www.bhp.com/news/media-centre/releases/2026/07/bhp-operational-review-for-the-year-ended-30-june-2026", "captured_at": "2026-07-16T00:00:00Z"}], "tabs": {"earnings_summary": "**Relatório operacional (Operational Review), não financeiro** — divulgado em 16/07/2026. Resultado financeiro/contábil auditado do FY2026 (Annual Results) só sai em 18/08/2026 [PR]. Este relatório traz apenas dados de produção, preços realizados e guidance.\n\n**Minério de Ferro**: produção recorde de ~264,7 Mt atribuível no FY26 (+1% a/a), sustentada por melhor desempenho da cadeia logística na Western Australia Iron Ore (WAIO), que também bateu recorde com 256,9 Mt atribuível (291,2 Mt em base 100%, ante 290 Mt no FY25) [PR]. Preço médio realizado do minério WAIO subiu 3% a/a, para US$ 84,56/wmt [PR]. BHP aprovou US$ 900 milhões para o projeto Ministers North (depósito Brockman de alto teor no Pil l_summary": "Citação direta do CEO Jack Lundin: \"We are pleased to be reporting on another solid quarter of safety, and operational and financial performance.\"\n^Tradução livre: \"Temos o prazer de reportar mais um trimestre sólido de segurança e desempenho operacional e financeiro.\"", "commodity_commentary": "A cobertura mais robusta da imprensa financeira internacional sobre a Lundin Mining no ciclo de resultados mais recente concentrou-se em dois eventos: em 22 de janeiro de 2026, a Bloomberg noticiou que as ações da mineradora 'tombaram' depois que a companhia cortou a projeção de produção de cobre e ouro para 2026, com o papel recuando cerca de 10,8%, para C$ 32,72 [Bloomberg].\n\nJá o resultado do quarto trimestre e do ano cheio de 2025, divulgado em fevereiro e coberto pela BNN Bloomberg, mostrou lucro ajustado triplicado na comparação anual, com EBITDA ajustado subindo 65%, para US$ 700,6 milhões no trimestre, e receita 52% maior, em US$ 1,30 bilhão, beneficiada por preços recordes de cobre e ouro — o cobre foi realizado a US$ 5,89 a libra no período, alta de 41% ante um ano antes [Bloomberg]. No ano cheio, a receita somou recorde de US$ 4,1 bilhões, com a empresa encerrando 2025 em posição de caixa líquido positivo.\n\nPara o resultado do primeiro trimestre de 2026, divulgado em 6 de maio — com EBITDA ajustado de US$ 627 milhões e lucro por ação ajustado de US$ 0,31 —, não foi encontrada cobertura equivalente da imprensa financeira internacional (Bloomberg, Reuters, FT ou WSJ) até o momento desta pesquisa, sugerindo repercussão relativamente menor desse trimestre específico frente aos ciclos de resultados anteriores."}, "generated_by": "claude-research", "generated_at": "2026-07-07T20:25:00Z", "status": "summarized", "note_for_reviewer": "Lundin Mining não é registrante SEC com 6-K localizado nesta pesquisa — accession_number não aplicável.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Lundin Mining Slashes 2026 Guidance for Gold and Copper, ilações exageradas e não representativas por baixa liquidez (ver nota ao revisor). Não consegui acessar o conteúdo integral da transcrição nesta pesquisa (bloqueio de rede nesta sessão); meu resumo dos temas discutidos na call é limitado aos títulos e resumos encontrados via busca, que indicam foco em: cronograma de ramp-up de Odda, perspectivas de retomada plena em Garpenberg, e detalhamento dos impactos pontuais em Tara e Kevitsa.", "commodity_commentary": "A reação da imprensa financeira ao resultado do 2T26 da Boliden foi predominantemente enquadrada como um MISS em relação ao consenso, apesar do forte crescimento do lucro ano contra ano. Segundo despachos atribuídos à Bloomberg (citados por veículos secundários, sem que eu tenha conseguido localizar e confirmar a URL original da Bloomberg dentro do orçamento de busca desta sessão), tanto o lucro quanto a receita do 2T26 vieram abaixo das expectativas dos analistas, com contratempos de produção nas minas de Tara e Garpenberg e problemas de ramp-up na fundição ampliada de Odda pressionando o resultado [Bloomberg via fontes secundárias]. A Investing.com noticiou o resultado sob a manchete \"Boliden falls after Q2 miss as mine, smelter setbacks hit earnings\", reforçando a leitura negativa quanto às expectativas [Investing.com]. O Sweden Herald resumiu com a manchete \"Boliden reports profit jump to SEK 2.8 billion, but results miss expectations\", capturando a dualidade do trimestre: lucro em forte alta ano contra ano, mas abaixo do que o mercado projetava [Sweden Herald]. A Simply Wall St destacou que a receita ficou 10% abaixo do consenso, levando analistas a revisar seus modelos [Simply Wall St]. Não encontrei confirmação confiável e específica da variação percentual das ações da Boliden na bolsa principal (Nasdaq Stockholm: BOL) — evitei citar qualquer número de variação de preço nesta aba por falta de uma fonte primária/confiável verificada (ver nota ao revisor)."}, "generated_by": "scheduled-routine-2026-07- ado via 6-K em 30/07/2026) obtido por busca; não foi possível nesta sessão abrir o texto integral do 6-K para conferência linha a linha (detalhes em note_for_reviewer).", "conference_call_summary": "Não foi possível acessar a transcrição ou o áudio da teleconferência de resultados do 2T26 nesta sessão de pesquisa (falha de conectividade generalizada — ver note_for_reviewer). A Vale historicamente realiza teleconferência com analistas no dia seguinte à divulgação dos resultados, mas não há confirmação independente de comentários específicos da administração sobre o 2T26 disponível nesta atualização. Recomenda-se nova checagem quando o acesso a fontes externas for restabelecido, antes de considerar esta seção completa.", "commodity_commentary": "A cobertura de imprensa financeira sobre o 2T26 da Vale disponível para esta atualização ficou limitada a uma fonte secundária — o portal Investing.com, que noticiou o resultado sob o título \"Vale Q2 2026 slides: record output lifts EBITDA 19% despite cost pressures\" [Investing.com]. A matéria destaca que a companhia reportou EBITDA proforma com alta de 19% ante o 2T25, apoiado por produção recorde em ativos-chave (S11D no minério de ferro, Salobo no cobre e Long Harbour no níquel), mas chama atenção para pressões de custo externas relevantes no trimestre — especialmente câmbio, diesel e frete — que corroeram parte do ganho operacional nas operações de minério de ferro [Investing.com]. Não foi possível, nesta sessão, localizar cobertura específica da Bloomberg, Reuters, Financial Times, WSJ, Valor Econômico ou InfoMoney sobre a reação do mercado (variação do ADR/ação, comentário de analistas de sell-side, revisão de preço-alvo), devido à indisponibilidade das ferramentas de busca/acesso à web durante esta pesquisa (orçamento de WebSearch esgotado e WebFetch bloqueado). Portanto, esta seção NÃO deve ser lida como confirmação de reação de mercado — apenas de que o resultado operacional/financeiro do 2T26 foi divulgado e é consistente com recordes de produção e crescimento de EBITDA relatados pela própria companhia. Recomenda-se busca complementar por cobertura de Bloomberg/Reuters/Valor assim que o acesso à internet for restabelecido, antes de tratar esta seção como definitiva."}, "commentary_sources": [{"outlet": "Investing.com", "title": "Vale Q2 2026 slides: record output lifts EBITDA 19% despite cost pressures", "url": "https://www.investing.com/news/company-news/vale-q2-2026-slides-record-output-lifts-ebitda-19-despite-cost-pressures-93CH-4828908", "captured_at": "2026-08-03T18:00:00Z"}], "note_for_reviewer": "Pesquisa desta atualização foi seriamente limitada por uma falha de infraestrutura durante a sessão: o orçamento de WebSearch (compartilhado entre sub-agentes rodando em paralelo para outras empresas do lote) se esgotou (200/200) logo após a primeira busca sobre a Vale, e a ferramenta WebFetch retornou HTTP 403 para todos os domínios testados nesta sessão — incluindo SEC EDGAR, Investing.com, Wikipedia e até https://example.com — indicando bloqueio de rede/proxy generalizado da sessão, não específico a um site. Como resultado: (1) os números financeiros do 2T26 vêm de um resumo de resultados obtido via busca (não do texto integral do 6-K, que não pôde ser aberto e conferido linha a linha); (2) não foi possível confirmar cobertura de imprensa de primeira linha (Bloomberg/Reuters/FT/WSJ) nem de fallback regional brasileiro (Valor/InfoMoney) — a única fonte de comentário de mercado disponível foi o Investing.com, aceitável como fallback mas que não confirma reação específica de mercado (variação de ação/ADR, revisão de preço-alvo por analistas); (3) o resumo da teleconferência não pôde ser verificado/produzido. Os accession numbers usados (0001292814-26-004008 e 0001292814-26-004006) vêm diretamente das URLs retornadas pela busca real e são consistentes com o CIK real da Vale (917851), mas recomenda-se nova varredura assim que o acesso à internet for restabelecido para confirmar arnings_summary": "**Produção Própria — 1T26 vs 1T25**\n- Cobre: 199,6 mil toneladas, alta de 19% [PR]. Zinco: 176,9 mil toneladas, queda de 17% [PR]. Cobalto: 5,8 mil toneladas, queda de 39% [PR]. Níquel: 17,2 mil toneladas, queda de 9% [PR].\n\n**Vetores da Variação de Cobre**\n- Ganho de 27,4 mil toneladas em ativos de cobre africano, por melhores teores [PR]. Ganho de 13,5 mil toneladas em Antamina [PR]. Perda de 8,9 mil toneladas pela cessação de Mount Isa [PR].\n\n**Cobalto**\n- Queda refletindo cotas de exportação na RDC, priorizando cobre sobre cobalto [PR]. Alocação de cota 2026: 22,8 mil toneladas [PR].\n\n**Guidance 2026 (mantida)**\n- Cobre: 810.000–870.000 toneladas [PR]. Zinco: 700.000–740.000 toneladas [PR].", "conference_call_summary": "Não há teleconferência associada a relatórios trimestrais de produção da Glencore. Citação da administração: \"first quarter production was largely in line with our expectations\", com guidance \"remains unchanged.\"\n^Tradução livre: \"a produção do primeiro trimestre esteve, em grande medida, em linha com nossas expectativas\" ... \"guidance permanece inalterada.\"", "commodity_commentary": "O relatório de produção e trading do primeiro trimestre de 2026 da Glencore, divulgado em 30 de abril de 2026, foi destaque em reportagem da Bloomberg intitulada 'Glencore's Traders Score Big Profits as War Rattles Energy Markets' [Bloomberg]. Segundo a Bloomberg, a mesa de trading da companhia registrou lucros excepcionais à medida que o conflito envolvendo o Irã provocou fortes distorções nos mercados globais de energia, com cargas físicas de petróleo e derivados sendo negociadas com grandes prêmios após o quase fechamento do Estreito de Ormuz [Bloomberg]. A agência informou que o lucro core anual da unidade de marketing deve superar 'confortavelmente' o topo da meta de longo prazo de US$ 3,5 bilhões [Bloomberg]. Quanto à reação do mercado, a Bloomberg registrou que as ações da Glencore subiam 0,8% por volta das 8h30 (horário de Londres) no dia da notícia, mesmo com os mercados acionários globais em geral em queda devido ao risco de escalada do conflito no Irã [Bloomberg]. Esse resultado veio poucos meses depois de a Bloomberg noticiar, em fevereiro de 2026, que o lucro anual consolidado de 2025 havia caído cerca de 6%, para US$ 13,5 bilhões, com o rali recorde do cobre insuficiente para compensar a fraqueza da divisão de carvão [Bloomberg]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T20:50:00Z", "status": "summarized", "note_for_reviewer": "Relatório de produção apenas — sem demonstrativo financeiro. Glencore não é registrante SEC. Resultados financeiros do 1S26 ainda não publicados na data da pesquisa. Platina/paládio são subprodutos não detalhados individualmente neste relatório.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Glencore's Traders Score Big Profits as War Rattles Energy Markets", "url": "https://www.bloomberg.com/news/articles/2026-04-30/glencore-s-traders-score-big-profits-as-war-roils-energy-markets", "captured_at": "2026-07-07T00:00:00Z"}, {"outlet": "Bloomberg", "title": "Glencore Profit Falls as Coal Earnings Drop Outweighs Copper Price Surge", "url": "https://www.bloomberg.com/news/articles/2026-02-18/glencore-profit-slides-as-copper-rally-offset-by-coal-slump", "captured_at": "2026-07-07T00:00:00Z"}]}, "agnico-eagle-mines": {"company_id": "agnico-eagle-mines", "accession_number": "0001104659-26-080204", "document_type": "operational_update", "document_type_label": "Atualização Operacional e Revisão de Guidance — Movimento de Rocha no Barnat Pit (Canadian Malartic), NÃO é o earnings completo do 2º Trimestre 2026", "sources": [{"filename": "tm2619674d1_ex99-1.htm", "label": "Formulário 6-K (Anexo 99.1) — comunicado sobre movimento de rocha no Barnat Pit, Canadian Malartic", "source_url": "https://www.sec.gov/Archives/edgar/data/0000002809/000110465926080204/tm2619674d1_ex99-1.htm", "captured_at": "2026-07-08T01:40:00Z"}], "tabs": {"earnings_summary": "Em comunicado de 2 de julho de 2026 (6-K), a Agnico Eagle informou que, em 1º de julho, ocorreu movimento de massa rochosa na parede norte da cava Barnat, no complexo Canadian Malartic (Quebec) [PR]. Sem feridos, danos a equipamentos ou impacto ambiental. Mineração na cava suspensa temporariamente por precaução [PR].\n\n**Impacto**: redução esperada de 60.000-80.000 onças de ouro na produção do complexo no 2S26 [PR]. Produção anual consolidada de 2026 deve ficar próxima do piso do guidance de 3,3-3,5 milhões de onças [PR]. Possível redução adicional de até ~150.000 onças/ano em 2027 e 2028 [PR]. Empresa reafirmou que o evento não deve afetar o desenvolvimento da mina Odyssey [PR].\n\nAtualizações adicionais de guidance serão dadas com os resultados do 2T26, em 29/07/2026. Este é um comunicado operacional/de guidance — NÃO é o resultado financeiro do 2T26.", "conference_call_summary": "Sem teleconferência dedicada a este comunicado específico — publicado fora do ciclo normal de resultados como fato relevante de segurança geotécnica. Detalhamento de custo/produção previsto para a call de resultados do 2T26, em 30/07/2026.", "commodity_commentary": "Segundo a BNN Bloomberg (agência The Canadian Press, 02/07/2026), a Agnico Eagle suspendeu temporariamente a mineração na cava Barnat após o movimento de rocha [Bloomberg]. A reportagem confirma os números divulgados pela empresa — redução de 60.000-80.000 onças no 2S26 e produção anual tendendo ao piso da faixa — sem comentário independente de analistas [Bloomberg]. Um dia antes do evento, em 06/07, a Jefferies havia elevado a recomendação da Agnico Eagle para \"Buy\" (preço-alvo C$ 200, de C$ 187), citando volatilidade recente como ponto de entrada — upgrade anterior ao incidente, não incorpora seu impacto [Bloomberg]. O episódio ocorre em meio a preços do ouro em patamares recordes, o que tende a suavizar o impacto financeiro da perda de produção, mas reforça o risco geotécnico como tema recorrente no setor aurífero canadense."}, "commentary_sources": [{"outlet": "BNN Bloomberg", "title": "Agnico Eagle suspends mining operations at Barnat pit after rock movement", "url": "https://www.bnnbloomberg.ca/business/company-news/2026/07/02/agnico-eagle-suspends-mining-operations-at-barnat-pit-after-rock-movement/", "captured_at": "2026-07-08T01:50:00Z"}], "generated_by": "claude-research", "generated_at": "2026-07-08T00:00:00Z", "note_for_reviewer": "Complementa a entrada de earnings do 1T26 (segue válida). Evento de 1-2/07/2026 levou a revisão de guidance de produção para 2S26/2026/2027-28 — mais recente e relevante que o release de Q1. Fonte primária: 6-K SEC (accession 0001104659-26-080204). Revisar após resultados do 2T26 em 29/07/2026."}, "anglogold-ashanti": {"company_id": "anglogold-ashanti", "accession_number": "0001973832-26-000091", "company_name": "AngloGold Ashanti plc", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "agaq1march2026operatingsta.htm", "label": "Demonstrativo operacional e financeiro trimestral — \"AngloGold Ashanti Q1 31 March 2026 Earnings Release and Dividend Declaration\" (Anexo ao Formulário 6-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/1973832/000197383226000091/agaq1march2026operatingsta.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — AngloGold Ashanti plc**\n\n**Produção**\n- Produção total de ouro: 724 mil oz (+1% a/a) [PR]\n\n**Resultado financeiro**\n- Receita de ouro: US$ 3.154 milhões (1T2025: US$ 1.927 milhões) [PR]\n- EBITDA: US$ 2.291 milhões (+130% a/a) [PR]\n- Lucro atribuível: US$ 1.281 milhões (1T2025: US$ 443 milhões) [PR]\n\n**Custos**\n- Preço médio de ouro realizado: US$ 4.863/oz (+69% a/a) [PR]\n- AISC (grupo): US$ 1.955/oz (+19% a/a) [PR]\n\n**Caixa e balanço**\n- Fluxo de caixa livre: US$ 1.169 milhões — recorde trimestral (+190% a/a) [PR]\n- Posição de caixa líquido de US$ 868 milhões, revertendo dívida líquida de US$ 755 milhões no 1T2025 [PR]\n\n**Dividendos**\n- Dividendo trimestral recorde de US$ 585 milhões (116 centavos/ação) [PR]\n- Programa de recompra proposto de até US$ 2,0 bilhões [PR]\n\n**Projeto Arthur (Nevada)**\n- Reserva provável de 4,9 Moz; VPL após impostos de US$ 3,41–3,46 bilhões a US$ 3.500/oz; TIR de 22–26% [PR]", "conference_call_summary": "Não localizada transcrição primária. Citação do CEO Alberto Calderón: \"Our focus remains to control what we can control—managing underlying costs and ensuring safe, predictable operating results.\"\n^Tradução livre: \"Nosso foco continua sendo controlar o que está ao nosso alcance — administrar custos subjacentes e garantir resultados operacionais seguros e previsíveis.\"", "commodity_commentary": "A cobertura mais robusta da imprensa financeira internacional sobre a AngloGold Ashanti no ciclo recente veio da Bloomberg, em reportagem de 20 de fevereiro de 2026 intitulada 'AngloGold Profit Jumps 160% as Gold Rally Drives Record Dividend', referente aos resultados do ano fiscal de 2025 [Bloomberg]. Segundo a Bloomberg, o lucro saltou 160% em 2025, com o rali recorde do ouro impulsionando a produção e levando a companhia a distribuir o maior pagamento de sua história, totalizando US$ 1,8 bilhão no ano [Bloomberg]. Para o primeiro trimestre de 2026 — divulgado em 8 de maio de 2026 —, a pesquisa não localizou reportagem dedicada de nenhuma das quatro fontes prioritárias. Segundo dados divulgados pela própria companhia, a AngloGold registrou fluxo de caixa livre recorde de cerca de US$ 1,2 bilhão no trimestre — quase o triplo do mesmo período de 2025 —, dividendo trimestral recorde de 116 centavos de dólar por ação e aprovação de um programa de recompra de até US$ 2 bilhões. Esses números coincidiram com valorização das ações a máximas históricas em Joanesburgo e Nova York, segundo dados de mercado — embora sem confirmação de imprensa de primeira linha para esse trimestre específico."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Nova holding no Reino Unido (CIK SEC 0001973832).", "commentary_sources": [{"outlet": "Bloomberg", "title": "AngloGold Profit Jumps 160% as Gold Rally Drives Record Dividend", "url": "https://www.bloomberg.com/news/articles/2026-02-20/anglogold-posts-profit-surge-and-record-dividend-on-price-rally", "captured_at": "2026-07-07T00:00:00Z"}]}, "kinross-gold": {"company_id": "kinross-gold", "accession_number": "0001171843-26-002835", "company_name": "Kinross Gold Corporation", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "exh_991.htm", "label": "Press release da empresa — título original: \"Kinross reports strong 2026 first-quarter results\" (Anexo 99.1 ao Formulário 6-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/701818/000117184326002835/exh_991.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — Kinross Gold Corporation**\n\n**Resultado financeiro**\n- Receita de vendas de metais: US$ 2.407,7 milhões (+61% a/a) [PR]\n- Lucro líquido: US$ 843,0 milhões (US$ 0,70/ação), ante US$ 368,0 milhões no 1T2025 [PR]\n\n**Fluxo de caixa**\n- Fluxo de caixa livre atribuível: US$ 837,5 milhões — recorde pelo 4º trimestre consecutivo [PR]\n- Caixa em 31/3/2026: US$ 2.185,0 milhões; liquidez total ~US$ 3,9 bilhões [PR]\n\n**Produção**\n- Total atribuível: 492.563 oz (1T2025: 512.088 oz; -4% planejado) [PR]\n- Principais ativos: Tasiast 130.014 oz; Paracatu 160.583 oz (recorde de recuperação); Fort Knox 93.994 oz [PR]\n\n**Custos**\n- Preço médio realizado: US$ 4.873/oz (1T2025: US$ 2.857/oz) [PR]\n- AISC atribuível: US$ 1.732/oz (1T2025: US$ 1.355/oz) [PR]\n- Margem por onça: US$ 3.476, alta de 92% a/a [PR]\n\n**Guidance 2026**\n- Produção: 2,0 Moz eq.-ouro (±5%) [PR]. AISC: US$ 1.730/oz (±5%) [PR]\n\n**Projetos**\n- Great Bear (Canadá): construção de superfície ~90% concluída [PR]. Lobo-Marte (Chile): EIA submetido em abril/2026 [PR]", "conference_call_summary": "Não localizada transcrição verbatim primária. Citação do CEO J. Paul Rollinson: \"We generated record free cash flow of approximately $840 million, representing our fourth consecutive quarterly record.\"\n^Tradução livre: \"Geramos um fluxo de caixa livre recorde de aproximadamente US$ 840 milhões, nosso quarto recorde trimestral consecutivo.\"", "commodity_commentary": "Apesar de pesquisa extensa em Bloomberg, Reuters, Financial Times e Wall Street Journal, não foi possível confirmar uma reportagem dedicada dessas fontes analisando especificamente a reação do mercado aos resultados do primeiro trimestre de 2026 da Kinross Gold, divulgados em 29-30 de abril de 2026. Segundo dados amplamente replicados por agregadores financeiros, a Kinross registrou fluxo de caixa livre atribuível recorde de aproximadamente US$ 838 milhões no trimestre — o quarto trimestre consecutivo de recorde —, com margens de US$ 3.476 por onça equivalente de ouro (+92% a/a). O lucro líquido ajustado somou US$ 854,1 milhões (US$ 0,71/ação), superando ligeiramente a expectativa média de US$ 0,68. Dados de negociação amplamente reportados indicam que as ações chegaram a subir entre 5% e 7% no pregão seguinte, refletindo otimismo com a geração de caixa recorde. Como essas informações não puderam ser confirmadas em reportagens específicas das quatro fontes prioritárias, esta nota as registra com a ressalva de que provêm de agregadores financeiros especializados."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Dados extraídos via Anexo 99.1 do Formulário 6-K na SEC EDGAR.", "commentary_sources": []}, "b2gold": {"company_id": "b2gold", "accession_number": "0001171843-26-003084", "company_name": "B2Gold Corp.", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "B2Gold-Reports-Q1-2026-Results", "label": "Press release da empresa — título original: \"B2Gold Reports Q1 2026 Results\" (Anexo 99.1 ao Formulário 6-K)", "source_url": "https://www.b2gold.com/news-media/news-releases/news-details/2026/B2Gold-Reports-Q1-2026-Results/default.aspx", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — B2Gold Corp.**\n\n**Resultado financeiro**\n- Receita de ouro: US$ 1.158,7 milhões (+118% a/a) [PR]\n- Lucro líquido: US$ 205,6 milhões (US$ 0,15/ação) [PR]\n- Preço médio realizado: US$ 4.193/oz (1T2025: US$ 2.892/oz) [PR]\n\n**Fluxo de caixa**\n- Fluxo de caixa livre: US$ 361,8 milhões, ante -US$ 6,9 milhões no 1T2025 [PR]\n\n**Produção**\n- Total consolidado: 237.763 oz [PR]. Fekola Complex 117.450 oz; Goose Mine (início de produção comercial no trimestre) 42.876 oz [PR]\n\n**Custos**\n- AISC consolidado: US$ 1.964/oz (guidance 2026: US$ 2.400–2.580/oz) [PR]\n\n**Retorno de capital**\n- Recompra de US$ 80 milhões no 1T; dividendo do 2T de US$ 0,02/ação [PR]\n\n**Transações**\n- Venda de 70% da Fingold Ventures para a Agnico Eagle por US$ 325 milhões, concluída em 23/4/2026 [PR]\n\n**Incidente pós-trimestre**\n- Incêndio em 16/4/2026 no circuito de britagem da Goose Mine; produção do 2T2026 revisada para baixo [PR]", "conference_call_summary": "Não localizada transcrição verbatim primária. Release descreve \"very positive first quarter of 2026 operating and financial results.\"\n^Tradução livre: \"resultados operacionais e financeiros muito positivos no primeiro trimestre de 2026\"", "commodity_commentary": "Apesar de pesquisa extensa em Bloomberg, Reuters, Financial Times e Wall Street Journal, não foi localizada uma reportagem dedicada dessas fontes analisando especificamente a reação do mercado aos resultados do primeiro trimestre de 2026 da B2Gold, divulgados em 6 de maio de 2026. Segundo dados amplamente replicados por agregadores financeiros, a B2Gold reportou receita de ouro de US$ 1,16 bilhão, mais que o dobro do mesmo período de 2025, e lucro líquido de US$ 199,9 milhões (US$ 0,19/ação ajustado) — resultado que superou a expectativa média dos analistas de US$ 0,11 por ação em cerca de 73%. A produção de ouro somou 237.763 onças, com todas as operações superando as metas orçadas. Dados de negociação amplamente reportados indicam que as ações subiram cerca de 11% no pregão de 7 de maio de 2026, com ganho adicional de cerca de 8,5% em meados de junho. Ainda assim, em 3 de junho, o analista Josh Wolfson, do RBC Capital, reiterou recomendação neutra ('hold'), com preço-alvo de US$ 5,75. Como essas informações não puderam ser confirmadas em reportagens específicas das quatro fontes prioritárias, esta nota as registra com a ressalva de que provêm de agregadores financeiros."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Nenhuma.", "commentary_sources": []}, "gold-fields": {"company_id": "gold-fields", "accession_number": "0001628280-26-031621", "company_name": "Gold Fields Limited", "commodities": ["gold"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral", "sources": [{"filename": "goldfields-q12026_operat.htm", "label": "Atualização operacional trimestral (JSE SENS / Anexo ao Formulário 6-K) — Q1 2026 Operating Update", "source_url": "https://www.sec.gov/Archives/edgar/data/1172724/000162828026031621/goldfields-q12026_operat.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Atualização operacional do 1T2026 — Gold Fields Limited**\n\n**Produção**\n- Produção total atribuível: 633 mil oz, +15% a/a e -7% t/t [PR]\n- Destaques: Salares Norte 173 mil oz (+245% a/a); Granny Smith 78 mil oz (+25% a/a) [PR]\n\n**Custos**\n- AISC: US$ 1.829/oz (+13% a/a, +9% t/t) [PR]\n- CEO sinalizou pressão de custos (diesel +30–70%, frete +40%) [PR]\n\n**Balanço**\n- Dívida líquida: US$ 1.304 milhões, -34% a/a [PR]. Dívida líquida/EBITDA ajustado: 0,19x [PR]\n\n**Guidance 2026 (mantido)**\n- Produção: 2,40–2,60 Moz [PR]. AISC: US$ 1.800–2.000/oz [PR]\n\n**Projetos**\n- Windfall (Canadá): acordo preliminar com comunidades Cree [PR]. Damang devolvida ao governo de Gana em 18/4/2026 [PR]", "conference_call_summary": "Nenhuma transcrição verbatim primária localizada. Citação do CEO: \"Gold Fields delivered a solid start to 2026, building on positive safety, operational and financial delivery of 2025.\"\n^Tradução livre: \"A Gold Fields teve um início sólido em 2026, consolidando os avanços positivos de segurança, operação e resultado financeiro obtidos em 2025.\"", "commodity_commentary": "A Bloomberg noticiou que o lucro da Gold Fields referente ao exercício de 2025 (divulgado em fevereiro de 2026) praticamente triplicou, impulsionado pela alta recorde do ouro: a mineradora sul-africana projetou lucro por ação entre US$ 3,87 e US$ 4,11, alta de 178% a 196% ante o ano anterior, refletindo preços do metal significativamente mais altos e maiores volumes vendidos [Bloomberg]. A produção anual atingiu 2,4 milhões de onças, 18% acima de 2024, com destaque para a rampa de produção da mina Salares Norte, no Chile [Bloomberg]. O ouro subiu quase 65% ao longo de 2025, em meio à turbulência geopolítica que impulsionou a demanda por ativos de proteção, contexto citado pela Bloomberg como pano de fundo do resultado [Bloomberg].\n\nA Reuters noticiou que a Gold Fields elevou o dividendo e chegou a cogitar recompra de ações à medida que a alta dos preços do ouro impulsionou o lucro, destacando o apetite da administração por devolver caixa aos acionistas após o salto de rentabilidade [Reuters]. Segundo a Reuters, o lucro triplicou na comparação anual, reforçando a leitura do mercado de que 2025 foi um ano recorde para a mineradora [Reuters].\n\nJá a atualização operacional do primeiro trimestre de 2026, divulgada em abril, mostrou produção trimestral de 633 mil onças (alta de 15% na comparação anual, mas queda de 7% ante o trimestre anterior), com custo total (AISC) subindo para US$ 1.829/oz em meio a pressões inflacionárias e câmbio mais forte nos países produtores; a dívida líquida recuou 34% na base anual, para US$ 1.304 milhões [Bloomberg]. A cobertura da imprensa financeira internacional concentrou-se, no entanto, nos resultados anuais de fevereiro, que foram o evento de maior repercussão para investidores no período mais recente."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Atualização operacional/de produção (padrão JSE), não demonstrativo financeiro completo com DRE.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Gold Fields Says Profit Almost Tripled on Bullion Price Rally", "url": "https://www.bloomberg.com/news/articles/2026-02-06/gold-fields-says-profit-almost-tripled-on-bullion-price-rally", "captured_at": "2026-07-08T00:00:00Z"}, {"outlet": "Reuters", "title": "Gold Fields boosts shareholder returns after profit more than doubles", "url": "https://www.cnbcafrica.com/2026/gold-fields-boosts-shareholder-returns-after-profit-more-than-doubles", "captured_at": "2026-07-08T00:00:00Z"}]}, "lundin-gold": {"company_id": "lundin-gold", "accession_number": null, "company_name": "Lundin Gold Inc.", "commodities": ["gold"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral (Q2 2026)", "sources": [{"filename": "lundin-gold-q2-2026-production-release.html", "label": "Press release da empresa — título original: \"Lundin Gold Reports Q2 2026 Production of 118,994 Ounces of Gold\"", "source_url": "https://lundingold.com/news/lundin-gold-reports-q2-2026-production-of-118-994-122852/", "captured_at": "2026-07-08T00:00:00Z"}], "tabs": {"earnings_summary": "**Produção** — A Fruta del Norte (sudeste do Equador) produziu 118.994 oz de ouro no Q2 2026, sendo 79.208 oz na forma de concentrado e 39.786 oz na forma de doré [PR]. Na comparação anual, o Q2 2025 havia registrado 139.433 oz — a empresa atribui a queda ao fato de o Q2 2026 ser, conforme planejado, o trimestre mais fraco do ano no cronograma de mina [PR].\n\n**Operacional** — O moinho processou 500.143 t de minério no trimestre, com throughput médio de 5.496 t/dia, teor médio de 8,3 g/t e recuperação de 89,1% [PR]. Vendas de ouro no período somaram 110.385 oz a preço médio realizado de US$ 4.359/oz [PR].\n\n**Guidance** — A companhia reafirmou o guidance de produção para 2026 em 475.000–525.000 oz [PR].\n\n**Importante**: este release cobre SOMENTE dados de produção — AISC (all-in sustaining cost) e posição de caixa não constam deste comunicado. Os resultados financeiros completos do Q2 2026 serão divulgados após o fechamento de mercado em 06/08/2026, com conference call em 07/08/2026 às 8h PT / 11h ET / 17h CET [PR].", "conference_call_summary": "Não houve conference call vinculado a este release de produção. Citação do CEO Jamie Beck no comunicado: \"Second quarter production of 118,994 ounces of gold, in what was planned to be the weakest quarter of the year, emphasizes the strength of our operations.\" [PR] O call de resultados financeiros completos do Q2 2026 está agendado para 07/08/2026.", "commodity_commentary": "Não foi localizada cobertura dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre este production update (padrão comum para releases operacionais intermediários de mineradoras mid-cap fora de temporada de resultados). Como fallback, a **TipRanks** publicou a matéria \"Lundin Gold Q2 Output Holds Firm as Fruta del Norte Drives Guidance\", enquadrando a queda de produção anual como esperada (manutenção planejada) e destacando que o guidance reafirmado reforça a leitura de confiabilidade operacional da mina [TipRanks]. O **Simply Wall St** publicou análise com o título \"Does Lundin Gold's (TSX:LUG) Reaffirmed 2026 Output Target Reinforce Its Operational Reliability Story?\", no mesmo sentido — usando a manutenção do guidance apesar do trimestre mais fraco como evidência de execução consistente em Fruta del Norte [Simply Wall St]. Nenhuma das duas fontes reporta reação de preço de ação específica ao release; nenhuma cifra adicional além das já constantes no PR foi identificada nesses textos."}, "generated_by": "claude-research", "generated_at": "2026-07-20T00:00:00Z", "status": "summarized", "note_for_reviewer": "Release cobre apenas dados de produção; AISC e caixa NÃO estão disponíveis até a divulgação financeira completa de 06/08/2026 (call em 07/08) — recomenda-se nova atualização após essa data. Não encontrei cobertura da Bloomberg/Reuters/FT; usei TipRanks e Simply Wall St como fallback. Queda YoY de produção (139.433 oz → 118.994 oz) é real e vem do próprio PR — atribuída a sazonalidade planejada de mina, não a problema operacional. Fetch direto a lundingold.com retornou bloqueio de rede neste ambiente; dados cross-checados contra múltiplas réplicas do mesmo press release.", "commentary_sources": [{"outlet": "TipRanks", "title": "Lundin Gold Q2 Output Holds Firm as Fruta del Norte Drives Guidance", "url": "https://www.tipranks.com/news/company-announcements/lundin-gold-q2-output-holds-firm-as-fruta-del-norte-drives-guidance", "captured_at": "2026-07-20T00:00:00Z"}, {"outlet": "Simply Wall St", "title": "Does Lundin Gold's (TSX:LUG) Reaffirmed 2026 Output Target Reinforce Its Operational Reliability Story?", "url": "https://simplywall.st/stocks/ca/materials/tsx-lug/lundin-gold-shares/news/does-lundin-golds-tsxlug-reaffirmed-2026-output-target-reinf", "captured_at": "2026-07-20T00:00:00Z"}]}, "harmony-gold-mining": {"company_id": "harmony-gold-mining", "accession_number": "0001628280-26-046150", "document_type": "trading_update", "document_type_label": "Atualização Pré-Fechamento do Ano Fiscal (Pre-Close Update) — Ano Fiscal 2026 completo (encerrado em 30/06/2026), NÃO é o resultado financeiro auditado completo", "sourc C, o ouro fechou o 2º trimestre de 2026 em recuo — à vista caindo ~0,8% para perto de US$ 3.975/oz —, descrito como o pior trimestre para o metal desde o 2T13 [CNBC]. Uma atualização operacional sólida mas dentro do esperado, sem surpresas de volume ou custo, não gerou reação forte no papel.\n\nVale notar que a ação da Harmony já havia reagido negativamente em março/2026, quando o mercado reagiu mal a um guidance de cobre mais fraco divulgado junto aos resultados do 1S FY26 (queda de até 7% em um pregão) — episódio anterior e distinto desta atualização de 30/06."}, "commentary_sources": [{"outlet": "Seeking Alpha", "title": "Harmony Gold says production guidance met for 11th straight year", "url": "https://seekingalpha.com/news/4608539-harmony-gold-says-production-guidance-met-for-11th-straight-year", "captured_at": "2026-07-08T00:00:00Z"}, {"outlet": "CNBC", "title": "Stock market news for July 1, 2026", "url": "https://www.cnbc.com/2026/06/30/stock-market-today-live-updates.html", "captured_at": "2026-07-08T00:00:00Z"}], "generated_by": "claude-research", "generated_at": "2026-07-08T00:00:00Z", "note_for_reviewer": "Entrada anterior cobria só os 9 meses até 31/03/2026 (Q3 FY26). Novo 6-K primário (30/06/2026) traz atualização pré-fechamento do ANO FISCAL COMPLETO. Números preliminares/não auditados — DRE completa só em 27/08/2026, quando deve ser reprocessada de novo."}, "greatland-resources": {"company_id": "greatland-resources", "accession_number": null, "company_name": "Greatland Resources Limited", "commodities": ["gold", "copper"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral", "sources": [{"filename": "june-2026-quarter-production-update", "label": "RNS via Investegate — \"June 2026 Quarter Production Update\" (AIM/LSE: GGP, ASX: GGP)", "source_url": "https://www.investegate.co.uk/announcement/rns/greatland-gold--ggp/june-2026-quarter-production-update-/9652942", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Atualização de produção — encerramento do ano fiscal FY26 (publicado em 06/07/2026) — Greatland Resources (Telfer/Havieron)**\n\n- Produção do trimestre (abr–jun/2026): 79.099 oz de ouro; 3.573 toneladas de cobre [PR]\n- Produção do ano fiscal FY26: 328.986 oz de ouro (6% acima do topo do guidance de 260.000–310.000 oz); 14.594 toneladas de cobre [PR]\n- Caixa em 30/6/2026: US$ 1.289 milhões, zero dívida [PR]\n- Empresa mantém plena exposição à alta do ouro, com proteção parcial via opções de venda [PR]\n- AISC ainda não divulgado — virá no relatório trimestral completo, esperado ainda em julho/2026 [PR]", "conference_call_summary": "Não aplicável — comunicado de produção preliminar (RNS), sem teleconferência associada. Webcast previsto quando o relatório completo sair.", "commodity_commentary": "A Reuters noticiou que as ações da Greatland Resources atingiram máxima histórica após a mineradora australiana divulgar produção trimestral robusta de ouro referente ao trimestre encerrado em março de 2026, evidenciando reação positiva do mercado ao desempenho operacional da empresa dona do complexo Telfer-Havieron, na Austrália Ocidental [Reuters]. A produção do trimestre somou 82.723 onças de ouro e 4.128 toneladas de cobre, com custo total de sustentação (AISC) de US$ 2.056/oz, e a empresa reportou geração recorde de caixa de A$ 260 milhões no período, elevando o caixa total, livre de dívidas, para cerca de A$ 1,2 bilhão [Reuters].\n\nAntes disso, em fevereiro de 2026, a Reuters já havia noticiado que a Greatland registrou lucro líquido semestral de A$ 342,9 milhões, o primeiro relatório financeiro completo da companhia após a aquisição dos ativos de Telfer e Havieron, consolidando sua entrada no radar dos investidores de ouro australianos [Reuters].\n\nA reação do mercado — com o papel batendo recorde — reforça a leitura de que o rali do ouro, combinado à expansão da base de reservas (aumento de 62% no minério recuperável em Telfer anunciado no mesmo período), tem sustentado o apetite de investidores pela ação [Reuters]. Cabe registrar que a reportagem da Reuters sobre esse episódio específico está atrás de paywall, de modo que detalhes mais granulares da magnitude da alta intradiária não puderam ser integralmente verificados nesta pesquisa, ainda que a manchete confirme o novo patamar recorde atingido pelo papel."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "IMPORTANTE: comunicado de produção PRELIMINAR — AISC e relatório trimestral completo ainda por vir em julho/2026. Reprocessar quando disponível. Antiga Greatland Gold, renomeada após aquisição de Telfer/Havieron da Newmont em 2025.", "commentary_sources": [{"outlet": "Reuters", "title": "Australia's Greatland Resources hits record high on strong quarterly gold output", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L4N3Y8011:0-australia-s-greatland-resources-hits-record-high-on-strong-quarterly-gold-output/", "captured_at": "2026-07-08T00:00:00Z"}]}, "endeavour-mining": {"company_id": "endeavour-mining", "accession_number": null, "company_name": "Endeavour Mining plc", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "endeavour-reports-strong-q1-2026-results", "label": "Press release da empresa — título original: \"Endeavour Reports Strong Q1-2026 Results\" (LSE: EDV / TSX: EDV)", "source_url": "https://www.endeavourmining.com/news-and-media/news/endeavour-reports-strong-q1-2026-results/", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — Endeavour Mining plc**\n\n- Receita: US$ 1.349 milhões [PR]. Lucro líquido: US$ 354 milhões (+421% t/t) [PR]\n- EBITDA ajustado: US$ 880 milhões — recorde trimestral (+29% t/t) [PR]\n- Fluxo de caixa livre: US$ 613 milhões — recorde [PR]\n- Posição de caixa líquido: US$ 405 milhões (vs. dívida líquida cífica da Bloomberg, Reuters, FT ou WSJ detalhando a variação exata das ações no pregão seguinte à divulgação do primeiro trimestre de 2026, a cobertura da Reuters sobre o exercício de 2025 já havia estabelecido a narrativa de que a alta do ouro estava elevando substancialmente a geração de caixa da empresa, tese que os números trimestrais subsequentes reforçaram [Reuters]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "LSE/TSX, não é registrante SEC.", "commentary_sources": [{"outlet": "Reuters", "title": "Endeavour Mining's 2025 cash flow rises on high gold prices", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L1N3ZT0BF:0-endeavour-mining-s-2025-cash-flow-rises-on-high-gold-prices/", "captured_at": "2026-07-08T00:00:00Z"}]}, "polyus-pjsc": {"company_id": "polyus-pjsc", "accession_number": null, "company_name": "PJSC Polyus", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Resultados Operacionais e Financeiros (2S/Ano Completo)", "sources": [{"filename": "proizvodstvennye-i-finansovye-rezultaty-za-2-polugodie-2025-i-2025-god", "label": "Press release da empresa — \"Operating and financial results for the second half of 2025 and full year 2025\" (polyus.com, MOEX: PLZL)", "source_url": "https://polyus.com/en/media/press-releases/proizvodstvennye-i-finansovye-rezultaty-za-2-polugodie-2025-i-2025-god/", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 2S e ano completo de 2025 — PJSC Polyus**\n\n- Produção total de ouro em 2025: 2.528,8 mil oz, -16% a/a, dentro do guidance de 2,5–2,6 Moz [PR]\n- Receita de 2025: US$ 8.723 milhões, +19% a/a, por maior preço médio de venda [PR]\n- EBITDA ajustado de 2025: US$ 6.347 milhões, +12% a/a [PR]\n- Custo caixa total (TCC): US$ 739/oz, +93% a/a [PR]\n- Capex de 2025: recorde de US$ 2.180 milhões, +73% a/a [PR]\n- Dívida Líquida/EBITDA Ajustado: 1,1x [PR]\n- Projeto Sukhoi Log: investimento estimado de US$ 6 bilhões, operação plena esperada para 2029 [PR]", "conference_call_summary": "Não localizada transcrição verbatim entre as fontes acessíveis.", "commodity_commentary": "A cobertura da imprensa financeira ocidental sobre a Polyus é significativamente mais limitada do que a de mineradoras de ouro comparáveis, reflexo direto das sanções impostas pelos Estados Unidos, Reino Unido e União Europeia à companhia e a outros grandes produtores russos desde 2022-2023, que incluíram banimento às importações de ouro russo e o deslistamento dos certificados de depósito da Polyus da Bolsa de Londres em 2023 [Reuters]. Ainda assim, a Reuters cobriu os resultados financeiros da Polyus referentes ao exercício de 2025 (divulgados em março de 2026): o EBITDA ajustado subiu 12% na comparação anual, para US$ 6,35 bilhões, enquanto o lucro líquido ajustado recuou 3%, para US$ 3,3 bilhões, mesmo com a produção de ouro caindo 16%, para 2,5 milhões de onças, em corte planejado [Reuters]. A receita cresceu 19%, para US$ 8,7 bilhões, impulsionada pelo preço médio realizado do ouro refinado, que mais que compensou o menor volume vendido [Reuters].\n\nA reportagem da Reuters também mencionou que as sanções praticamente dobraram o custo estimado de desenvolvimento do projeto Sukhoi Log, na Sibéria, de US$ 3,3 bilhões para cerca de US$ 6 bilhões, e que a companhia projeta produção estável entre 2,5 e 2,6 milhões de onças em 2026, com o projeto entrando em plena operação apenas em 2029 [Reuters].\n\nPor honestidade, não foram localizadas nas fontes solicitadas (Bloomberg, Reuters, FT, WSJ) análises de bancos de investimento ocidentais, variações de preço em bolsas internacionais ou comentários de analistas sell-side associados a este resultado — o que é esperado, já que a ação da Polyus negocia apenas na bolsa de Moscou e está fora do radar da maior parte da cobertura de analistas ocidentais desde as sanções."}, "generated_by": "claude-research", "generated : US$ 778 milhões (US$ 269 milhões recompras + US$ 509 milhões dividendos) [PR]\n- Dividendo declarado: US$ 1,27/ação, alta de 7% [10-Q][PR]", "conference_call_summary": "Nenhuma transcrição localizada na SEC nem no site de RI. Citação do CEO Mark Lashier no press release: \"We are confident in our ability to navigate market volatility given our integrated business and strong balance sheet.\"\n^Tradução livre: \"Estamos confiantes em nossa capacidade de navegar pela volatilidade de mercado, graças ao nosso negócio integrado e à solidez do nosso balanço patrimonial.\"", "commodity_commentary": "A Reuters — cujo conteúdo circulou também via BNN Bloomberg — noticiou que a Phillips 66 registrou lucro surpresa no primeiro trimestre de 2026, revertendo as expectativas do mercado: o lucro ajustado por ação veio em US$ 0,49, muito acima da previsão de Wall Street, que projetava prejuízo ajustado de US$ 0,40 por ação [Reuters]. O lucro líquido total somou US$ 207 milhões (US$ 0,51 por ação diluída), sustentado pela forte recuperação das margens de refino: a margem realizada subiu para US$ 10,11 por barril, ante US$ 6,81 no mesmo trimestre do ano anterior, com o resultado ajustado antes de impostos do segmento de refino saltando para US$ 208 milhões, revertendo um prejuízo de US$ 937 milhões um ano antes [Reuters].\n\nSegundo a reportagem, a utilização da capacidade de refino subiu para 95%, ante 80% no mesmo período de 2025, beneficiada por margens de refino ao longo da Costa do Golfo dos EUA entre as mais favoráveis dos últimos anos — as margens de referência nos EUA subiram cerca de 73% na comparação anual no trimestre [Reuters]. As ações da Phillips 66 subiram 1,7% no pré-mercado logo após a divulgação dos resultados, refletindo a reação inicial positiva dos investidores à reversão de lucro [Reuters].\n\nA companhia também elevou o dividendo trimestral anualizado em 7% e encerrou o trimestre com liquidez de aproximadamente US$ 6,0 bilhões, dados que, segundo a cobertura, icado em uma nova varredura com acesso restabelecido às ferramentas de busca/fetch.", "commodity_commentary": "A ExxonMobil reportou lucro líquido de US$ 14,5 bilhões (US$ 3,48/ação) e lucro ajustado de US$ 14,7 bilhões (US$ 3,52/ação) no 2T26, resultado que a cobertura da Investing.com classificou como \"forte\" (\"strong Q2 2026 results\") [Investing.com]. Apesar dessa caracterização operacional positiva, a mesma matéria destaca no próprio título que as ações da companhia recuaram no período em torno da divulgação (\"shares slip\") [Investing.com], sugerindo que o mercado reagiu a algum ponto específico do resultado ou da teleconferência que não pôde ser confirmado em detalhe nesta rodada, já que o corpo completo da matéria e a transcrição da call não puderam ser acessados (falha de fetch generalizada nesta sessão). Não foi possível localizar ou confirmar cobertura específica da Bloomberg, Reuters, FT ou WSJ sobre a reação de mercado a este resultado nesta sessão de pesquisa. A informação aqui apresentada deve ser tratada como preliminar quanto à reação de mercado — recomenda-se nova checagem, com foco em confirmar por que as ações recuaram e em obter cobertura de imprensa financeira de primeira linha sobre o evento."}, "commentary_sources": [{"outlet": "Investing.com", "title": "Earnings call transcript: ExxonMobil posts strong Q2 2026 results as shares slip", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-exxonmobil-posts-strong-q2-2026-results-as-shares-slip-93CH-4828782", "captured_at": "2026-08-03T18:00:00Z"}], "note_for_reviewer": "Limitações desta rodada: (1) a ferramenta de fetch de páginas retornou erro de acesso para praticamente toda URL testada nesta sessão, o que impediu leitura direta do 8-K, do press release completo e da transcrição da call; os números acima vêm de resumos de busca (WebSearch) que reproduzem o conteúdo do release oficial, não foram estimados nem arredondados. (2) O orçamento de buscas web da sessão se e h32 [PR].\n\n**Resultado consolidado:**\n- Receita total: US$ 3.966 milhões (~US$ 4,0 bilhões), alta de 24% sequencial ante o 1T26 — ligeiramente abaixo do consenso de mercado (~US$ 3,99 bilhões) [PR].\n- Lucro líquido atribuível (GAAP): US$ 407 milhões, segundo agregadores que citam o release — não confirmado diretamente no documento primário (ver nota do revisor) [PR].\n- Lucro líquido ajustado: US$ 562 milhões (US$ 2,12/ação ajustado), alta de 51% sequencial — abaixo do consenso de EPS ajustado de US$ 2,32 (miss de ~9%) [PR].\n- EBITDA ajustado excluindo itens especiais: US$ 901 milhões, alta de 51% sequencial (+US$ 306 milhões ante os US$ 595 milhões do 1T26) [PR].\n- Caixa ao final do trimestre: US$ 1,4 bilhão. Fluxo de caixa operacional: US$ 608 milhões. Fluxo de caixa livre: US$ 422 milhões [PR].\n\n**Segmento Alumina:**\n- Produção: 2,2 milhões de toneladas, queda de 6% sequencial, por instabilidade na refinaria de Pinjarra (Austrália Ocidental), agravada por interrupção no fornecimento de gás associada ao Ciclone Narelle [PR].\n- EBITDA ajustado do segmento: -US$ 96 milhões (negativo) [PR].\n\n**Segmento Aluminum:**\n- Produção: 636 mil toneladas, alta de 5% sequencial, refletindo a conclusão do restart do smelter de San Ciprián (Espanha) em 07/04/2026, avanço do restart de Alumar (Brasil) e conclusão dos restarts de Lista (Noruega) e Portland (Austrália) [PR].\n- Embarques: 726 mil toneladas, alta de 113 mil toneladas sequencial [PR].\n- EBITDA ajustado do segmento: recorde de US$ 1,1 bilhão, margem de 32,3% [PR].\n\n**Guidance 2026 (revisado para baixo na Alumina)**\n- Alumina: produção cortada para 9,5–9,6 Mt (de 9,7–9,9 Mt anteriormente), por causa dos problemas em Pinjarra [PR].\n- Aluminum: guidance detalhado para o 2S26 não confirmado nas fontes consultadas (ver nota do revisor).\n\n**Aquisição da South32 (acordo definitivo assinado em 30/06/2026, anunciada junto com o resultado do 2T26)**\n- Alcoa vai adquirir os ativos de bauxita/alumina/alumínio da South32: mina de bauxita de Boddington e refinaria de alumina de Worsley (Austrália Ocidental); smelter de alumínio de Hillside e a propriedade do smelter hoje parado de Bayside (África do Sul); mina de bauxita MRN e a refinaria de alumina/smelter de alumínio de Alumar (Brasil) — fica de fora o smelter de Mozal, em Moçambique [PR].\n- Contraprestação inicial de ~US$ 4,1 bilhões: US$ 3,1 bilhões em caixa + ~17,0 milhões de ações ordinárias da Alcoa (~US$ 1,0 bilhão), mais dívida líquida assumida de ~US$ 0,6 bilhão e um CVR (contingent value right) de até US$ 750 milhões ao longo de 4 anos, atrelado a preços futuros de alumínio/alumina [PR].\n- Financiamento: bridge loan de US$ 3,1 bilhões do Goldman Sachs, a ser substituído por caixa do balanço e dívida permanente antes do fechamento [PR].\n- Fechamento esperado no 1S27, sujeito à aprovação dos acionistas da South32 e a aprovações regulatórias [PR].", "conference_call_summary": "Citação do CEO William F. Oplinger no press release: \"During the second quarter, in addition to delivering strong financial results that captured favorable aluminum prices, our team executed on strategic initiatives, most notably the announced agreement with South32.\"\n^Tradução livre: \"Durante o segundo trimestre, além de entregar resultados financeiros sólidos que capturaram preços favoráveis de alumínio, nossa equipe executou iniciativas estratégicas, principalmente o acordo anunciado com a South32.\"\n\nTambém no release: \"We continue to demonstrate operational excellence and positive momentum in our disciplined approach to maximize value creation.\"\n^Tradução livre: \"Continuamos demonstrando excelência operacional e momentum positivo em nossa abordagem disciplinada para maximizar a criação de valor.\"\n\nNão foi possível acessar a transcrição completa e verbatim da teleconferência de resultados (bloqueio de acesso às páginas primárias — ver nota do revisor); as citações acima vêm do texto do press release oficial, não da call em si.", "commodity_commentary": "Apesar da receita recorde e do anúncio simultâneo da aquisição de ativos da South32, a reação de mercado ao 2T26 da Alcoa foi negativa: as ações caíram 3,56% no pregão regular, para US$ 46,85, e recuaram ainda mais no after-hours (estimativas entre 2,4% e 4,2% adicionais, para a faixa de US$ 45,73), à medida que investidores digeriram o EPS ajustado de US$ 2,12 — abaixo do consenso de US$ 2,32 (miss de ~9%) — e o corte na guidance de produção de alumina [Investing.com][Benzinga].\n\nO miss foi atribuído majoritariamente aos problemas na refinaria de Pinjarra, agravados pelo Ciclone Narelle, que levaram ao corte da guidance de produção de alumina para 2026 [Investing.com]. Em contraste, o segmento de alumínio entregou EBITDA ajustado recorde de US$ 1,1 bilhão (margem de 32,3%), beneficiado pela conclusão de restarts de capacidade em San Ciprián, Lista e Portland [Investing.com].\n\nO evento do trimestre mais comentado na imprensa, porém, foi o acordo definitivo assinado em 30/06/2026 para a Alcoa adquirir os ativos de bauxita/alumina/alumínio da South32 por consideração inicial de ~US$ 4,1 bilhões (~US$ 3,1 bi em caixa + ~US$ 1,0 bi em ações), avaliado pela Bloomberg em até US$ 5,6 bilhões somando CVR e dívida assumida, descrito como uma aposta da Alcoa em um boom prolongado do mercado de alumínio [Bloomberg].\n\nNão foi localizada cobertura dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre a reação ao print do 2T26 em si (16/07) — a análise da reação do papel ao resultado veio de Investing.com e Benzinga; a citação da Bloomberg refere-se à cobertura do anúncio da aquisição da South32 em 30/06/2026, evento relacionado mas cronologicamente anterior (e por isso tratado aqui como contexto, não como cobertura do earnings)."}, "generated_by": "claude-research", "generated_at": "2026-07-20T00:00:00Z", "status": "summarized", "note_for_reviewer": "Todas as tentativas de acessar diretamente o press release primário (news.alcoa.com
