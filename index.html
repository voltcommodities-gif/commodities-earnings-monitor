<title>Commodity Earnings Monitor</title>
<style>
  :root {
    --bg: #15130f;
    --bg-elevated: #1b1815;
    --bg-inset: #0f0d0a;
    --border: #2b2620;
    --text: #e9e3d7;
    --text-muted: #948c7d;
    --text-faint: #635d51;
    --text-ghost: #4a453b;
    --accent: #c97a44;
    --warn: #b8944a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f2ec; --bg-elevated: #fbfaf6; --bg-inset: #ece9e0;
      --border: #ddd8ca; --text: #24211b; --text-muted: #6d6759; --text-faint: #9a927f; --text-ghost: #bab294;
      --accent: #a9602f; --warn: #8a6a2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15130f; --bg-elevated: #1b1815; --bg-inset: #0f0d0a;
    --border: #2b2620; --text: #e9e3d7; --text-muted: #948c7d; --text-faint: #635d51; --text-ghost: #4a453b;
    --accent: #c97a44; --warn: #b8944a;
  }
  :root[data-theme="light"] {
    --bg: #f4f2ec; --bg-elevated: #fbfaf6; --bg-inset: #ece9e0;
    --border: #ddd8ca; --text: #24211b; --text-muted: #6d6759; --text-faint: #9a927f; --text-ghost: #bab294;
    --accent: #a9602f; --warn: #8a6a2a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--bg); }

  .shell { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: 16px 28px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .topbar .brand { font-family: var(--mono); font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .meta { font-family: var(--mono); font-size: 12px; color: var(--text-faint); display: flex; gap: 18px; flex-wrap: wrap; }
  .topbar .meta strong { color: var(--text-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .topbar .spacer { flex: 1; }
  .topbar .schedule { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }

  .layout { display: flex; flex: 1; min-height: 0; }

  .rail { width: 296px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .rail-search { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .rail-search input {
    width: 100%; background: var(--bg-inset); border: 1px solid var(--border); color: var(--text);
    font-family: var(--sans); font-size: 13px; padding: 7px 10px; border-radius: 5px; outline: none;
  }
  .rail-search input:focus { border-color: var(--accent); }
  .rail-search input::placeholder { color: var(--text-faint); }
  .rail-legend { display: flex; gap: 12px; padding: 8px 16px; font-family: var(--mono); font-size: 10px; color: var(--text-faint); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .rail-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .rail-legend .dot { width: 5px; height: 5px; border-radius: 50%; }

  .rail-scroll { flex: 1; overflow-y: auto; padding: 8px 0 24px; }
  .rail-group h3 {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-faint); margin: 16px 16px 6px; display: flex; justify-content: space-between;
  }
  .rail-group h3 .count { color: var(--text-ghost); }
  .rail-group:first-child h3 { margin-top: 8px; }
  .company-row {
    display: flex; align-items: baseline; gap: 8px; padding: 5px 24px; cursor: pointer;
  }
  .company-row:hover .name { color: var(--text); }
  .company-row.active .name { color: var(--text); }
  .company-row.active .ticker { color: var(--accent); }
  .company-row .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
  .company-row .dot.new { background: var(--accent); }
  .company-row .dot.gap { background: var(--warn); }
  .company-row .dot.needs_verification { background: none; border: 1px solid var(--text-faint); }
  .company-row .dot.clear { background: transparent; }
  .company-row .dot.not_traded { background: transparent; }
  .company-row .ticker { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); min-width: 40px; }
  .company-row .name { font-size: 12.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-row.not-traded { opacity: 0.55; }
  .company-row.not-traded .name { font-size: 12px; }
  .company-row.hidden { display: none; }
  .rail-group.hidden { display: none; }

  .main { flex: 1; min-width: 0; overflow-y: auto; }
  .main-inner { max-width: 720px; margin: 0 auto; padding: 32px 32px 80px; }

  .empty-state { max-width: 560px; margin: 90px auto 0; padding: 0 32px; }
  .empty-state h2 { font-size: 16px; font-weight: 600; margin: 0 0 8px; color: var(--text); }
  .empty-state p { font-size: 13.5px; color: var(--text-muted); margin: 0 0 6px; }
  .empty-state .meta-line { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 14px; }

  .filing-head { margin-bottom: 8px; }
  .filing-head .toprow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .filing-head .commodities {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint);
  }
  .doc-badge {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--text-muted);
  }
  .doc-badge.trading_update { color: var(--warn); border-color: var(--warn); }
  .doc-badge.earnings { color: var(--accent); border-color: var(--accent); }
  .filing-head h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  .filing-head .sub { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
  .filing-head .sub span + span::before { content: " · "; }

  .sources { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
  .sources .label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 8px; }
  .source-item { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; padding: 3px 0; color: var(--text-muted); }
  .source-item .src-code { font-family: var(--mono); font-weight: 600; color: var(--text-faint); min-width: 16px; flex-shrink: 0; }
  .source-item a { color: var(--text-muted); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
  .source-item a:hover { color: var(--text); text-decoration-color: var(--text-faint); }
  .source-item .captured { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin-left: auto; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 26px; margin: 30px 0 0; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; background: none; border: none; cursor: pointer;
    padding: 10px 0; color: var(--text-faint); border-bottom: 1px solid transparent; transform: translateY(1px);
  }
  .tab-btn:hover { color: var(--text-muted); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tabpanel { display: none; padding-top: 26px; }
  .tabpanel.active { display: block; }
  .tabpanel p { margin: 0 0 15px; font-size: 14px; color: var(--text); }
  .tabpanel h4 { font-size: 12.5px; font-weight: 600; margin: 26px 0 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .tabpanel h4:first-child { margin-top: 0; }
  .tabpanel ul { margin: 0 0 15px; padding-left: 18px; }
  .tabpanel li { margin-bottom: 7px; font-size: 14px; }
  .tabpanel strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cite { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  .quote-block { border-left: 2px solid var(--border); padding-left: 16px; margin: 18px 0; color: var(--text-muted); font-size: 13.5px; }
  .translation-note { font-size: 11.5px; color: var(--text-faint); font-style: italic; margin-top: -8px; }
  .warn-banner {
    font-size: 13px; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px;
    padding: 10px 14px; margin-bottom: 20px; background: color-mix(in srgb, var(--warn) 10%, transparent);
  }

  .footer-note { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  a { color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

  </div>
</div>

tado esperado em linha com o 1T26 [PR]\n\n**Chemicals and Products**\n- Margem indicativa de refino: ~US$ 20/bbl [PR]\n- Margem indicativa de química: ~US$ 240/tonelada [PR]\n- Utilização de refino: ~100% [PR]\n\n**Renewables and Energy Solutions**\n- Lucro ajustado: faixa de US$ (0,3) a US$ 0,3 bilhão [PR]\n\n**Fluxo de Caixa do Grupo**\n- Capital de giro: US$ 1 a 6 bilhões (ante saída de US$ 11,2 bilhões no 1T26), refletindo volatilidade de preços de commodities [PR]\n- Imposto pago: US$ 2,6-3,4 bilhões [PR]\n\n**Resultados completos do 2T26: agendados para 30 de julho de 2026** [PR].", "conference_call_summary": "Não há teleconferência associada a este trading update — a Shell normalmente não realiza call para atualizações de guidance pré-resultados, apenas para os resultados trimestrais completos, agendados para 30/07/2026 [PR].", "commodity_commentary": "A Reuters (Londres, 7 de julho, repórter Stephanie Kelly) noticiou que a Shell elevou a guidance de produção de gás integrado e sinalizou resultado de trading \"significativamente mais alto\" no segundo trimestre de 2026, à medida que a volatilidade dos mercados de energia — provocada pela guerra no Irã — beneficiou as operações de trading da companhia [Reuters]. A produção de Integrated Gas foi revisada para 610-650 mil boe/d, ante a faixa anterior de 580-640 mil boe/d, e os volumes de liquefação de GNL foram elevados para 7,4-7,8 milhões de toneladas (de 6,8-7,4 milhões) [Reuters].\n\nSegundo a Reuters, as ações da Shell subiram 3,2% na abertura do pregão em 7 de julho, com o setor de energia europeu avançando 0,3% no mesmo dia [Reuters]. O Citi elevou sua projeção de lucro por ação do segundo trimestre para a Shell em 13%, citando a atualização \"incrementalmente positiva\" da companhia [Reuters]. A Bloomberg, em newsletter do mesmo dia intitulada \"Oil Major Shell Cashes In On Volatile Energy Markets\", descreveu a Shell como beneficiária direta da turbulência nos mercados de energia [Bloomberg].\n\nO comunicado também revelou que a Shell fechou acordo para vender seu negócio de downstream na África do Sul (580 postos de combustível, atacado de combustível, aviação e lubrificantes) para a ADNOC Distribution, dos Emirados Árabes, por valor de empresa implícito de US$ 1 bilhão, com a ADNOC mantendo a marca Shell sob licenciamento de longo prazo [Reuters]. Segundo a Reuters, cerca de 20% da produção da Shell (550 mil boe/d) origina-se do Oriente Médio, e a planta Pearl GTL, no Catar, segue fora de operação desde os ataques de março, com reparo estimado em cerca de um ano [Reuters]. Os resultados financeiros completos do 2T26 estão agendados para 30 de julho de 2026."}, "generated_by": "claude-research", "generated_at": "2026-07-08T00:00:00Z", "status": "summarized", "note_for_reviewer": "Atualizado em 08/07/2026 a pedido do usuário, que notou que a matéria anterior (sobre o 1T26) estava desatualizada. Este é o trading update do 2T26 publicado em 07/07/2026 — ainda NÃO é o earnings completo (agendado para 30/07/2026). Deve ser reprocessado como 'earnings' completo assim que os resultados de 30/07 saírem.", "commentary_sources": [{"outlet": "Reuters", "title": "Shell raises guidance slightly for Q2 integrated gas production", "url": "https://www.globalbankingandfinance.com/shell-raises-guidance-slightly-q2-integrated-gas-production/", "captured_at": "2026-07-07T00:00:00Z"}, {"outlet": "Bloomberg", "title": "Oil Major Shell Cashes In On Volatile Energy Markets", "url": "https://www.bloomberg.com/news/newsletters/2026-07-07/oil-major-shell-cashes-in-on-volatile-energy-markets", "captured_at": "2026-07-07T00:00:00Z"}]}, "freeport-mcmoran": {"company_id": "freeport-mcmoran", "accession_number": "0000831259-26-000033", "company_name": "Freeport-McMoRan Inc.", "commodities": ["copper", "gold"], "document_type": "earnings", "document_type_label": "Earnings Completo — Resultados do 2T26", "sources": [{"filename": "fcx-20260723.htm", "label": "Formulário 8-K com press release e apresentação da teleconferência de resultados do 2T26", "source_url": "https://www.sec.gov/Archives/edgar/data/0000831259/000083125926000033/fcx-20260723.htm", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "Freeport-Reports-Second-Quarter-and-Six-Month-2026-Results", "label": "Press release oficial no site de Relações com Investidores da Freeport-McMoRan", "source_url": "https://investors.fcx.com/investors/news-releases/news-release-details/2026/Freeport-Reports-Second-Quarter-and-Six-Month-2026-Results/default.aspx", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "20260722196120", "label": "Aviso de disponibilização do release de resultados do 2T26 e 1S26 (BusinessWire)", "source_url": "https://www.businesswire.com/news/home/20260722196120/en/Freeport-Second-Quarter-and-Six-Month-2026-Financial-and-Operating-Results-Release-Available-on-Its-Website", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Freeport-McMoRan Inc. (FCX) — Resultados do 2T26 (trimestre encerrado em 30/06/2026)**\n\nDivulgado em 23/07/2026 via Formulário 8-K e press release oficial [PR][8-K].\n\n- **Receita**: US$ 7,03 bilhões no trimestre, acima do consenso citado por agências de dados (US$ 6,71 bilhões), mas ~7% abaixo do 2T25, refletindo taxas operacionais ainda reduzidas em Grasberg (Indonésia) durante parte do período [PR].\n- **Lucro líquido atribuível a acionistas ordinários (GAAP)**: US$ 984 milhões, ou US$ 0,68/ação [PR].\n- **Lucro líquido ajustado**: US$ 1,1 bilhão, ou US$ 0,74/ação ajustado — acima da estimativa de consenso de US$ 0,59/ação [PR].\n- **Grasberg (Indonésia)**: recuperação do Grasberg Block Cave em curso — taxa de processamento subiu de média de 34.000 t/dia em abril para 69.000 t/dia em junho/2026. A companhia projeta que o distrito Grasberg opere a ~65% da capacidade plena no 2S26, 80% em meados de 2027 e capacidade plena até o fim de 2027 [PR].\n- **Guidance 2026 (reafirmado)**: vendas de cobre de 3,1 bilhões de lb, vendas de ouro de 650 mil oz, custo de caixa unitário líquido médio de US$ 1,90/lb de cobre, capex total de ~US$ 4,3 bilhões (incluindo US$ 3,0 bilhões em grandes projetos de mineração) [PR].\n- **Projeto Bagdad (Arizona)**: FCX está próxima de uma decisão de investimento para expandir Bagdad, o que mais que dobraria a produção do site e adicionaria 200–250 milhões lb/ano de cobre; estimativa preliminar de capex subiu ~30% frente à estimativa de 2023 (de US$ 3,5 bi para ~US$ 4,5 bi) [PR].\n\n*Nota: não foi possível extrair diretamente do texto integral do press release (bloqueio de acesso à rede nesta pesquisa) itens como EBITDA consolidado exato e custo de caixa unitário realizado no trimestre (apenas a guidance foi confirmada); ver nota ao revisor.*", "conference_call_summary": "Teleconferência realizada em 23/07/2026, às 10h (horário do leste dos EUA), com analistas de mercado [Earnings Call]. Não foi possível acessar a transcrição oficial completa nesta pesquisa devido a restrições de acesso à rede — o resumo abaixo baseia-se em coberturas agregadas (\"highlights\") da chamada, não na transcrição primária. Segundo essas coberturas, a administração destacou: recuperação mais rápida que o esperado da capacidade de processamento em Grasberg ao longo do trimestre; continuidade de força nas operações dos EUA (Bagdad, Morenci), com iniciativas de lixiviação (leach) mencionadas como parte do plano de elevar a produção doméstica de cobre em ~60% até 2030 (de 1,25 bi lb em 2024 para ~2 bi lb); e sinalização de alta relevante no capex preliminar do projeto de expansão de Bagdad, apontada pela imprensa como o principal fator que pesou sobre a reação do mercado apesar do lucro ajustado acima do consenso [Earnings Call]. Recomenda-se ao revisor conferir a transcrição oficial (via SEC EDGAR ou site de RI) antes de citar qualquer declaração como fala literal da administração.", "commodity_commentary": "Apesar do lucro ajustado de US$ 0,74/ação superar com folga o consenso de US$ 0,59/ação, as ações da Freeport-McMoRan recuaram no pregão de 23/07/2026 — chegaram a subir cerca de 1,4% no pré-mercado, mas fecharam a tarde em queda de aproximadamente 2,2%–3%, a US$ 63,36 [Mining.com][Seeking Alpha]. A queda foi atribuída não ao resultado em si, mas a fatores prospectivos: alta relevante no capex preliminar do projeto de expansão da mina de Bagdad (Arizona), que subiu cerca de 30% frente à estimativa de 2023, e mudanças no ritmo de vendas em Grasberg ligadas a acúmulo de estoque em fundições e vendas de reposição futuras [Mining.com]. A reportagem da Mining.com enquadrou o resultado como a companhia batendo as projeções de lucro \"apesar da fraqueza em Grasberg\", destacando a recuperação operacional do Block Cave (de 34 mil para 69 mil t/dia entre abril e junho) como o principal vetor positivo do trimestre [Mining.com]. A Seeking Alpha registrou que a receita trimestral caiu ~7% ano contra ano por causa das taxas operacionais ainda reduzidas em Grasberg, mesmo com os preços do cobre em alta [Seeking Alpha]. Analistas seguem majoritariamente otimistas com o papel: 21 das 26 casas que cobrem a ação mantêm recomendação de compra ou compra forte, com preço-alvo mediano de US$ 74 (~14% de upside frente ao fechamento anterior ao resultado) [Benzinga]. Não foi localizada, dentro do escopo desta pesquisa, uma matéria específica da Bloomberg ou Reuters sobre a reação de mercado a este resultado — recomenda-se ao revisor buscar diretamente essas fontes antes de publicar."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "Devido a restrição de rede nesta sessão de pesquisa (política de egress da sessão bloqueou WebFetch/curl para todos os domínios externos, confirmado até em google.com), não foi possível abrir diretamente os documentos primários (SEC EDGAR, businesswire.com, investors.fcx.com) — todos retornaram HTTP 403. Os dados financeiros acima foram reconstruídos a partir de trechos e resumos desses mesmos documentos primários indexados por mecanismo de busca, cruzados entre múltiplas fontes secundárias que concordam entre si (Mining.com, Seeking Alpha, Benzinga, Investing.com, GuruFocus). Ainda assim, o revisor deve confirmar os números diretamente no 8-K/press release antes de uso definitivo, especialmente EBITDA e custo unitário de caixa realizado (não confirmados, apenas guidance). Não foi encontrada cobertura específica da Bloomberg ou Reuters sobre a reação de mercado a este resultado dentro do orçamento de busca disponível — vale nova tentativa antes de publicar.", "commentary_sources": [{"outlet": "Mining.com", "title": "Freeport beats profit forecasts despite Grasberg slump", "url": "https://www.mining.com/freeport-tops-profit-forecasts-despite-grasberg-slump", "captured_at": "2026-07-27T18:00:00Z"}, {"outlet": "Seeking Alpha", "title": "Freeport-McMoRan slips as lower Grasberg operating rates weigh on Q2 revenue", "url": "https://seekingalpha.com/news/4617714-freeport-mcmoran-slips-as-lower-grasberg-operating-rates-weigh-on-q2-revenue", "captured_at": "2026-07-27T18:00:00Z"}, {"outlet": "Benzinga", "title": "What's Going on With Freeport-McMoRan Stock Thursday?", "url": "https://www.benzinga.com/markets/earnings/26/07/60651733/copper-boom-keeps-freeports-profits-flowing-despite-grasberg-challenges", "captured_at": "2026-07-27T18:00:00Z"}]}, "rio-tinto": {"company_id": "rio-tinto", "accession_number": "0000863064-26-000035", "company_name": "Rio Tinto", "commodities": ["aluminum", "copper", "iron ore"], "document_type": "production_report", "document_type_label": "Relatório de Produção — 2º Trimestre 2026 (dados operacionais; earnings financeiro do 1S26 ainda não divulgado)", "sources": [{"filename": "rio-tinto-releases-second-quarter-2026-production-results.html", "label": "Comunicado oficial (riotinto.com) — Resultados de produção do 2T26", "source_url": "https://www.riotinto.com/en/news/releases/2026/rio-tinto-releases-second-quarter-2026-production-results", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "second-quarter-production-results-9668973.html", "label": "RNS (London Stock Exchange, via Investegate) — Second Quarter Production Results", "source_url": "https://www.investegate.co.uk/announcement/rns/rio-tinto--rio/second-quarter-production-results/9668973", "captured_at": "2026-07-27T18:00:00Z"}, {"filename": "ex991results.htm", "label": "SEC Form 6-K (exhibit 99.1) — furnished pela Rio Tinto plc", "source_url": "https://www.sec.gov/Archives/edgar/data/0000863064/000086306426000035/ex991results.htm", "captured_at": "2026-07-27T18:00:00Z"}], "tabs": {"earnings_summary": "**Atenção — este é um relatório de PRODUÇÃO, não de earnings financeiro completo.** A Rio Tinto divulgou em 14/07/2026 seu relatório de produção do 2T26 [PR/RNS/SEC 6-K]. Os resultados financeiros completos do 1S26 (receita, EBITDA, lucro) estão agendados para 29/07/2026 — portanto ainda NÃO haviam sido publicados até a data desta pesquisa (27/07/2026).\n\n**Produção — destaques do 1S26/2T26** [PR/RNS]:\n- Produção equivalente de cobre do grupo: +3% a/a no 1S26.\n- **Minério de ferro**: produção global no 1S26 de 169,9 Mt (+5% a/a) — maior produção de 1S no Pilbara desde o recorde de 2018, atribuída ao programa de melhoria de produtividade. Vendas globais no 2T26: 89 Mt (+5% a/a); vendas do Pilbara no 2T26 +7% a/a.\n- **Cobre**: produção do grupo no 1S26 de 442 kt (+1% a/a). Oyu Tolgoi (Mongólia) segue em ramp-up dentro do cronograma, com crescimento de produção de cobre >30% no 1S26 (+31% a/a). Guidance de custo unitário líquido C1 do cobre foi REDUZIDA para US$ 0,30–0,50/lb (ante US$ 0,65–0,75/lb anteriormente) — sinal positivo de eficiência de custos.\n- **Alumínio**: negócio integrado de larga escala manteve desempenho forte e estável, sem grandes surpresas.\n- **Lítio**: produção equivalente de carbonato de lítio no 1S26 de 27,3 kt (+53% a/a), impulsionada pelo ramp-up da planta inicial de Rincon e pela entrega das primeiras toneladas em Sal de Vida e Fénix 1B, à frente do cronograma.\n- Projeto SimFer (mina e infraestrutura portuária): mais de três quartos concluído.\n- Guidance de produção para o ano cheio de 2026 foi REAFIRMADA em todas as commodities, sem alterações.\n\nNenhuma cifra de receita, EBITDA ou lucro consta neste documento — são exclusivamente dados operacionais/volumétricos e de custo unitário do cobre.", "conference_call_summary": "A Rio Tinto normalmente NÃO realiza conference call dedicado para os relatórios trimestrais de produção — apenas o comunicado escrito é publicado. A call com CEO Simon Trott e CFO Peter Cunningham está agendada para acompanhar a divulgação dos resultados financeiros do 1S26 em 29/07/2026 (11:00 AEST | 02:00 BST), com sessão de perguntas e respostas. Portanto, não há resumo de call a reportar nesta atualização — recomenda-se nova atualização após 29/07 para cobrir a teleconferência de earnings financeiro.", "commodity_commentary": "A reação do mercado ao relatório de produção foi modesta e cautelosa. Ações da Rio Tinto listadas na ASX subiram cerca de 1,14%, para A$165,47, no pregão seguinte à divulgação — movimento visto como alívio pontual, já que o papel acumulava queda de ~12,6% no mês anterior em meio a uma correção mais ampla do setor de metais [The Bull; Discovery Alert]. Analistas locais descreveram o release como confirmação de estabilidade operacional, sem surpresas negativas, mas sem catalisador claro para reduzir o gap entre preço de mercado e valor intrínseco estimado [Discovery Alert]. Bancos ajustaram preços-alvo após o dado: RBC Capital cortou o alvo para 6.100 GBp mantendo recomendação Underperform; JPMorgan ajustou para 8.250 GBp (Neutro); Citi reduziu para 7.700 GBp (Neutro) — sinalizando visão mista, com foco maior no resultado financeiro completo de 29/07 do que neste dado de produção isoladamente. A Motley Fool Austrália destacou o crescimento de 3% em produção equivalente de cobre e o salto de 53% em lítio como os pontos mais positivos do trimestre [Fool.com.au]. Não foi localizada, dentro do orçamento de busca desta pesquisa, cobertura específica da Bloomberg, Reuters, FT ou WSJ sobre este release de produção especificamente — as fontes de comentário disponíveis são veículos australianos de menor porte (ver nota ao revisor)."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "IMPORTANTE: este documento cobre apenas o relatório de PRODUÇÃO do 2T26 (divulgado 14/07/2026), não os resultados financeiros do 1S26, que estão agendados para 29/07/2026 (ainda não divulgados na data desta pesquisa, 27/07/2026). Recomenda-se fortemente reprocessar esta empresa após 29/07 e trocar document_type para 'earnings' assim que os dados financeiros saírem. Quanto às fontes de comentário de mercado: não encontrei, dentro do orçamento de busca disponível nesta sessão, matérias específicas de Bloomberg/Reuters/FT/WSJ sobre este release de produção — usei fallback de veículos australianos secundários (The Bull, Discovery Alert, Motley Fool AU), que são aceitáveis mas não ideais pela regra de sourcing; vale nova checagem quando possível. Além disso, a política de egress desta sessão bloqueou WebFetch direto (erro 403 em todos os domínios testados, incluindo domínios de teste neutros), então não consegui abrir as páginas primárias diretamente — toda a informação vem de snippets de busca cruzados entre múltiplas fontes independentes (riotinto.com, SEC EDGAR, Investegate/RNS), o que dá razoável confiança nos números de produção, mas recomenda-se confirmação por fetch direto quando a ferramenta voltar a funcionar.", "commentary_sources": [{"outlet": "The Bull (Austrália)", "title": "Rio Tinto Shares React To Production Update: The Details", "url": "https://thebull.com.au/news/rio-tinto-shares-react-to-production-update-the-details/", "captured_at": "2026-07-27T18:00:00Z"}, {"outlet": "Discovery Alert", "t eladas adicionais de cobre ao longo de 21 anos (~120 mil t/ano), com valor pré-imposto estimado de ao menos US$ 5 bilhões, dividido igualmente [PR]. Implementação final condicionada a licenças ambientais, com prazo estimado para 2030 [PR]. Ambas mantêm propriedade de seus ativos.", "conference_call_summary": "Sem teleconferência associada — comunicado de imprensa, não divulgação de resultados. CEO Duncan Wanblad: \"Adjacências como esta são raras...\" [PR]. Presidente do conselho da Codelco, Bernardo Fontaine: \"Este acordo representa uma forma mais eficiente e responsável de desenvolver um dos principais distritos de cobre do mundo\" [PR].", "commodity_commentary": "Importante desambiguar: em setembro de 2025, a Reuters noticiou a ASSINATURA do acordo original de US$5 bilhões. O evento de 24/06/2026 é distinto: a CONCLUSÃO/fechamento do acordo definitivo, após aprovações regulatórias — marco de implementação, não nova assinatura [Mining Weekly]. A Business Day (África do Sul) destacou que as ações da Anglo American caíram 11% na semana anterior ao anúncio, em meio à correção dos preços do cobre após máximas recordes no início de junho, embora o papel ainda estivesse ~60% acima do nível de um ano atrás [Business Day]. O acordo se encaixa na reestruturação de portfólio da Anglo, que vem se desfazendo de platina, níquel e carvão para focar em cobre — com a fusão pendente com a Teck (aprovada pelos acionistas em dezembro de 2025) esperada para elevar a exposição a cobre da companhia combinada a ~70% [Business Day]. Não foi localizada cobertura própria da Bloomberg/Reuters sobre este fechamento de 24/06. Próximo marco: licenças ambientais pendentes, implementação plena só em 2030 [PR]."}, "commentary_sources": [{"outlet": "Mining Weekly", "title": "Anglo, Codelco ink definitive agreement for joint mine plan in Chile", "url": "https://www.miningweekly.com/article/anglo-codelco-inks-definitive-agreement-for-joint-mine-plan-in-chile-2026-06-24", "captured_at": "2026-07-08T products**\n- Ouro, 2T26: 46.300 onças, estável t/t, com níveis inalterados tanto em Los Pelambres quanto em Centinela [PR].\n\n**Custos**\n- Custo caixa C1 (antes de créditos de subproduto), 1S26: US$ 2,85/lb, +23% a/a, por maiores custos de insumos, acordo trabalhista e menor produção em Los Pelambres/Centinela [PR].\n- Créditos de subproduto, 2T26: US$ 1,58/lb, -7% t/t, por menor preço do ouro [PR].\n- Custo caixa líquido, 2T26: US$ 1,36/lb, +26% t/t [PR].\n\n**Guidance 2026 (revisado)**\n- Produção de cobre do grupo: mantida em 650.000–700.000 toneladas; produção trimestral deve crescer sequencialmente no restante do ano [PR].\n- Custo caixa antes de subprodutos: ELEVADO para US$ 2,40–2,60/lb (ante US$ 2,30–2,50/lb anterior), por preços de combustível e insumos-chave persistentemente altos [PR].\n- Custo caixa líquido (após subprodutos): mantido em US$ 1,15–1,35/lb, com redução esperada no 2S26 por maior produção planejada [PR].\n\n**Projeto Zaldívar**: aprovada decisão de investimento para pipeline e sistema de bombeamento de água de longo prazo, ~US$ 0,9 bilhão ao longo de dois anos (base 100%), permitindo transição de água continental a partir de meados de 2028, com potencial extensão da vida útil da mina até 2051 e criação de mais de 5.000 empregos locais [PR].", "conference_call_summary": "Não localizada transcrição de teleconferência associada a este relatório de produção trimestral nesta varredura. Nenhuma citação direta de executivo sobre este relatório específico foi confirmada — sinalizado para verificação futura (relatórios anteriores da Antofagasta trouxeram citações do CEO Iván Arriagada, mas não foi possível confirmar uma citação nova e específica para o 2T26 nesta sessão).", "commodity_commentary": "A produção de cobre do 1S26 (285 mil toneladas, -9,5% a/a) ficou abaixo das estimativas de consenso, com Los Pelambres e Centinela como os principais responsáveis pela queda [Mining Weekly]. A companhia manteve o guidance anual de 650-700 mil toneladas ixo da estimativa do Morgan Stanley.\n- **Receita**: ~SEK 25,7–26 bilhões — cerca de 10% ABAIXO das expectativas de analistas.\n- **Lucro por ação (EPS)**: SEK 7,81, ligeiramente abaixo da previsão de SEK 7,86 (miss marginal).\n- **Lucro líquido do trimestre**: ~SEK 2,9 bilhões — mais do que o DOBRO do valor registrado no 2T25, mesmo com o miss em relação ao consenso (efeito de base fraca no ano anterior).\n- Fatores que pressionaram o resultado abaixo do esperado: contribuição significativamente menor da mina de Garpenberg, que reiniciou operações após evento sísmico; manutenção planejada nas fundições (smelters) no trimestre, com impacto de SEK -350 milhões no resultado operacional (vs. -400m no trimestre comparável); desenvolvimento de lavra (drift) abaixo do esperado na mina de zinco de Tara (Irlanda); correia transportadora quebrada e teores mais baixos na mina de níquel de Kevitsa (Finlândia); atraso no ramp-up da fundição de zinco expandida de Odda.\n- Fator positivo principal: preços de metais favoráveis (cobre, zinco e outros) ao longo do trimestre, que sustentaram a rentabilidade apesar dos problemas operacionais.\n- Citação do CEO Mikael Staffas: \"o primeiro semestre de 2026 foi, em muitos aspectos, uma continuação do caminho que a Boliden vem trilhando há bastante tempo. Enfrentamos alguns desafios, mas com 12 unidades de negócio não se pode esperar sempre uma navegação tranquila em todos os lugares, e nossa jornada de longo prazo permanece positiva\" [PR].", "conference_call_summary": "A Boliden realizou conferência de imprensa e analistas em 21/07/2026 às 09:30 CEST, conduzida pelo CEO Mikael Staffas e CFO Håkan Gabrielsson [PR]. A Investing.com publicou transcrição da call sob o título \"Boliden Q2 2026 beats on operations as stock jumps 25%\" — atenção: esse título específico não deve ser tomado como confirmação da variação real do preço da ação na bolsa principal (Nasdaq Stockholm), pois o número de 25% aparece associado, em outras buscas, ao ADR pouco líquido da Boliden negociado em balcão nos EUA (ticker BDNNY), que pode apresentar oscilações exageradas e não representativas por baixa liquidez (ver nota ao revisor). Não consegui acessar o conteúdo integral da transcrição nesta pesquisa (bloqueio de rede nesta sessão); meu resumo dos temas discutidos na call é limitado aos títulos e resumos encontrados via busca, que indicam foco em: cronograma de ramp-up de Odda, perspectivas de retomada plena em Garpenberg, e detalhamento dos impactos pontuais em Tara e Kevitsa.", "commodity_commentary": "A reação da imprensa financeira ao resultado do 2T26 da Boliden foi predominantemente enquadrada como um MISS em relação ao consenso, apesar do forte crescimento do lucro ano contra ano. Segundo despachos atribuídos à Bloomberg (citados por veículos secundários, sem que eu tenha conseguido localizar e confirmar a URL original da Bloomberg dentro do orçamento de busca desta sessão), tanto o lucro quanto a receita do 2T26 vieram abaixo das expectativas dos analistas, com contratempos de produção nas minas de Tara e Garpenberg e problemas de ramp-up na fundição ampliada de Odda pressionando o resultado [Bloomberg via fontes secundárias]. A Investing.com noticiou o resultado sob a manchete \"Boliden falls after Q2 miss as mine, smelter setbacks hit earnings\", reforçando a leitura negativa quanto às expectativas [Investing.com]. O Sweden Herald resumiu com a manchete \"Boliden reports profit jump to SEK 2.8 billion, but results miss expectations\", capturando a dualidade do trimestre: lucro em forte alta ano contra ano, mas abaixo do que o mercado projetava [Sweden Herald]. A Simply Wall St destacou que a receita ficou 10% abaixo do consenso, levando analistas a revisar seus modelos [Simply Wall St]. Não encontrei confirmação confiável e específica da variação percentual das ações da Boliden na bolsa principal (Nasdaq Stockholm: BOL) — evitei citar qualquer número de variação de preço nesta aba por falta de uma fonte primária/confiável verificada (ver nota ao revisor)."}, "generated_by": "scheduled-routine-2026-07-27", "generated_at": "2026-07-27T18:00:00Z", "status": "summarized", "note_for_reviewer": "CONTEXTO DE M&A (não confundir com o resultado do 2T26 — são eventos distintos): em 02/07/2026, a Boliden confirmou estar em negociações com a Votorantim para uma possível aquisição da participação controladora de ~64,7% da Votorantim na Nexa Resources (ativos de zinco no Brasil e Peru). Nenhum preço ou prazo foi divulgado oficialmente; reportagem de abril havia mencionado uma cifra especulativa de ~R$7 bilhões (~US$1,4 bilhão) vinda de fonte de imprensa brasileira, não confirmada pelas partes. Não foi encontrada nenhuma atualização material sobre essa negociação além do comunicado de 02/07/2026 — ou seja, o negócio segue apenas 'em conversas', sem confirmação, até a data desta pesquisa (27/07/2026).\n\nRESSALVAS SOBRE A COBERTURA DE IMPRENSA: (1) A Bloomberg é citada por múltiplas fontes secundárias como tendo reportado o miss vs. consenso, mas não localizei a URL original da Bloomberg dentro do orçamento de busca desta sessão — recomenda-se busca adicional específica. (2) Encontrei um dado conflitante e não verificado de alta de 25% no preço das ações associado ao título de uma transcrição da Investing.com; evidências sugerem que esse número pode se referir ao ADR pouco líquido da Boliden em balcão nos EUA (BDNNY) e não à ação primária negociada na Nasdaq Stockholm (BOL) — optei por NÃO incluir essa cifra na aba de commodity_commentary por falta de confiança/verificação.\n\nLIMITAÇÃO METODOLÓGICA GERAL: a política de egress desta sessão bloqueou WebFetch direto (erro 403 em todos os domínios testados, incluindo domínios neutros de teste) e o orçamento de WebSearch da sessão se esgotou antes de conseguir aprofundar a verificação da reação real do preço da ação. Todos os dados vêm de snippets de busca cruzados entre a página oficial de RI da Boliden, PR Newswire (distribuição oficial) e da Vale para o 1T26.", "commodity_commentary": "Em 28 de abril de 2026, a Bloomberg publicou a reportagem 'Vale Falls Short as Seasonal Pressures Offset Stronger Prices', destacando que a mineradora brasileira decepcionou o mercado no primeiro trimestre de 2026, com pressões sazonais anulando o efeito de preços mais altos e volumes maiores de vendas [Bloomberg]. Segundo a Bloomberg, o EBITDA proforma somou US$ 3,9 bilhões, ficando abaixo da estimativa média dos analistas de US$ 4,11 bilhões [Bloomberg]. A reportagem enquadrou o resultado como um 'miss' em relação às expectativas do mercado, mesmo com a receita trimestral subindo cerca de 14% na comparação anual, para US$ 9,26 bilhões, e o lucro líquido avançando 36%, para US$ 1,89 bilhão — também abaixo da previsão de US$ 2,05 bilhões [Bloomberg]. Entre os destaques operacionais, os preços realizados de cobre subiram 48% em meio a uma onda de especulação no início de 2026, enquanto os preços do minério de ferro tiveram alta mais modesta, de cerca de 5,5% [Bloomberg]. O próprio título escolhido pela Bloomberg já sinaliza o tom predominantemente negativo com que o mercado recebeu o resultado. Dados de mercado consultados por agências de notícias indicaram queda em torno de 2,7% nos recibos de ações (ADRs) da Vale negociados em Nova York no pregão de divulgação."}, "generated_by": "claude-research", "generated_at": "2026-07-07T20:40:00Z", "status": "summarized", "note_for_reviewer": "Platina/paládio são subprodutos menores da Vale Base Metals, não detalhados individualmente neste release financeiro.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Vale Falls Short as Seasonal Pressures Offset Stronger Prices", "url": "https://www.bloomberg.com/news/articles/2026-04-28/vale-falls-short-as-seasonal-pressures-offset-stronger-prices", "captured_at": "2026-07-07T00:00:00Z"}]}, "zijin-mining": {"company_id": "zijin-mining", "accession_number": null, "company_name": "Zijin Mining Group Co., Ltd.", "commodities": ["copper", "gold", "lithium"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "news-detail-122723.htm", "label": "Press release/notícia oficial da empresa — título original: \"Zijin's Q1 Net Profit Soars 98% to RMB 20.1 Billion under New Chairman\"", "source_url": "https://www.zijinmining.com/news/news-detail-122723.htm", "captured_at": "2026-07-07T20:00:00Z"}], "tabs": {"earnings_summary": "**Resultado Financeiro (1T26 vs 1T25)**\n- Receita: RMB 98,5 bilhões, alta de 25% a/a [PR]. Lucro líquido atribuível: RMB 20,1 bilhões, alta de 98% a/a — primeira vez acima de RMB 20 bi em lucro trimestral [PR].\n\n**Produção**\n- Ouro: 23,5 toneladas, alta de 23% a/a [PR]. Cobre: 260.000 toneladas mineradas [PR]. LCE: 16.000 toneladas [PR].\n\n**Mina de Cobre Julong Fase II (Tibet)**\n- Entrou em operação em janeiro de 2026; produziu 60.000 toneladas de cobre no 1T26; capacidade plena alvo de 300.000–350.000 t/ano [PR].\n\n**Guidance 2026**\n- Cobre: meta de 1,2 milhão de toneladas [PR]. Ouro: meta de 105 toneladas [PR].", "conference_call_summary": "Não foi localizada, na fonte primária consultada, transcrição verbatim de teleconferência com analistas para o 1T26.", "commodity_commentary": "Apesar de pesquisa extensa em Bloomberg, Reuters, Financial Times e Wall Street Journal, não foi possível localizar uma reportagem dedicada dessas fontes analisando especificamente a reação do mercado ao relatório do primeiro trimestre de 2026 da Zijin Mining, divulgado em 21 de abril de 2026. A Bloomberg noticiou amplamente a trajetória de lucros recordes da mineradora chinesa em torno da divulgação dos resultados anuais de 2025, destacando que o lucro líquido estimado saltou até 62% em 2025, para RMB 52 bilhões (US$ 7,4 bilhões), com a Zijin planejando aumentar a produção de ouro e cobre em ritmo de dois dígitos em 2026 [Bloomberg]. Essa cobertura também situou a Zijin como a terceira maior mineradora do mundo por valor de mercado, atrás apenas de Rio Tinto e BHP [Bloomberg]. Quanto ao resultado específico do primeiro trimestre de 2026 — lucro líquido atribuível de RMB 20,1 bilhões (+98% a/a) e receita de RMB 98,5 bilhões (+25%), segundo números divulgados pela própria companhia —, a pesquisa não encontrou, entre as quatro fontes prioritárias, uma análise dedicada de reação de mercado a este resultado em particular. Por isso, esta nota registra os números como divulgados pela companhia e por agências setoriais especializadas, sem atribuir uma reação de mercado não confirmada nas fontes prioritárias."}, "generated_by": "claude-research", "generated_at": "2026-07-07T20:45:00Z", "status": "summarized", "note_for_reviewer": "Zijin é listada na HKEX e Bolsa de Xangai — não é registrante SEC. Valores em RMB.", "commentary_sources": [{"outlet": "Bloomberg", "title": "China's Zijin Mining Plans Gold Output Push After Record Profit", "url": "https://www.bloomberg.com/news/articles/2025-12-31/china-s-zijin-mining-plans-gold-output-push-after-record-profit", "captured_at": "2026-07-07T00:00:00Z"}]}, "glencore": {"company_id": "glencore", "accession_number": null, "company_name": "Glencore plc", "commodities": ["copper", "zinc", "cobalt", "nickel", "coal", "platinum", "palladium"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral (Q1 2026)", "sources": [{"filename": "first-quarter-2026-production-report", "label": "Press release da empresa — título original: \"First Quarter 2026 Production Report\"", "source_url": "https://www.glencore.com/media-and-insights/news/first-quarter-2026-production-report", "captured_at": "2026-07-07T20:05:00Z"}], "tabs": {"earnings_summary": "**Produção Própria — 1T26 vs 1T25**\n- Cobre: 199,6 mil toneladas, alta de 19% [PR]. Zinco: 176,9 mil toneladas, queda de 17% [PR]. Cobalto: 5,8 mil toneladas, queda de 39% [PR]. Níquel: 17,2 mil toneladas, queda de 9% [PR].\n\n**Vetores da Variação de Cobre**\n- Ganho de 27,4 mil toneladas em ativos de cobre africano, por melhores teores [PR]. Ganho de 13,5 mil toneladas em Antamina [PR]. Perda de 8,9 mil toneladas pela cessação de Mount Isa [PR].\n\n**Cobalto**\n- Queda refletindo cotas de exportação na RDC, priorizando cobre sobre cobalto [PR]. Alocação de cota 2026: 22,8 mil toneladas [PR].\n\n**Guidance 2026 (mantida)**\n- Cobre: 810.000–870.000 toneladas [PR]. Zinco: 700.000–740.000 toneladas [PR].", "conference_call_summary": "Não há teleconferência associada a relatórios trimestrais de produção da Glencore. Citação da administração: \"first quarter production was largely in line with our expectations\", com guidance \"remains unchanged.\"\n^Tradução livre: \"a produção do primeiro trimestre esteve, em grande medida, em linha com nossas expectativas\" ... \"guidance permanece inalterada.\"", "commodity_commentary": "O relatório de produção e trading do primeiro trimestre de 2026 da Glencore, divulgado em 30 de abril de 2026, foi destaque em reportagem da Bloomberg intitulada 'Glencore's Traders Score Big Profits as War Rattles Energy Markets' [Bloomberg]. Segundo a Bloomberg, a mesa de trading da companhia registrou lucros excepcionais à medida que o conflito envolvendo o Irã provocou fortes distorções nos mercados globais de energia, com cargas físicas de petróleo e derivados sendo negociadas com grandes prêmios após o quase fechamento do Estreito de Ormuz [Bloomberg]. A agência informou que o lucro core anual da unidade de marketing deve superar 'confortavelmente' o topo da meta de longo prazo de US$ 3,5 bilhões [Bloomberg]. Quanto à reação do mercado, a Bloomberg registrou que as ações da Glencore subiam 0,8% por volta das 8h30 (horário de Londres) no dia da notícia, mesmo com os mercados acionários globais em geral em queda devido ao risco de escalada do conflito no Irã [Bloomberg]. Esse resultado veio poucos meses depois de a Bloomberg noticiar, em fevereiro de 2026, que o lucro anual consolidado de 2025 havia caído cerca de 6%, para US$ 13,5 bilhões, com o rali recorde do cobre insuficiente para compensar a fraqueza da divisão de carvão [Bloomberg]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T20:50:00Z", "status": "summarized", "note_for_reviewer": "Relatório de produção apenas — sem demonstrativo financeiro. Glencore não é registrante SEC. Resultados financeiros do 1S26 ainda não publicados na data da pesquisa. Platina/paládio são subprodutos não detalhados individualmente neste relatório.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Glencore's Traders Score Big Profits as War Rattles Energy Markets", "url": "https://www.bloomberg.com/news/articles/2026-04-30/glencore-s-traders-score-big-profits-as-war-roils-energy-markets", "captured_at": "2026-07-07T00:00:00Z"}, {"outlet": "Bloomberg", "title": "Glencore Profit Falls as Coal Earnings Drop Outweighs Copper Price Surge", "url": "https://www.bloomberg.com/news/articles/2026-02-18/glencore-profit-slides-as-copper-rally-offset-by-coal-slump", "captured_at": "2026-07-07T00:00:00Z"}]}, "agnico-eagle-mines": {"company_id": "agnico-eagle-mines", "accession_number": "0001104659-26-080204", "document_type": "operational_update", "document_type_label": "Atualização Operacional e Revisão de Guidance — Movimento de Rocha no Barnat Pit (Canadian Malartic), NÃO é o earnings completo do 2º Trimestre 2026", "sources": [{"filename": "tm2619674d1_ex99-1.htm", "label": "Formulário 6-K (Anexo 99.1) — comunicado sobre movimento de rocha no Barnat Pit, Canadian Malartic", "source_url": "https://www.sec.gov/Archives/edgar/data/0000002809/000110465926080204/tm2619674d1_ex99-1.htm", "captured_at": "2026-07-08T01:40:00Z"}], "tabs": {"earnings_summary": "Em comunicado de 2 de julho de 2026 (6-K), a Agnico Eagle informou que, em 1º de julho, ocorreu movimento de massa rochosa na parede norte da cava Barnat, no complexo Canadian Malartic (Quebec) [PR]. Sem feridos, danos a equipamentos ou impacto ambiental. Mineração na cava suspensa temporariamente por precaução [PR].\n\n**Impacto**: redução esperada de 60.000-80.000 onças de ouro na produção do complexo no 2S26 [PR]. Produção anual consolidada de 2026 deve ficar próxima do piso do guidance de 3,3-3,5 milhões de onças [PR]. Possível redução adicional de até ~150.000 onças/ano em 2027 e 2028 [PR]. Empresa reafirmou que o evento não deve afetar o desenvolvimento da mina Odyssey [PR].\n\nAtualizações adicionais de guidance serão dadas com os resultados do 2T26, em 29/07/2026. Este é um comunicado operacional/de guidance — NÃO é o resultado financeiro do 2T26.", "conference_call_summary": "Sem teleconferência dedicada a este comunicado específico — publicado fora do ciclo normal de resultados como fato relevante de segurança geotécnica. Detalhamento de custo/produção previsto para a call de resultados do 2T26, em 30/07/2026.", "commodity_commentary": "Segundo a BNN Bloomberg (agência The Canadian Press, 02/07/2026), a Agnico Eagle suspendeu temporariamente a mineração na cava Barnat após o movimento de rocha [Bloomberg]. A reportagem confirma os números divulgados pela empresa — redução de 60.000-80.000 onças no 2S26 e produção anual tendendo ao piso da faixa — sem comentário independente de analistas [Bloomberg]. Um dia antes do evento, em 06/07, a Jefferies havia elevado a recomendação da Agnico Eagle para \"Buy\" (preço-alvo C$ 200, de C$ 187), citando volatilidade recente como ponto de entrada — upgrade anterior ao incidente, não incorpora seu impacto [Bloomberg]. O episódio ocorre em meio a preços do ouro em patamares recordes, o que tende a suavizar o impacto financeiro da perda de produção, mas reforça o risco geotécnico como tema recorrente no setor aurífero canadense."}, "commentary_sources": [{"outlet": "BNN Bloomberg", "title": "Agnico Eagle suspends mining operations at Barnat pit after rock movement", "url": "https://www.bnnbloomberg.ca/business/company-news/2026/07/02/agnico-eagle-suspends-mining-operations-at-barnat-pit-after-rock-movement/", "captured_at": "2026-07-08T01:50:00Z"}], "generated_by": "claude-research", "generated_at": "2026-07-08T00:00:00Z", "note_for_reviewer": "Complementa a entrada de earnings do 1T26 (segue válida). Evento de 1-2/07/2026 levou a revisão de guidance de produção para 2S26/2026/2027-28 — mais recente e relevante que o release de Q1. Fonte primária: 6-K SEC (accession 0001104659-26-080204). Revisar após resultados do 2T26 em 29/07/2026."}, "anglogold-ashanti": {"company_id": "anglogold-ashanti", "accession_number": "0001973832-26-000091", "company_name": "AngloGold Ashanti plc", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "agaq1march2026operatingsta.htm", "label": "Demonstrativo operacional e financeiro trimestral — \"AngloGold Ashanti Q1 31 March 2026 Earnings Release and Dividend Declaration\" (Anexo ao Formulário 6-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/1973832/000197383226000091/agaq1march2026operatingsta.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — AngloGold Ashanti plc**\n\n**Produção**\n- Produção total de ouro: 724 mil oz (+1% a/a) [PR]\n\n**Resultado financeiro**\n- Receita de ouro: US$ 3.154 milhões (1T2025: US$ 1.927 milhões) [PR]\n- EBITDA: US$ 2.291 milhões (+130% a/a) [PR]\n- Lucro atribuível: US$ 1.281 milhões (1T2025: US$ 443 milhões) [PR]\n\n**Custos**\n- Preço médio de ouro realizado: US$ 4.863/oz (+69% a/a) [PR]\n- AISC (grupo): US$ 1.955/oz (+19% a/a) [PR]\n\n**Caixa e balanço**\n- Fluxo de caixa livre: US$ 1.169 milhões — recorde trimestral (+190% a/a) [PR]\n- Posição de caixa líquido de US$ 868 milhões, revertendo dívida líquida de US$ 755 milhões no 1T2025 [PR]\n\n**Dividendos**\n- Dividendo trimestral recorde de US$ 585 milhões (116 centavos/ação) [PR]\n- Programa de recompra proposto de até US$ 2,0 bilhões [PR]\n\n**Projeto Arthur (Nevada)**\n- Reserva provável de 4,9 Moz; VPL após impostos de US$ 3,41–3,46 bilhões a US$ 3.500/oz; TIR de 22–26% [PR]", "conference_call_summary": "Não localizada transcrição primária. Citação do CEO Alberto Calderón: \"Our focus remains to control what we can control—managing underlying costs and ensuring safe, predictable operating results.\"\n^Tradução livre: \"Nosso foco continua sendo controlar o que está ao nosso alcance — administrar custos subjacentes e garantir resultados operacionais seguros e previsíveis.\"", "commodity_commentary": "A cobertura mais robusta da imprensa financeira internacional sobre a AngloGold Ashanti no ciclo recente veio da Bloomberg, em reportagem de 20 de fevereiro de 2026 intitulada 'AngloGold Profit Jumps 160% as Gold Rally Drives Record Dividend', referente aos resultados do ano fiscal de 2025 [Bloomberg]. Segundo a Bloomberg, o lucro saltou 160% em 2025, com o rali recorde do ouro impulsionando a produção e levando a companhia a distribuir o maior pagamento de sua história, totalizando US$ 1,8 bilhão no ano [Bloomberg]. Para o primeiro trimestre de 2026 — divulgado em 8 de maio de 2026 —, a pesquisa não localizou reportagem dedicada de nenhuma das quatro fontes prioritárias. Segundo dados divulgados pela própria companhia, a AngloGold registrou fluxo de caixa livre recorde de cerca de US$ 1,2 bilhão no trimestre — quase o triplo do mesmo período de 2025 —, dividendo trimestral recorde de 116 centavos de dólar por ação e aprovação de um programa de recompra de até US$ 2 bilhões. Esses números coincidiram com valorização das ações a máximas históricas em Joanesburgo e Nova York, segundo dados de mercado — embora sem confirmação de imprensa de primeira linha para esse trimestre específico."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Nova holding no Reino Unido (CIK SEC 0001973832).", "commentary_sources": [{"outlet": "Bloomberg", "title": "AngloGold Profit Jumps 160% as Gold Rally Drives Record Dividend", "url": "https://www.bloomberg.com/news/articles/2026-02-20/anglogold-posts-profit-surge-and-record-dividend-on-price-rally", "captured_at": "2026-07-07T00:00:00Z"}]}, "kinross-gold": {"company_id": "kinross-gold", "accession_number": "0001171843-26-002835", "company_name": "Kinross Gold Corporation", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "exh_991.htm", "label": "Press release da empresa — título original: \"Kinross reports strong 2026 first-quarter results\" (Anexo 99.1 ao Formulário 6-K)", "source_url": "https://www.sec.gov/Archives/edgar/data/701818/000117184326002835/exh_991.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — Kinross Gold Corporation**\n\n**Resultado financeiro**\n- Receita de vendas de metais: US$ 2.407,7 milhões (+61% a/a) [PR]\n- Lucro líquido: US$ 843,0 milhões (US$ 0,70/ação), ante US$ 368,0 milhões no 1T2025 [PR]\n\n**Fluxo de caixa**\n- Fluxo de caixa livre atribuível: US$ 837,5 milhões — recorde pelo 4º trimestre consecutivo [PR]\n- Caixa em 31/3/2026: US$ 2.185,0 milhões; liquidez total ~US$ 3,9 bilhões [PR]\n\n**Produção**\n- Total atribuível: 492.563 oz (1T2025: 512.088 oz; -4% planejado) [PR]\n- Principais ativos: Tasiast 130.014 oz; Paracatu 160.583 oz (recorde de recuperação); Fort Knox 93.994 oz [PR]\n\n**Custos**\n- Preço médio realizado: US$ 4.873/oz (1T2025: US$ 2.857/oz) [PR]\n- AISC atribuível: US$ 1.732/oz (1T2025: US$ 1.355/oz) [PR]\n- Margem por onça: US$ 3.476, alta de 92% a/a [PR]\n\n**Guidance 2026**\n- Produção: 2,0 Moz eq.-ouro (±5%) [PR]. AISC: US$ 1.730/oz (±5%) [PR]\n\n**Projetos**\n- Great Bear (Canadá): construção de superfície ~90% concluída [PR]. Lobo-Marte (Chile): EIA submetido em abril/2026 [PR]", "conference_call_summary": "Não localizada transcrição verbatim primária. Citação do CEO J. Paul Rollinson: \"We generated record free cash flow of approximately $840 million, representing our fourth consecutive quarterly record.\"\n^Tradução livre: \"Geramos um fluxo de caixa livre recorde de aproximadamente US$ 840 milhões, nosso quarto recorde trimestral consecutivo.\"", "commodity_commentary": "Apesar de pesquisa extensa em Bloomberg, Reuters, Financial Times e Wall Street Journal, não foi possível confirmar uma reportagem dedicada dessas fontes analisando especificamente a reação do mercado aos resultados do primeiro trimestre de 2026 da Kinross Gold, divulgados em 29-30 de abril de 2026. Segundo dados amplamente replicados por agregadores financeiros, a Kinross registrou fluxo de caixa livre atribuível recorde de aproximadamente US$ 838 milhões no trimestre — o quarto trimestre consecutivo de recorde —, com margens de US$ 3.476 por onça equivalente de ouro (+92% a/a). O lucro líquido ajustado somou US$ 854,1 milhões (US$ 0,71/ação), superando ligeiramente a expectativa média de US$ 0,68. Dados de negociação amplamente reportados indicam que as ações chegaram a subir entre 5% e 7% no pregão seguinte, refletindo otimismo com a geração de caixa recorde. Como essas informações não puderam ser confirmadas em reportagens específicas das quatro fontes prioritárias, esta nota as registra com a ressalva de que provêm de agregadores financeiros especializados."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Dados extraídos via Anexo 99.1 do Formulário 6-K na SEC EDGAR.", "commentary_sources": []}, "b2gold": {"company_id": "b2gold", "accession_number": "0001171843-26-003084", "company_name": "B2Gold Corp.", "commodities": ["gold"], "document_type": "earnings", "document_type_label": "Earnings Completo", "sources": [{"filename": "B2Gold-Reports-Q1-2026-Results", "label": "Press release da empresa — título original: \"B2Gold Reports Q1 2026 Results\" (Anexo 99.1 ao Formulário 6-K)", "source_url": "https://www.b2gold.com/news-media/news-releases/news-details/2026/B2Gold-Reports-Q1-2026-Results/default.aspx", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Resultados do 1T2026 — B2Gold Corp.**\n\n**Resultado financeiro**\n- Receita de ouro: US$ 1.158,7 milhões (+118% a/a) [PR]\n- Lucro líquido: US$ 205,6 milhões (US$ 0,15/ação) [PR]\n- Preço médio realizado: US$ 4.193/oz (1T2025: US$ 2.892/oz) [PR]\n\n**Fluxo de caixa**\n- Fluxo de caixa livre: US$ 361,8 milhões, ante -US$ 6,9 milhões no 1T2025 [PR]\n\n**Produção**\n- Total consolidado: 237.763 oz [PR]. Fekola Complex 117.450 oz; Goose Mine (início de produção comercial no trimestre) 42.876 oz [PR]\n\n**Custos**\n- AISC consolidado: US$ 1.964/oz (guidance 2026: US$ 2.400–2.580/oz) [PR]\n\n**Retorno de capital**\n- Recompra de US$ 80 milhões no 1T; dividendo do 2T de US$ 0,02/ação [PR]\n\n**Transações**\n- Venda de 70% da Fingold Ventures para a Agnico Eagle por US$ 325 milhões, concluída em 23/4/2026 [PR]\n\n**Incidente pós-trimestre**\n- Incêndio em 16/4/2026 no circuito de britagem da Goose Mine; produção do 2T2026 revisada para baixo [PR]", "conference_call_summary": "Não localizada transcrição verbatim primária. Release descreve \"very positive first quarter of 2026 operating and financial results.\"\n^Tradução livre: \"resultados operacionais e financeiros muito positivos no primeiro trimestre de 2026\"", "commodity_commentary": "Apesar de pesquisa extensa em Bloomberg, Reuters, Financial Times e Wall Street Journal, não foi localizada uma reportagem dedicada dessas fontes analisando especificamente a reação do mercado aos resultados do primeiro trimestre de 2026 da B2Gold, divulgados em 6 de maio de 2026. Segundo dados amplamente replicados por agregadores financeiros, a B2Gold reportou receita de ouro de US$ 1,16 bilhão, mais que o dobro do mesmo período de 2025, e lucro líquido de US$ 199,9 milhões (US$ 0,19/ação ajustado) — resultado que superou a expectativa média dos analistas de US$ 0,11 por ação em cerca de 73%. A produção de ouro somou 237.763 onças, com todas as operações superando as metas orçadas. Dados de negociação amplamente reportados indicam que as ações subiram cerca de 11% no pregão de 7 de maio de 2026, com ganho adicional de cerca de 8,5% em meados de junho. Ainda assim, em 3 de junho, o analista Josh Wolfson, do RBC Capital, reiterou recomendação neutra ('hold'), com preço-alvo de US$ 5,75. Como essas informações não puderam ser confirmadas em reportagens específicas das quatro fontes prioritárias, esta nota as registra com a ressalva de que provêm de agregadores financeiros."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Nenhuma.", "commentary_sources": []}, "gold-fields": {"company_id": "gold-fields", "accession_number": "0001628280-26-031621", "company_name": "Gold Fields Limited", "commodities": ["gold"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral", "sources": [{"filename": "goldfields-q12026_operat.htm", "label": "Atualização operacional trimestral (JSE SENS / Anexo ao Formulário 6-K) — Q1 2026 Operating Update", "source_url": "https://www.sec.gov/Archives/edgar/data/1172724/000162828026031621/goldfields-q12026_operat.htm", "captured_at": "2026-07-07T00:00:00Z"}], "tabs": {"earnings_summary": "**Atualização operacional do 1T2026 — Gold Fields Limited**\n\n**Produção**\n- Produção total atribuível: 633 mil oz, +15% a/a e -7% t/t [PR]\n- Destaques: Salares Norte 173 mil oz (+245% a/a); Granny Smith 78 mil oz (+25% a/a) [PR]\n\n**Custos**\n- AISC: US$ 1.829/oz (+13% a/a, +9% t/t) [PR]\n- CEO sinalizou pressão de custos (diesel +30–70%, frete +40%) [PR]\n\n**Balanço**\n- Dívida líquida: US$ 1.304 milhões, -34% a/a [PR]. Dívida líquida/EBITDA ajustado: 0,19x [PR]\n\n**Guidance 2026 (mantido)**\n- Produção: 2,40–2,60 Moz [PR]. AISC: US$ 1.800–2.000/oz [PR]\n\n**Projetos**\n- Windfall (Canadá): acordo preliminar com comunidades Cree [PR]. Damang devolvida ao governo de Gana em 18/4/2026 [PR]", "conference_call_summary": "Nenhuma transcrição verbatim primária localizada. Citação do CEO: \"Gold Fields delivered a solid start to 2026, building on positive safety, operational and financial delivery of 2025.\"\n^Tradução livre: \"A Gold Fields teve um início sólido em 2026, consolidando os avanços positivos de segurança, operação e resultado financeiro obtidos em 2025.\"", "commodity_commentary": "A Bloomberg noticiou que o lucro da Gold Fields referente ao exercício de 2025 (divulgado em fevereiro de 2026) praticamente triplicou, impulsionado pela alta recorde do ouro: a mineradora sul-africana projetou lucro por ação entre US$ 3,87 e US$ 4,11, alta de 178% a 196% ante o ano anterior, refletindo preços do metal significativamente mais altos e maiores volumes vendidos [Bloomberg]. A produção anual atingiu 2,4 milhões de onças, 18% acima de 2024, com destaque para a rampa de produção da mina Salares Norte, no Chile [Bloomberg]. O ouro subiu quase 65% ao longo de 2025, em meio à turbulência geopolítica que impulsionou a demanda por ativos de proteção, contexto citado pela Bloomberg como pano de fundo do resultado [Bloomberg].\n\nA Reuters noticiou que a Gold Fields elevou o dividendo e chegou a cogitar recompra de ações à medida que a alta dos preços do ouro impulsionou o lucro, destacando o apetite da administração por devolver caixa aos acionistas após o salto de rentabilidade [Reuters]. Segundo a Reuters, o lucro triplicou na comparação anual, reforçando a leitura do mercado de que 2025 foi um ano recorde para a mineradora [Reuters].\n\nJá a atualização operacional do primeiro trimestre de 2026, divulgada em abril, mostrou produção trimestral de 633 mil onças (alta de 15% na comparação anual, mas queda de 7% ante o trimestre anterior), com custo total (AISC) subindo para US$ 1.829/oz em meio a pressões inflacionárias e câmbio mais forte nos países produtores; a dívida líquida recuou 34% na base anual, para US$ 1.304 milhões [Bloomberg]. A cobertura da imprensa financeira internacional concentrou-se, no entanto, nos resultados anuais de fevereiro, que foram o evento de maior repercussão para investidores no período mais recente."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "Atualização operacional/de produção (padrão JSE), não demonstrativo financeiro completo com DRE.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Gold Fields Says Profit Almost Tripled on Bullion Price Rally", "url": "https://www.bloomberg.com/news/articles/2026-02-06/gold-fields-says-profit-almost-tripled-on-bullion-price-rally", "captured_at": "2026-07-08T00:00:00Z"}, {"outlet": "Reuters", "title": "Gold Fields boosts shareholder returns after profit more than doubles", "url": "https://www.cnbcafrica.com/2026/gold-fields-boosts-shareholder-returns-after-profit-more-than-doubles", "captured_at": "2026-07-08T00:00:00Z"}]}, "lundin-gold": {"company_id": "lundin-gold", "accession_number": null, "company_name": "Lundin Gold Inc.", "commodities": ["gold"], "document_type": "production_report", "document_type_label": "Relatório de Produção Trimestral (Q2 2026)", "sources": [{"filename": "lundin-gold-q2-2026-production-release.html", "label": "Press release da empresa — título original: \"Lundin Gold Reports Q2 2026 Production of 118,994 Ounces of Gold\"", "source_url": "https://lundingold.com/news/lundin-gold-reports-q2-2026-production-of-118-994-122852/", "captured_at": "2026-07-08T00:00:00Z"}], "tabs": {"earnings_summary": "**Produção** — A Fruta del Norte (sudeste do Equador) produziu 118.994 oz de ouro no Q2 2026, sendo 79.208 oz na forma de concentrado e 39.786 oz na forma de doré [PR]. Na comparação anual, o Q2 2025 havia registrado 139.433 oz — a empresa atribui a queda ao fato de o Q2 2026 ser, conforme planejado, o trimestre mais fraco do ano no cronograma de mina [PR].\n\n**Operacional** — O moinho processou 500.143 t de minério no trimestre, com throughput médio de 5.496 t/dia, teor médio de 8,3 g/t e recuperação de 89,1% [PR]. Vendas de ouro no período somaram 110.385 oz a preço médio realizado de US$ 4.359/oz [PR].\n\n**Guidance** — A companhia reafirmou o guidance de produção para 2026 em 475.000–525.000 oz [PR].\n\n**Importante**: este release cobre SOMENTE dados de produção — AISC (all-in sustaining cost) e posição de caixa não constam deste comunicado. Os resultados financeiros completos do Q2 2026 serão divulgados após o fechamento de mercado em 06/08/2026, com conference call em 07/08/2026 às 8h PT / 11h ET / 17h CET [PR].", "conference_call_summary": "Não houve conference call vinculado a este release de produção. Citação do CEO Jamie Beck no comunicado: \"Second quarter production of 118,994 ounces of gold, in what was planned to be the weakest quarter of the year, emphasizes the strength of our operations.\" [PR] O call de resultados financeiros completos do Q2 2026 está agendado para 07/08/2026.", "commodity_commentary": "Não foi localizada cobertura dedicada da Bloomberg, Reuters, FT ou WSJ especificamente sobre este production update (padrão comum para releases operacionais intermediários de mineradoras mid-cap fora de temporada de resultados). Como fallback, a **TipRanks** publicou a matéria \"Lundin Gold Q2 Output Holds Firm as Fruta del Norte Drives Guidance\", enquadrando a queda de produção anual como esperada (manutenção planejada) e destacando que o guidance reafirmado reforça a leitura de confiabilidade operacional da mina [TipRanks]. O **Simply Wall St** publicou análise com o título \"Does Lundin Gold's (TSX:LUG) Reaffirmed 2026 Output Target Reinforce Its Operational Reliability Story?\", no mesmo sentido — usando a manutenção do guidance apesar do trimestre mais fraco como evidência de execução consistente em Fruta del Norte [Simply Wall St]. Nenhuma das duas fontes reporta reação de preço de ação específica ao release; nenhuma cifra adicional além das já constantes no PR foi identificada nesses textos."}, "generated_by": "claude-research", "generated_at": "2026-07-20T00:00:00Z", "status": "summarized", "note_for_reviewer": "Release cobre apenas dados de produção; AISC e caixa NÃO estão disponíveis até a divulgação financeira completa de 06/08/2026 (call em 07/08) — recomenda-se nova atualização após essa data. Não encontrei cobertura da Bloomberg/Reuters/FT; usei TipRanks e Simply Wall St como fallback. Queda YoY de produção (139.433 oz → 118.994 oz) é real e vem do próprio PR — atribuída a sazonalidade planejada de mina, não a problema operacional. Fetch direto a lundingold.com retornou bloqueio de rede neste ambiente; dados cross-checados contra múltiplas réplicas do mesmo press release.", "commentary_sources": [{"outlet": "TipRanks", "title": "Lundin Gold Q2 Output Holds Firm as Fruta del Norte Drives Guidance", "url": "https://www.tipranks.com/news/company-announcements/lundin-gold-q2-output-holds-firm-as-fruta-del-norte-drives-guidance", "captured_at": "2026-07-20T00:00:00Z"}, {"outlet": "Simply Wall St", "title": "Does Lundin Gold's (TSX:LUG) Reaffirmed 2026 Output Target Reinforce Its Operational Reliability Story?", "url": "https://simplywall.st/stocks/ca/materials/tsx-lug/lundin-gold-shares/news/does-lundin-golds-tsxlug-reaffirmed-2026-output-target-reinf", "captured_at": "2026-07-20T00:00:00Z"}]}, "harmony-gold-mining": {"company_id": "harmony-gold-mining", "accession_number": "0001628280-26-046150", "document_type": "trading_update", "document_type_label": "Atualização Pré-Fechamento do Ano Fiscal (Pre-Close Update) — Ano Fiscal 2026 completo (encerrado em 30/06/2026), NÃO é o resultado financeiro auditado completo", "sources": [{"filename": "sens-fy26ceoprexcloseupdat.htm", "label": "Atualização pré-fechamento do CEO para o ano fiscal 2026 (encerrado em 30/06/2026) — JSE SENS / Anexo ao Formulário 6-K", "source_url": "https://www.sec.gov/Archives/edgar/data/1023514/000162828026046150/sens-fy26ceoprexcloseupdat.htm", "captured_at": "2026-07-08T00:00:00Z"}], "tabs": {"earnings_summary": "**Atualização pré-fechamento do ano fiscal 2026 — divulgada em 30/06/2026, referente ao ano fiscal encerrado em 30/06/2026 (FY26)**\n\n- Meta de produção de ouro atingida pelo 11º ano consecutivo, com produção esperada entre 1,4 milhão e 1,5 milhão de onças no FY26 [PR]\n- Teor médio recuperado em operações subterrâneas de ~5,80 g/t [PR]\n- AISC dentro do intervalo de guidance; capex ligeiramente abaixo do planejado [PR]\n- Mina de cobre CSA (Austrália): produção próxima ao limite superior do guidance, entre 17.500-18.500 toneladas, com custos abaixo do guidance [PR]\n- Projeto Eva Copper: desmatamento pausado temporariamente após identificação de espécie protegida na área [PR]\n- Retorno recorde de R$ 4,4 bilhões em dividendos aos acionistas nos últimos 12 meses [PR]\n- Classificação ESG da MSCI elevada para 'A' [PR]\n- Resultados financeiros completos (auditados) agendados para 27/08/2026 [PR]\n\nIMPORTANTE: números preliminares/não auditados — sem receita/lucro/EBITDA ainda.", "conference_call_summary": "Atualização divulgada por escrito (SENS/6-K, assinado pelo CEO Beyers Nel), sem teleconferência associada. Apresentação de resultados do FY26 com call/webcast está agendada para 27/08/2026.", "commodity_commentary": "Não foi localizada cobertura dedicada da Bloomberg, Reuters, FT ou WSJ sobre esta atualização de 30/06/2026 até o momento (08/07/2026). O Seeking Alpha noticiou que as ações da Harmony (NYSE: HMY) tiveram reação de \"pouca variação\" no pregão do anúncio, com rating de consenso em \"Hold\" [Seeking Alpha].\n\nO contexto do mercado de ouro ajuda a explicar a reação modesta: segundo a CNBC, o ouro fechou o 2º trimestre de 2026 em recuo — à vista caindo ~0,8% para perto de US$ 3.975/oz —, descrito como o pior trimestre para o metal desde o 2T13 [CNBC]. Uma atualização operacional sólida mas dentro do esperado, sem surpresas de volume ou custo, não gerou reação forte no papel.\n\nVale notar que a ação da H radoras de ouro comparáveis, reflexo direto das sanções impostas pelos Estados Unidos, Reino Unido e União Europeia à companhia e a outros grandes produtores russos desde 2022-2023, que incluíram banimento às importações de ouro russo e o deslistamento dos certificados de depósito da Polyus da Bolsa de Londres em 2023 [Reuters]. Ainda assim, a Reuters cobriu os resultados financeiros da Polyus referentes ao exercício de 2025 (divulgados em março de 2026): o EBITDA ajustado subiu 12% na comparação anual, para US$ 6,35 bilhões, enquanto o lucro líquido ajustado recuou 3%, para US$ 3,3 bilhões, mesmo com a produção de ouro caindo 16%, para 2,5 milhões de onças, em corte planejado [Reuters]. A receita cresceu 19%, para US$ 8,7 bilhões, impulsionada pelo preço médio realizado do ouro refinado, que mais que compensou o menor volume vendido [Reuters].\n\nA reportagem da Reuters também mencionou que as sanções praticamente dobraram o custo estimado de desenvolvimento do projeto Sukhoi Log, na Sibéria, de US$ 3,3 bilhões para cerca de US$ 6 bilhões, e que a companhia projeta produção estável entre 2,5 e 2,6 milhões de onças em 2026, com o projeto entrando em plena operação apenas em 2029 [Reuters].\n\nPor honestidade, não foram localizadas nas fontes solicitadas (Bloomberg, Reuters, FT, WSJ) análises de bancos de investimento ocidentais, variações de preço em bolsas internacionais ou comentários de analistas sell-side associados a este resultado — o que é esperado, já que a ação da Polyus negocia apenas na bolsa de Moscou e está fora do radar da maior parte da cobertura de analistas ocidentais desde as sanções."}, "generated_by": "claude-research", "generated_at": "2026-07-07T00:00:00Z", "status": "summarized", "note_for_reviewer": "ATENÇÃO: polyus.com bloqueou acesso direto (connection refused, possível roteamento geográfico/sanções); conteúdo obtido via proxy de leitura (r.jina.ai), mesmo documento primário mas não capturado por acesso HTTP direto — recomenda-se nova verif rgens mais altas [PR]\n- Downstream Internacional: prejuízo de US$ 1.013 milhões, ante lucro de US$ 222 milhões — margens menores [PR]\n\n**Fluxo de Caixa e Capex**\n- CFFO: US$ 2,5 bilhões, ante US$ 5,2 bilhões no 1T25 — queda por maiores saídas de capital de giro [PR]\n- FCF: -US$ 1,5 bilhão, ante +US$ 1,3 bilhão no 1T25 [PR]\n- Capex: US$ 4,1 bilhões, ante US$ 3,9 bilhões no 1T25 [PR]\n\n**Produção**\n- Produção equivalente consolidada: 3.858 mil BOED, alta de 15% mundial e 24% nos EUA a/a, pela aquisição da Hess [PR]\n- Cortes de produção no Oriente Médio (Israel/Leviathan, Zona Neutra Arábia Saudita-Kuwait) por conflito regional [PR]\n\n**Retorno de Capital**\n- US$ 6,0 bilhões retornados no trimestre (US$ 2,5 bi recompras + US$ 3,5 bi dividendos) — 16º trimestre consecutivo acima de US$ 5 bilhões [PR]\n- Dividendo declarado: US$ 1,78/ação, pagável 10/06/2026 [PR]\n\n**ROCE**: 4,5% (1T26) vs 8,3% (1T25) [PR]", "conference_call_summary": "Nenhuma transcrição arquivada na SEC (Chevron disponibiliza apenas no próprio site de RI, fora do escopo desta pesquisa). Citação do CEO Mike Wirth no release: \"Despite heightened geopolitical volatility and related supply disruptions, Chevron delivered solid first quarter performance, underscoring the resilience of our portfolio.\"\n^Tradução livre: \"Apesar da volatilidade geopolítica acentuada e das interrupções de suprimento relacionadas, a Chevron entregou um desempenho sólido no primeiro trimestre, reforçando a resiliência do nosso portfólio.\"", "commodity_commentary": "A Bloomberg noticiou que a Chevron superou com folga as estimativas de Wall Street no primeiro trimestre de 2026, com lucro ajustado por ação de US$ 1,41 — 51 centavos acima da média das projeções de analistas consultados pela própria Bloomberg —, impulsionado pela alta dos preços do petróleo e gás natural e pelos ganhos de produção provenientes da aquisição da Hess Corporation [Bloomberg]. A produção mundial da companhia saltou 15% (24% nos EUA), compensando interrupções de fornecimento ligadas à guerra entre EUA/Israel e Irã, iniciada em 28 de fevereiro, que chegou a elevar os preços do petróleo em até 50% no trimestre [Bloomberg].\n\nApesar do resultado, o lucro líquido reportado (não ajustado) caiu para US$ 2,2 bilhões (US$ 1,11 por ação diluída), ante US$ 3,5 bilhões (US$ 2,00 por ação) um ano antes, penalizado por um encargo de US$ 2,9 bilhões relacionado a efeitos de tempo (timing) em avaliação de estoques e contratos de derivativos [Bloomberg]. A companhia devolveu US$ 6,0 bilhões em caixa aos acionistas no trimestre, a 16ª vez consecutiva acima de US$ 5 bilhões [Bloomberg].\n\nPosteriormente, a Bloomberg noticiou que a Berkshire Hathaway, de Warren Buffett, vendeu cerca de US$ 8 bilhões em ações da Chevron à medida que os preços do papel dispararam em maio, movimento associado pela reportagem ao contexto de valorização das petroleiras após a alta do petróleo provocada pela guerra no Oriente Médio [Bloomberg]. A reação imediata das ações ao balanço foi discreta diante da magnitude da surpresa positiva no lucro ajustado, sinal de que o mercado já vinha precificando boa parte do impacto da alta do petróleo antes da divulgação formal dos números [Bloomberg]."}, "generated_by": "claude-research", "generated_at": "2026-07-07T18:47:53Z", "status": "summarized", "note_for_reviewer": "8-K de 01/05/2026 (1T26) — release mais recente disponível em 07/07/2026. Nenhuma transcrição de call encontrada como documento primário na SEC.", "commentary_sources": [{"outlet": "Bloomberg", "title": "Chevron Blows Away Estimates on War-Driven Surge in Oil Prices", "url": "https://www.bloomberg.com/news/articles/2026-05-01/chevron-blows-away-estimates-on-war-driven-surge-in-oil-prices", "captured_at": "2026-07-08T00:00:00Z"}, {"outlet": "Bloomberg", "title": "Berkshire Sold $8 Billion of Chevron Shares as Prices Soared", "url": "https://www.bloomberg.com/news/articles/2026-05-15/berkshire-sold-8-billion-of-chevron-shares-as-prices-
